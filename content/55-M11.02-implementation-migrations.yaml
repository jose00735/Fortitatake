quiz:
  - id: M11.02.q01
    type: order
    tier: 1
    pretest: true
    stem: Put the migration phases in order.
    items: ["Discover what's used", "Convert (e.g. FortiConverter)", "Clean up rules and objects", "Lab test", "Cut over in a window with rollback", "Hypercare"]
    explanation: Conversion is a draft; cleanup and testing make it a migration.
  - id: M11.02.q02
    type: single
    tier: 2
    pretest: true
    stem: Why save pre-check outputs before a change?
    options:
      - {id: a, text: "They're the baseline to compare with after the change", correct: true}
      - {id: b, text: "Fortinet TAC asks for them before it opens a priority case", trap: misconception, why_wrong: "TAC may want outputs, but that isn't why you take them."}
      - {id: c, text: "They replace a config backup, as they show the full state", trap: misconception, why_wrong: "Outputs show state, not a restorable configuration."}
      - {id: d, text: "They prove to the customer the change window really started", trap: near-miss, why_wrong: "Evidence matters, but their job is comparison after the change."}
    explanation: Baseline evidence.
  - id: M11.02.q03
    type: single
    tier: 2
    stem: "An ASA has 'object network WEB / host 10.1.1.10 / nat (inside,outside) static 203.0.113.10'. FortiGate equivalent?"
    options:
      - {id: a, text: "A VIP from the public to the private IP, used by an inbound policy", correct: true}
      - {id: b, text: "An IP pool of 203.0.113.10 applied on the inbound firewall policies", trap: near-miss, why_wrong: "IP pools do source NAT; inbound static NAT needs a VIP."}
      - {id: c, text: "set nat enable on the inbound policy with 203.0.113.10 as source", trap: misconception, why_wrong: "Policy NAT is source NAT, not destination."}
      - {id: d, text: "A VIP plus a matching IP pool so both directions are translated", trap: near-miss, why_wrong: "A static VIP already covers both directions for the server's own traffic."}
    explanation: Static inbound NAT = VIP.
  - id: M11.02.q04
    type: single
    tier: 3
    stem: "Translating Palo Alto rules literally, inbound rules to published servers never match on FortiGate. Why?"
    options:
      - {id: a, text: "PAN matches pre-NAT IP with post-NAT zone; FortiGate needs the VIP and real egress port", correct: true}
      - {id: b, text: "The converter dropped the NAT rules, so the FortiGate has no VIPs for those servers yet", trap: near-miss, why_wrong: "Missing VIPs would break it too, but literal translation fails on the different semantics."}
      - {id: c, text: "FortiGate zones block intrazone traffic by default, so the server rules hit implicit deny", trap: near-miss, why_wrong: "Intrazone behaviour differs, but these rules cross zones; the NAT model is the issue."}
      - {id: d, text: "App-ID objects in those rules have no FortiGate equivalent, so the policies won't match", trap: misconception, why_wrong: "Application control maps imperfectly, but that isn't why nothing matches."}
    explanation: Different NAT/policy semantics.
  - id: M11.02.q05
    type: single
    tier: 2
    stem: At 01:15 the new firewall passes traffic but one critical app fails. The MOP's go/no-go is 01:30. Best action?
    options:
      - {id: a, text: "Assess with evidence; if it isn't fixed by 01:30, roll back as agreed", correct: true}
      - {id: b, text: "Keep trying fixes past 01:30, as most of the migration already works", trap: misconception, why_wrong: "Ignores the agreed limit and risks the morning."}
      - {id: c, text: "Roll back right away to be safe, without spending time on the cause", trap: near-miss, why_wrong: "Rollback may come, but use the 15 minutes to assess."}
      - {id: d, text: "Ask the app owner to accept the failure and fix it in tomorrow's window", trap: near-miss, why_wrong: "A critical app failing in the morning is the risk the go/no-go guards against."}
    explanation: Respect go/no-go.
  - id: M11.02.q06
    type: multi
    tier: 2
    stem: What belongs in a MOP's prerequisites? Select all that apply.
    options:
      - {id: a, text: "Fresh configuration backup", correct: true}
      - {id: b, text: "Tested console access", correct: true}
      - {id: c, text: "Licences and firmware path", correct: true}
      - {id: d, text: "Admin passwords in the MOP", trap: misconception, why_wrong: "Credentials never belong in documents or email."}
      - {id: e, text: "The as-built document", trap: near-miss, why_wrong: "The as-built is written after the change."}
    explanation: Be ready to recover.
  - id: M11.02.q07
    type: single
    tier: 3
    stem: During hypercare the customer asks for a new VPN to a partner. What do you do first?
    format: first-step
    options:
      - {id: a, text: "As a new request: a change request, separate from hypercare defects", correct: true}
      - {id: b, text: "As part of hypercare, since the customer is still in the support period", trap: misconception, why_wrong: "Hypercare covers your delivered work, not new scope."}
      - {id: c, text: "Do it quickly, then log it as a hypercare defect to keep things simple", trap: near-miss, why_wrong: "Mixing new work into defects hides cost and scope."}
      - {id: d, text: "Park it until hypercare ends, then let sales follow up with the customer", trap: near-miss, why_wrong: "Respond now through the right process rather than parking it."}
    explanation: Separate defects from new requests.
  - id: M11.02.q08
    type: single
    tier: 2
    stem: What makes an acceptance test plan useful?
    options:
      - {id: a, text: "Agreed before the change, with expected results, signed after", correct: true}
      - {id: b, text: "Written after go-live from the tests that worked on the night itself", trap: misconception, why_wrong: "Written afterwards it proves nothing."}
      - {id: c, text: "Built from FortiGate CLI checks so each result is objective", trap: near-miss, why_wrong: "Include business application tests, not just CLI output."}
      - {id: d, text: "Kept as an internal checklist for the delivery team to follow", trap: near-miss, why_wrong: "The customer agrees and signs it; that's what makes it acceptance."}
    explanation: Agreed up front, signed at the end.
  - id: M11.02.q09
    type: single
    tier: 3
    stem: Why is a migration a good moment for rule cleanup?
    options:
      - {id: a, text: "You're reviewing each rule anyway, so removing unused ones cuts risk", correct: true}
      - {id: b, text: "The new FortiGate model holds fewer policies than the old firewall did", trap: near-miss, why_wrong: "Model limits exist but are rarely the issue; the value is reduced risk."}
      - {id: c, text: "FortiConverter refuses rulebases that still contain shadowed rules", trap: misconception, why_wrong: "Cleanup is good practice, not a tool requirement."}
      - {id: d, text: "A smaller rulebase lets you skip the lab testing before the cutover", trap: near-miss, why_wrong: "Less to test, but you still test."}
    explanation: Cleanup is value you add.
  - id: M11.02.q10
    type: text
    tier: 2
    stem: "Fortinet's tool for converting other vendors' firewall configurations is called…"
    accept: ["forticonverter", "forti converter"]
    explanation: FortiConverter.

labs:
  - id: M11.02.lab1
    title: Translate ASA NAT to FortiGate
    goal: Rebuild an ASA static NAT for a web server and the outbound PAT on FortiGate (wan1 outside, dmz for the server, port2 inside).
    worked:
      config: |
        # ASA (source)
        # object network WEB
        #  host 10.1.1.10
        #  nat (dmz,outside) static 203.0.113.10
        # object network INSIDE-NET
        #  subnet 192.168.10.0 255.255.255.0
        #  nat (inside,outside) dynamic interface
        config firewall vip
            edit "WEB-VIP"
                set extintf "wan1"
                set extip 203.0.113.10
                set mappedip "10.1.1.10"
            next
        end
        config firewall policy
            edit 0
                set name "Internet-to-WEB"
                set srcintf "wan1"
                set dstintf "dmz"
                set srcaddr "all"
                set dstaddr "WEB-VIP"
                set action accept
                set schedule "always"
                set service "HTTPS"
            next
            edit 0
                set name "Inside-to-Internet"
                set srcintf "port2"
                set dstintf "wan1"
                set srcaddr "INSIDE-NET"
                set dstaddr "all"
                set action accept
                set schedule "always"
                set service "ALL"
                set nat enable
            next
        end
      notes:
        - "Static object NAT → VIP; the inbound policy uses the VIP, not the private IP."
        - "dynamic interface → set nat enable (egress interface IP)."
        - "Restrict service to what the server really offers."
    faded:
      template: |
        config firewall {{vip}}
            edit "WEB-VIP"
                set {{extintf}} "wan1"
                set extip 203.0.113.10
                set {{mappedip}} "10.1.1.10"
            next
        end
        config firewall policy
            edit 0
                set dstaddr "{{WEB-VIP}}"
            next
        end
    solo:
      prompt: "An ASA publishes SSH on 203.0.113.20 port 2222 to 10.1.1.20 port 22. Write the FortiGate VIP with port forwarding (external interface wan1)."
      required: ["config firewall vip", "set extintf \"wan1\"", "set extip 203.0.113.20", "set mappedip \"10.1.1.20\"", "set portforward enable", "set extport 2222", "set mappedport 22"]
      solution: |
        config firewall vip
            edit "SSH-VIP"
                set extintf "wan1"
                set extip 203.0.113.20
                set mappedip "10.1.1.20"
                set portforward enable
                set extport 2222
                set mappedport 22
            next
        end
      notes: "Then an inbound policy with dstaddr SSH-VIP and service SSH (the mapped port)."
  - id: M11.02.lab2
    title: Pre-checks and backup for a change window
    goal: Capture a baseline and a backup before changing a production HA cluster.
    worked:
      config: |
        # get system status
        # get system ha status
        # get router info routing-table all
        # get vpn ipsec tunnel summary
        # diagnose sys session full-stat
        # execute backup config tftp pre-change-fw1.conf 10.0.0.50
      notes:
        - "Save every output in the change record; repeat after the change and compare."
        - "Use SFTP/SCP targets where the customer allows; TFTP is shown here for brevity."
    faded:
      template: |
        # get system {{status}}
        # get system ha {{status}}
        # get router info {{routing-table}} all
        # get vpn ipsec tunnel {{summary}}
        # execute {{backup}} config tftp pre-change-fw1.conf 10.0.0.50
    solo:
      prompt: "Write the four pre-check commands for: firmware/serial, HA state, routing table, VPN tunnel summary."
      required: ["get system status", "get system ha status", "get router info routing-table all", "get vpn ipsec tunnel summary"]
      solution: |
        # get system status
        # get system ha status
        # get router info routing-table all
        # get vpn ipsec tunnel summary
      notes: "Add application tests that the customer cares about."

scenarios:
  - id: M11.02.sc1
    kind: situation
    tier: 3
    title: The 2 a.m. surprise
    situation: |
      Mid-migration from an ASA, the new FortiGate is live. Email and web work, but the payroll app at a partner fails. Go/no-go is in 20 minutes. The customer's IT manager says, "Just make it work, we can't roll back, payroll runs tomorrow."
    ask: What do you do?
    right_thinking:
      - "Stay calm and get evidence fast: sniffer and debug flow for the payroll flow"
      - "Likely a VPN or NAT translation difference"
      - "Be honest about the go/no-go; explain rollback is an option that protects payroll"
      - "Decide with the customer, document"
    what: A fast, evidence-based decision with the customer.
    why: Pressure creates bad changes; the MOP exists for this moment.
    how: ["Debug flow filtered on the partner IP", "Check VPN selectors/NAT against the ASA config", "Fix if clear and low-risk", "Otherwise roll back that part or all, per MOP"]
    model_answer: |
      I'd say: "Give me ten minutes of focused diagnosis." A filtered debug flow and the tunnel list for the partner usually show it fast: often the ASA did NAT inside the VPN, or the partner's selectors don't match ours. If the fix is clear and low-risk, I apply it and test payroll with them. If not, I'd remind the manager that rollback protects payroll tomorrow, and we can reconnect the old path for just that partner while we fix it properly. Either way the decision is theirs, made with facts, and I write it down.
    best_way: "Ten minutes of focused evidence; fix if clear and safe, otherwise roll back that flow to protect payroll."
    rubric: ["calm", "fast evidence", "honest options", "customer decides", "documented"]
  - id: M11.02.sc2
    kind: situation
    tier: 2
    title: '"Just copy the old rules"'
    situation: |
      A customer migrating from Check Point says: "Don't clean anything up. Copy the rules exactly. We don't have time."
    ask: How do you handle it?
    right_thinking:
      - "Respect the time constraint"
      - "Explain that a literal copy can still behave differently (implied rules, NAT)"
      - "Offer a minimal cleanup: only zero-hit and obviously broad rules, or a phase 2 cleanup"
    what: A pragmatic agreement.
    why: You protect the customer from hidden behaviour changes without forcing a big project.
    how: ["Agree on a like-for-like migration", "Flag implied rules and automatic NAT that must be explicit", "Propose phase-2 cleanup with hit counts"]
    model_answer: |
      Fine, we'll migrate like for like. One thing I can't skip: Check Point has implied rules and automatic NAT that aren't in the rule base, so I'll rebuild those explicitly, otherwise behaviour changes. After go-live, with a month of hit counts from FortiAnalyzer, I'd propose a short cleanup phase to remove unused rules. That keeps your timeline and gets you the cleanup later with data.
    best_way: "Like for like now, but implied rules and NAT rebuilt explicitly; cleanup later with hit-count data."
    rubric: ["respects constraint", "flags hidden behaviour", "phased proposal"]

interview:
  - id: M11.02.t01
    stage: technical
    question: What goes into your method of procedure for a firewall change?
    testing: Delivery discipline
    framework: "Sections"
    model_answer: |
      "Scope and approval, impact, prerequisites like a fresh backup and tested console access, pre-checks with saved outputs as a baseline, numbered steps, verification after each block, go/no-go times, a tested rollback, and who's informed when. A colleague should be able to run it without me."
    best_way: "Prerequisites, baseline pre-checks, steps, verification, go/no-go, tested rollback, communication."
    target: "0:40"
  - id: M11.02.t02
    stage: technical
    question: Where do firewall migrations usually break?
    testing: Migration experience
    framework: "Top risks"
    model_answer: |
      "NAT semantics first: ASA object NAT, Palo Alto's pre-NAT IP with post-NAT zone, Check Point's automatic NAT and implied rules all translate differently into FortiGate VIPs and policies. Then VPN parameters with partners, and rules that were never used or are too broad. So I convert with FortiConverter, then review NAT line by line, clean up with hit counts and test real application flows."
    best_way: "NAT semantics, partner VPNs and hidden rules. Convert, review NAT line by line, test real flows."
    target: "0:45"
  - id: M11.02.h01
    stage: hm
    question: Tell me about a change that went wrong and how you handled it.
    testing: Ownership and composure
    framework: "STAR-L (use a real case)"
    model_answer: |
      "[Use a real case, e.g. a FortiGate cut off by bad routing that you recovered over the console with a TFTP restore or a live static-route fix.] Focus on: staying calm, restoring service first, telling the customer clearly what happened, and what you changed in your process afterwards, such as always testing console access before a change."
    best_way: "Restore first, communicate clearly, then fix the process."
    target: "1:15"
  - id: M11.02.h02
    stage: hm
    question: How do you hand over a project so the customer can run it?
    testing: Customer outcome
    framework: "Pack → session → hypercare → sign-off"
    model_answer: |
      "A handover pack with as-built documentation and runbooks, a knowledge-transfer session, an agreed hypercare period, and the signed acceptance test plan. I also wrote KB articles and how-to guides at Netskope so customers could adopt features on their own, and I'd bring the same habit: leave them able to operate it without calling me."
    best_way: "As-built docs, runbooks, knowledge transfer, hypercare and signed acceptance."
    target: "0:40"

field_reports:
  - id: M11.02.fr1
    title: Change is a risk window
    body: |
      With **48 %** of breaches involving third parties and exploitation the top initial vector (2026 DBIR), every migration is also a security review: remove broad rules, close unused NAT, and log the new rule base from day one.
    source: Verizon 2026 DBIR
