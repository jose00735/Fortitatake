id: M2.01
title: "OSPF: neighbors, LSAs, areas and SPF"
stage: S2
stage_title: "S2 · Routing and WAN protocols"
order: 150
quality: 2
est_sessions: 1
objectives:
  - Walk through the OSPF neighbor states and name what each mismatch breaks
  - Explain DR/BDR election and why it exists on broadcast segments
  - Explain the main LSA types, areas, ABRs and ASBRs
  - Predict intra-area, inter-area and external routes and their metrics
  - Choose stub, totally stubby or NSSA areas for a branch design
sources:
  - "FortiOS 8.0.2 Admin Guide: Dynamic routing overview and OSPF (pp. 675–716), basic OSPF example and outputs (pp. 699–707)"
  - "Protocol knowledge: OSPFv2 (RFC 2328), NSSA (RFC 3101)"

units:
  - id: M2.01.u1
    title: How two routers become neighbors
    tier: 1
    est_min: 13
    body: |
      OSPF is a **link-state** IGP: every router floods descriptions of its links (LSAs), builds the same map (the
      LSDB), and runs Dijkstra's **SPF** algorithm to find shortest paths. Metric = **cost**, summed along the path.

      ## Neighbor states

      | State | What happened |
      |---|---|
      | Down | No hellos heard |
      | Init | I hear your hellos, but I'm not in yours yet |
      | 2-Way | We see each other. On broadcast segments, DROthers stop here with each other |
      | ExStart / Exchange | Master/slave chosen, database description (DBD) packets exchanged |
      | Loading | Requesting the LSAs I'm missing |
      | **Full** | Databases synchronized |

      ## What must match in the hello

      Area ID, subnet and mask, **hello and dead intervals**, authentication, the stub/NSSA flags, and the router IDs
      must differ. A mismatch here means **no neighbor at all**.

      **MTU** is checked later, in the DBD exchange: a mismatch leaves the pair stuck in **ExStart/Exchange**. That's
      why someone can "see the neighbor" and still have no routes.

      :::recall
      Q: One side says hello 10/dead 40, the other 2/8. Which state do they reach?
      A: None: the hellos are discarded, so the neighbor never appears.
      :::

      :::pitfall
      Duplicate router IDs (often from cloned VM configs) cause flapping and odd SPF results. Set router IDs
      explicitly, usually from a loopback.
      :::
  - id: M2.01.u2
    title: DR/BDR and network types
    tier: 2
    est_min: 10
    body: |
      On a **broadcast** segment with many routers, full adjacency between every pair would flood the same LSA many
      times. So routers elect a **Designated Router** and a **Backup DR**; everyone forms Full adjacencies only with them
      and stays **2-Way** with the other DROthers.

      Election: highest **priority** (default 1; 0 means "never DR"), then highest router ID. It's **not preemptive**: a
      better router joining later doesn't take over until the DR fails.

      **Point-to-point** network type skips the election: faster, and the right choice on /30 or /31 transit links,
      tunnels and most WAN links. Both sides must agree: one side broadcast and the other point-to-point usually
      breaks the adjacency or the routes.

      In FortiOS output, `Full/DR`, `Full/Backup` or `Full/DROther` is the **neighbor's** role (p. 705).

      :::why
      Q: Why set the network type to point-to-point on a FortiGate-to-core transit /29 with only two routers?
      A: There's nothing to gain from a DR with two routers, and skipping the election and wait timer speeds up adjacency and failover.
      :::
  - id: M2.01.u3
    title: LSAs, areas and route types
    tier: 2
    est_min: 14
    body: |
      | LSA | Name | Generated by | Scope |
      |---|---|---|---|
      | 1 | Router | Every router | Its area |
      | 2 | Network | The DR | Its area |
      | 3 | Summary | ABR | Other areas |
      | 4 | ASBR summary | ABR | How to reach an ASBR in another area |
      | 5 | AS external | ASBR | Whole domain (not stub areas) |
      | 7 | NSSA external | ASBR inside an NSSA | Its NSSA; the ABR translates it to type 5 |

      - **Area 0** is the backbone; every other area attaches to it through an **ABR**.
      - An **ASBR** redistributes routes from outside OSPF (static, connected, BGP).

      ## Route types in a routing table

      - **O** intra-area: from type 1/2 in your area.
      - **O IA** inter-area: from type 3.
      - **O E2** external type 2 (the default): the metric is the external metric only and doesn't grow inside OSPF.
      - **O E1** external type 1: external metric **plus** the internal cost.

      Preference: intra-area > inter-area > E1 > E2, regardless of metric.

      :::recall
      Q: A redistributed default route shows as O*E2 0.0.0.0/0 [110/10] on every router, whatever the distance from the ASBR. Why the same metric everywhere?
      A: E2 routes carry only the external metric; internal cost isn't added.
      :::
  - id: M2.01.u4
    title: Stub areas and branch designs
    tier: 3
    est_min: 10
    body: |
      | Area type | Blocks | Branch gets |
      |---|---|---|
      | Stub | Type 5 externals | Inter-area routes + a default from the ABR |
      | Totally stubby | Type 3 and 5 | Only a default route |
      | NSSA | Type 5, but allows local redistribution (type 7) | Inter-area routes, its own externals |

      Smaller areas mean smaller LSDBs and less SPF churn, useful for many small branches. On the other hand, a
      branch that only sees a default can't pick the best exit per prefix.

      ## Summarization

      Only at the edges: ABRs (`area range`) and ASBRs (summary addresses). One summary hides the flapping of every
      subnet behind it.

      :::ps
      Most FortiGate designs today use OSPF inside the campus or data center and BGP over the WAN or SD-WAN overlays.
      When a customer asks for OSPF across 200 branches, ask what problem it solves first: BGP with ADVPN or SD-WAN
      usually scales better.
      :::

cards:
  - {id: M2.01.c01, unit: M2.01.u1, tier: 1, front: "OSPF neighbor states in order", back: "Down, Init, 2-Way, ExStart, Exchange, Loading, Full."}
  - {id: M2.01.c02, unit: M2.01.u1, tier: 2, front: "Hello parameters that must match", back: "Area, subnet/mask, hello and dead intervals, authentication, stub/NSSA flags (router IDs must differ)."}
  - {id: M2.01.c03, unit: M2.01.u1, tier: 2, front: "Neighbor stuck in ExStart/Exchange: classic cause", back: "MTU mismatch."}
  - {id: M2.01.c04, unit: M2.01.u1, tier: 1, front: "OSPF's metric", back: "Cost, summed along the path."}
  - {id: M2.01.c05, unit: M2.01.u2, tier: 2, front: "DR election order", back: "Highest priority (0 = never), then highest router ID. Not preemptive."}
  - {id: M2.01.c06, unit: M2.01.u2, tier: 2, front: "Why DROthers stay in 2-Way with each other", back: "They only need Full adjacencies with the DR/BDR, which reduces flooding."}
  - {id: M2.01.c07, unit: M2.01.u2, tier: 2, front: "Network type for a two-router transit link", back: "Point-to-point: no DR election, faster adjacency."}
  - {id: M2.01.c08, unit: M2.01.u3, tier: 2, front: "LSA type 3", back: "Summary LSA, generated by an ABR for other areas."}
  - {id: M2.01.c09, unit: M2.01.u3, tier: 2, front: "LSA type 5 vs 7", back: "5: AS external from an ASBR, domain-wide. 7: NSSA external, translated to 5 by the ABR."}
  - {id: M2.01.c10, unit: M2.01.u3, tier: 2, front: "E1 vs E2", back: "E1 adds internal cost; E2 (default) keeps only the external metric."}
  - {id: M2.01.c11, unit: M2.01.u3, tier: 2, front: "OSPF route preference by type", back: "Intra-area > inter-area > E1 > E2."}
  - {id: M2.01.c12, unit: M2.01.u4, tier: 2, front: "Stub vs totally stubby", back: "Stub blocks type 5; totally stubby also blocks type 3. Both get a default from the ABR."}
  - {id: M2.01.c13, unit: M2.01.u4, tier: 3, front: "Where can OSPF summarize?", back: "Only at ABRs (area ranges) and ASBRs (external summaries)."}
  - {id: M2.01.c14, unit: M2.01.u1, tier: 1, front: "OSPF administrative distance on FortiOS", back: "110."}

quiz:
  - id: M2.01.q01
    type: single
    tier: 1
    pretest: true
    stem: "Two routers see each other as neighbors but stay in ExStart. Most likely cause?"
    options:
      - {id: a, text: "An interface MTU mismatch", correct: true}
      - {id: b, text: "Mismatched hello intervals", trap: near-miss, why_wrong: "They wouldn't become neighbours at all."}
      - {id: c, text: "Different OSPF process IDs", trap: misconception, why_wrong: "Process IDs are local and never compared."}
      - {id: d, text: "Duplicate router IDs on them", trap: near-miss, why_wrong: "Duplicate RIDs cause flapping and odd LSDB behaviour, not a stall at ExStart."}
    explanation: "MTU is checked in DBD packets during ExStart/Exchange."
  - id: M2.01.q02
    type: single
    tier: 2
    pretest: true
    stem: "Router A (priority 1, RID 10.0.0.9) is DR. Router B (priority 200) joins the segment. What happens?"
    options:
      - {id: a, text: "A stays DR until it fails or restarts", correct: true}
      - {id: b, text: "B becomes DR at once on higher priority", trap: misconception, why_wrong: "DR election in OSPF isn't preemptive."}
      - {id: c, text: "B becomes BDR now and DR at A's failure", trap: near-miss, why_wrong: "Only if the BDR role is free; and B takes over only when A fails."}
      - {id: d, text: "B becomes DR if its RID is also higher", trap: near-miss, why_wrong: "Priority beats RID, but election still isn't preemptive."}
    explanation: "DR election isn't preemptive."
  - id: M2.01.q03
    type: order
    tier: 2
    stem: "Order OSPF route preference."
    items: ["Intra-area (O)", "Inter-area (O IA)", "External type 1 (E1)", "External type 2 (E2)"]
    explanation: "Type beats metric."
  - id: M2.01.q04
    type: multi
    tier: 2
    stem: "Which must match for two routers to become OSPF neighbors? Select all that apply."
    options:
      - {id: a, text: "Hello and dead intervals", correct: true}
      - {id: b, text: "The area ID on the link", correct: true}
      - {id: c, text: "Authentication settings", correct: true}
      - {id: d, text: "The router IDs of both", trap: misconception, why_wrong: "Router IDs must differ, not match."}
      - {id: e, text: "The interface OSPF cost", trap: near-miss, why_wrong: "Costs are local and can differ per side."}
    explanation: "Cost is local; router IDs must be unique."
  - id: M2.01.q05
    type: single
    tier: 2
    stem: "Which area type lets a branch redistribute its local static routes while blocking type 5 LSAs?"
    options:
      - {id: a, text: "NSSA", correct: true}
      - {id: b, text: "Stub", trap: near-miss, why_wrong: "Stub areas block type 5 but allow no ASBR inside."}
      - {id: c, text: "Totally stubby", trap: near-miss, why_wrong: "Blocks externals and summaries, still with no ASBR."}
      - {id: d, text: "Backbone", trap: misconception, why_wrong: "Area 0 carries type 5 LSAs."}
    explanation: "NSSA uses type 7 for local externals."
  - id: M2.01.q06
    type: "numeric"
    tier: 2
    answer: 2
    stem: "Which LSA type number does the DR generate for a broadcast segment?"
    accept: ["2", "type 2", "network", "network lsa"]
    explanation: "Type 2, the network LSA."
  - id: M2.01.q07
    type: "output"
    tier: 3
    output: |
      FGT-BR3 # get router info routing-table ospf
      O*E2    0.0.0.0/0 [110/10] via 10.0.13.1, port3, 00:41:12
      FGT-BR9 # get router info routing-table ospf
      O*E2    0.0.0.0/0 [110/10] via 10.0.19.1, port3, 00:41:09
    stem: "BR3 is one hop from the ASBR, BR9 is four hops away. Why do both show [110/10]?"
    options:
      - {id: a, text: "It's an E2 route, so the internal path cost isn't added", correct: true}
      - {id: b, text: "The links all have cost 0 in this area, so totals match", trap: misconception, why_wrong: "OSPF costs are at least 1."}
      - {id: c, text: "It's an E1 route, and E1 keeps the metric set at the ASBR", trap: near-miss, why_wrong: "Reversed: E1 adds internal cost, E2 doesn't."}
      - {id: d, text: "It's an inter-area summary, so each ABR resets the cost", trap: near-miss, why_wrong: "A redistributed default from an ASBR is external, not inter-area."}
    explanation: "E2 doesn't add internal cost; E1 does."

labs:
  - id: M2.01.lab1
    title: Diagnose an adjacency from the state alone
    goal: "Map each neighbor symptom to its most likely cause."
    worked:
      config: |
        # Symptom on 'get router info ospf neighbor'      → likely cause
        # (no entry at all)                               → hello/dead, area, auth, mask, passive interface
        # Init                                            → one-way: ACL/firewall blocking 224.0.0.5, or unicast issue
        # 2-Way with a DROther                            → normal on broadcast segments
        # ExStart / Exchange forever                      → MTU mismatch
        # Full but routes missing                         → filtering, area type, summarization, distance
      notes:
        - "State first, then debug: `diagnose ip router ospf all enable`."
        - "Full/DROther between two non-DR routers is normal."
    faded:
      template: |
        # ExStart forever → {{MTU}} mismatch
        # No neighbor     → {{hello}} / dead / area / auth mismatch
        # 2-Way           → normal between {{DROther}} routers
    solo:
      prompt: "Write the OSPF neighbor states in order, one per line."
      required: ["down", "init", "2-way", "exstart", "exchange", "loading", "full"]
      solution: |
        Down
        Init
        2-Way
        ExStart
        Exchange
        Loading
        Full
      notes: "Attempt applies to NBMA networks only."

scenarios:
  - id: M2.01.sc1
    kind: situation
    tier: 3
    title: "\"OSPF is up, so it's not the network\""
    situation: |
      After a core switch swap, an integrator says OSPF is fine because "the FortiGate is in the neighbor list". The
      warehouse has no routes. The neighbor state is EXSTART.
    ask: "Explain to the integrator and the customer."
    right_thinking:
      - "Neighbor listed ≠ adjacency Full"
      - "ExStart points at MTU (jumbo on the new switch)"
      - "Short-term mtu-ignore or match MTU; long-term consistent MTU"
    what: "A clear explanation and a fix plan."
    why: "Precise language avoids blame games."
    how: ["Show state", "Name the check", "Fix options", "Plan"]
    model_answer: |
      "The FortiGate hears the switch's hellos, so it's listed, but they're stuck in ExStart, which means they never
      exchanged databases, so no routes. That state points at an MTU mismatch: the new switch uses jumbo frames on the
      uplink. We can set mtu-ignore now to restore service and align MTUs in the next window."
    best_way: "State, cause, now, later."
    rubric: ["accurate states", "names MTU", "short- and long-term fix"]

interview:
  - id: M2.01.t01
    stage: technical
    question: "An OSPF neighbor is stuck in ExStart. What do you check?"
    testing: "OSPF state machine"
    framework: "State → check → fix"
    model_answer: |
      "ExStart means hellos match but the database description exchange fails, and the classic cause is an MTU
      mismatch between the two interfaces. I'd compare MTUs, run the OSPF debug, and either align the MTU or set
      mtu-ignore as a temporary fix."
    best_way: "Name the state's meaning first."
    target: "0:30"
  - id: M2.01.t02
    stage: technical
    question: "Explain E1 vs E2 routes."
    testing: "OSPF external metrics"
    framework: "Definition → when it matters"
    model_answer: |
      "Both are external routes from an ASBR. E2, the default, keeps only the external metric, so every router sees
      the same cost. E1 adds the internal cost to reach the ASBR, so with two ASBRs advertising the same prefix, E1
      lets each router pick the closest exit."
    best_way: "Definition plus the two-ASBR case."
    target: "0:35"
