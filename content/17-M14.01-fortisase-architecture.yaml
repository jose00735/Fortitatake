quiz:
  - id: M14.01.q01
    type: single
    tier: 2
    pretest: true
    stem: "Contractors use their own unmanaged laptops and only need web apps. Which FortiSASE steering method fits?"
    options:
      - {id: a, text: "Agentless proxy with a PAC file, authenticating users at the proxy", correct: true}
      - {id: b, text: "FortiClient agent with an endpoint profile pushed from the FortiSASE portal", trap: near-miss, why_wrong: "Best protection, but contractors' unmanaged devices usually can't take your agent."}
      - {id: c, text: "A FortiExtender LAN extension shipped to each contractor's home", trap: near-miss, why_wrong: "A site solution for a LAN, not for individual unmanaged laptops."}
      - {id: d, text: "Branch On-ramp IPsec from each contractor's home router to a PoP", trap: misconception, why_wrong: "Home routers aren't managed branch devices; this is for sites."}
    explanation: "Agentless proxy suits unmanaged devices and browser-based apps; accept that non-browser traffic isn't covered."
  - id: M14.01.q02
    type: single
    tier: 4
    stem: "After enabling SSL-to-IPsec transition mode and moving a pilot group to the IPsec profile, the pilot users get an SSO error at login. SSL users are fine. What is the most likely cause?"
    options:
      - {id: a, text: "The IdP lacks the new service-provider values with port 11443 for IPsec SSO", correct: true}
      - {id: b, text: "The Default IPsec endpoint profile is still disabled for the pilot group's users", trap: near-miss, why_wrong: "Then the clients wouldn't try IPsec at all; they'd stay on SSL."}
      - {id: c, text: "The pilot group's policies still reference groups matched by Agent SSO (Legacy)", trap: near-miss, why_wrong: "That breaks policy matching after login, not the SSO login itself."}
      - {id: d, text: "The max concurrent IPsec clients value is set below the pilot group's size", trap: near-miss, why_wrong: "Would refuse tunnels beyond the limit, not produce an SSO error for everyone."}
    explanation: "IPsec agent SSO uses a copy of the SSO settings with :11443 appended to the SP URLs; the IdP must be updated with them."
  - id: M14.01.q03
    type: single
    tier: 4
    stem: "Pilot users now log in over IPsec but land on the implicit deny for apps they reached yesterday over SSL. What do you check?"
    options:
      - {id: a, text: "Whether the groups in those rules are matched through the IPsec SSO source", correct: true}
      - {id: b, text: "Whether the IPsec client range sits outside the old SSL pool used by the policies", trap: near-miss, why_wrong: "The IPsec range is carved inside the old pool, so address-based rules usually still match."}
      - {id: c, text: "Whether the endpoint profile has split tunnel enabled for the internal application", trap: near-miss, why_wrong: "Split tunnel decides what enters the tunnel, not which policy matches traffic inside it."}
      - {id: d, text: "Whether the policies were pushed to the PoPs, since IPsec agents need a policy sync", trap: misconception, why_wrong: "There's no separate push for IPsec; the policy didn't match the users' groups."}
    explanation: "Groups must match through the IPsec Agent SSO source; groups built on the legacy (SSL) source don't match IPsec users, so the policies fall through to the implicit deny."
  - id: M14.01.q04
    type: single
    tier: 3
    stem: "A customer's branch LANs use 100.65.10.0/24 because 'it's CGNAT space nobody uses'. What's the issue for FortiSASE?"
    options:
      - {id: a, text: "It overlaps the default IPAM pool for agents and edges, 100.65.0.0/16", correct: true}
      - {id: b, text: "It overlaps the default edge control-plane subnet, 10.252.0.0/16", trap: near-miss, why_wrong: "That subnet is 10.252.0.0/16, not in 100.64.0.0/10."}
      - {id: c, text: "It is public address space, so the PoPs would route it to the internet", trap: misconception, why_wrong: "100.64.0.0/10 is shared address space (RFC 6598), not public."}
      - {id: d, text: "It is too small, since the IPAM pool needs a /16 per PoP", trap: near-miss, why_wrong: "The size is not the problem; the overlap with the reserved pool is."}
    explanation: "100.65.0.0/16 is FortiSASE's default IPAM pool for agents and edge devices, so customer networks must avoid it (or choose another pool range)."
  - id: M14.01.q05
    type: multi
    tier: 3
    stem: "Dedicated egress IPs are being added to the PoPs next weekend. What must be updated to avoid outages? Select all that apply."
    options:
      - {id: a, text: "SaaS conditional-access and IP allow-lists that name the old PoP addresses", correct: true}
      - {id: b, text: "On-premises outbound filters that allow traffic to the PoP addresses", correct: true}
      - {id: c, text: "Policies on the SPA hub that restrict the IPsec mode-config address space", correct: true}
      - {id: d, text: "The PAC file, so browsers send traffic to the new egress addresses", trap: near-miss, why_wrong: "The PAC file points clients at the proxy entry, not at egress addresses."}
      - {id: e, text: "Endpoint profiles, so agents learn which egress address to use", trap: misconception, why_wrong: "Egress is chosen at the PoP; agents don't select it."}
    explanation: "Anything that trusts the PoP's addresses (SaaS conditional access, on-prem filters, SPA-hub policies) must learn the new ones first."
  - id: M14.01.q06
    type: single
    tier: 3
    stem: "Which statement about split tunnel for FortiSASE agents is correct?"
    options:
      - {id: a, text: "Windows agents support application-based split or full tunnel; other platforms use full tunnel", correct: true}
      - {id: b, text: "All platforms support application-based split tunnel once IPsec agents are enabled on the instance", trap: near-miss, why_wrong: "Application-based split tunnel is a Windows capability; other platforms use full tunnel."}
      - {id: c, text: "Split tunnel is configured per policy, so each policy decides what bypasses the PoP", trap: misconception, why_wrong: "It's part of the endpoint profile, decided before traffic reaches the PoP's policies."}
      - {id: d, text: "macOS agents support split by destination IP, and Windows agents split by FQDN", trap: near-miss, why_wrong: "Invented split by platform; the documented difference is application-based on Windows vs full tunnel elsewhere."}
    explanation: "On Windows, FortiClient supports application-based split tunnel or full tunnel with FortiSASE; other platforms use full tunnel."
  - id: M14.01.q07
    type: order
    tier: 3
    stem: "Order the SSL-to-IPsec migration for a 2,000-user instance."
    items: ["Enable transition mode and size max concurrent IPsec clients", "Give the IdP the new SP values (port 11443) and fix group matches", "Enable the Default IPsec profile for a pilot group, ordered above Default", "Validate login, policies, split tunnel and logs with the pilot", "Expand by groups, then retire the SSL profiles"]
    explanation: "Capacity and identity first, then a pilot, then waves."
  - id: M14.01.q08
    type: single
    tier: 4
    format: first-step
    stem: "A customer with 800 users on an on-prem FortiClient EMS buys FortiSASE and wants all laptops moved 'this weekend'. What is the best first step?"
    options:
      - {id: a, text: "Rebuild the needed profiles in FortiSASE's EMS and pilot a move with a small group", correct: true}
      - {id: b, text: "Export the EMS configuration and import it into FortiSASE before moving any of the laptops", trap: near-miss, why_wrong: "The EMS configuration isn't preserved in the shift; profiles must be rebuilt."}
      - {id: c, text: "Move all 800 endpoints at once with the switch-to-cloud action and the code", trap: near-miss, why_wrong: "Technically possible, but untested profiles on 800 laptops is a weekend outage."}
      - {id: d, text: "Uninstall FortiClient everywhere and push the FortiSASE installer by GPO", trap: misconception, why_wrong: "Unnecessary churn; EMS can move endpoints to the cloud with the invitation code."}
    explanation: "FortiSASE uses its own EMS instance and old configuration isn't carried over: rebuild, pilot, then move in waves."
  - id: M14.01.q09
    type: text
    tier: 3
    stem: "Which port does the FortiSASE explicit proxy use (for example, after dedicated IPs are enabled)?"
    accept: ["9443", "tcp 9443", "tcp/9443"]
    explanation: "9443."

labs:
  - id: M14.01.lab1
    title: SSL-to-IPsec runbook
    goal: "Write the runbook for moving a pilot group to IPsec agents."
    worked:
      config: |
        # Pre-checks: FortiClient 7.4 on pilot laptops; transition mode on; max concurrent IPsec clients sized
        # Identity:   Access & authentication > SSO > IPsec tab: copy SP values (with :11443) into the IdP app
        # Groups:     create/adjust groups matched by 'Agent SSO' (IPsec), not only 'Agent SSO (Legacy)'
        # Policies:   reference the IPsec-matched groups (or both during the transition)
        # LDAP users: enable EAP for LDAP authentication
        # Profile:    enable 'Default IPsec', assign the pilot group, order above 'Default'
        # Validate:   login, policy hits in logs, split tunnel/DNS, internal app via SPA, reconnect after sleep
        # Rollback:   unassign the pilot group from the IPsec profile; clients fall back to SSL
    faded:
      template: |
        # IdP needs the SP values with port {{11443}}
        # Groups for IPsec match through {{Agent SSO}}
        # Enable the {{Default IPsec}} profile and order it above Default
    solo:
      prompt: "Write the five transition checks, one per line: client, idp, groups, profile, validate."
      required: ["forticlient", "idp", "group", "profile", "validat"]
      solution: |
        FortiClient 7.4 on pilot laptops
        IdP updated with :11443 SP values
        groups matched via Agent SSO
        Default IPsec profile enabled and ordered
        validate login, policies, logs
      notes: "Rollback is unassigning the profile."

scenarios:
  - id: M14.01.sc1
    kind: situation
    tier: 4
    title: "VPN replacement for 1,200 remote users"
    situation: |
      A logistics company runs FortiGate SSL VPN for 1,200 remote users, Entra ID for identity, and a DC behind a
      FortiGate. Auditors want internet traffic of remote users inspected too. They bought FortiSASE.
    ask: "Outline the delivery plan."
    right_thinking:
      - "Discovery: apps (internet, SaaS, private), user groups, devices (managed or not), identity, current split tunnel"
      - "Identity first: Entra ID SSO for agents (IPsec), groups mapped to policies"
      - "SIA policies and profiles, SSL inspection with CA distribution"
      - "SPA for private apps: DC FortiGate as hub (BGP per overlay), or ZTNA for specific apps"
      - "Pilot, waves by group, success criteria, decommission SSL VPN"
      - "Logs to their FortiAnalyzer through SPA for the SOC"
    what: "Identity-first SASE rollout: SIA, then SPA, in waves, with SOC logging."
    why: "Identity and private access are where SASE rollouts break; doing them first de-risks the waves."
    how: ["Discovery", "SSO and groups", "SIA policies", "SPA hub", "Pilot and waves", "Logging"]
    model_answer: |
      "First discovery: which apps are internet, SaaS or private, and whether every laptop is managed. Then identity:
      Entra ID SSO for IPsec agents, with the groups that will drive policy. We build SIA policies and profiles,
      including SSL inspection with the CA pushed to the laptops. For private apps the DC FortiGate becomes an SPA hub
      over IPsec and BGP. Then a 50-user pilot, waves by department with clear success criteria, and only then we turn
      off SSL VPN. Logs go to their FortiAnalyzer over SPA so the SOC sees remote users."
    best_way: "Identity first, then internet, then private apps, in waves — and the SOC sees it all."
    rubric: ["discovery", "identity first", "SIA and SPA", "waves with criteria", "SOC logging"]

interview:
  - id: M14.01.t01
    stage: technical
    question: "Explain FortiSASE to a customer who knows FortiGate."
    testing: "Clear positioning"
    framework: "Same engine, different place, new sizing"
    model_answer: |
      "It's the FortiOS security you know — the same policies and profiles — running in Fortinet's PoPs instead of on
      your box. Users and sites steer traffic there with FortiClient, a thin edge like FortiExtender, IPsec from a
      branch, or a browser proxy. It covers internet access, private apps through your FortiGate hubs or ZTNA, and
      SaaS with CASB. You stop sizing hardware and start sizing users and PoPs."
    best_way: "Same FortiOS security, delivered from the PoP, sized by users."
    target: "0:40"
  - id: M14.01.t02
    stage: technical
    question: "You know Netskope well. How does that help with FortiSASE?"
    testing: "Transferable SSE experience, honestly mapped"
    framework: "Concept map + honest differences"
    model_answer: |
      "The concepts carry over: steering traffic from the client, policy by user and app, SSL inspection, DLP and
      private app access. At Netskope I rolled the client out through Intune and fixed steering and policy bypasses in
      real deployments. In FortiSASE the steering lives in endpoint profiles, the policy model is FortiOS, and private
      access goes through FortiGate SPA hubs or ZTNA — so I'd lean on my FortiOS years there. I'd be clear that my
      hands-on FortiSASE time is lab and study, not production."
    best_way: "Same SSE concepts I ran at Netskope, mapped to FortiOS policy and SPA hubs — honest about lab-only time."
    target: "0:50"
