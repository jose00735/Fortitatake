    title: Third parties on the path
    body: |
      Third-party involvement appeared in **48 %** of breaches in the 2026 DBIR. SD-WAN often brings new ISPs, cloud on-ramps and managed services into the design. Segment overlays and inspect traffic between zones instead of trusting every path equally.
    source: Verizon 2026 DBIR
