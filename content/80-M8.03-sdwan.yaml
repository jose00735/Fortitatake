scenarios:
  - id: M8.03.sc1
    kind: situation
    tier: 3
    title: '"SD-WAN isn''t working, Teams is bad again"'
    situation: |
      A retail customer with 40 branches complains Teams calls are choppy at several stores, "even though we paid for SD-WAN".
    ask: How do you approach it, technically and with the customer?
    right_thinking:
      - "Ask what 'bad' means: which stores, when, symptoms"
      - "Check whether a rule matches Teams at all, and with which strategy"
      - "Check the health check: probing the right destination? realistic targets?"
      - "Use data from the FortiGates to show the link quality per store"
    what: A data-backed diagnosis and a rule/SLA change for real-time traffic.
    why: SD-WAN only steers as well as its rules and probes are designed.
    how:
      - "service4 and session list: does Teams hit a rule or the implicit rule?"
      - "health-check: loss/jitter on each member at those stores"
      - "Add or fix an ISDB-based Teams rule with Best Quality on jitter or loss"
      - "Pilot in two stores, measure, then roll out"
    model_answer: |
      First I'd make "bad" specific: which stores, what times, and what users see. Then I'd look at one affected FortiGate. Often Teams isn't matched by any rule and falls into the implicit rule, which load-balances by source IP without looking at quality. I'd also check the health check: if it probes a generic site with default 5 ms targets, the data isn't meaningful. The fix is a Teams rule using the Internet Service Database with Best Quality on jitter or packet loss, and a probe on a relevant destination with realistic thresholds. I'd pilot it in two stores, show the customer before-and-after numbers, then roll it out with FortiManager.
    could_have_added: ["Check whether the issue is the store Wi-Fi, not the WAN"]
    best_way: "Make 'bad' specific, check whether Teams even hits a rule, fix the rule and probe, pilot, then show the numbers."
    rubric: ["clarifies symptoms", "rule vs implicit", "probe design", "pilot and measure"]
  - id: M8.03.sc2
    kind: situation
    tier: 2
    title: Choosing strategies in a design workshop
    situation: |
      In a kickoff workshop the customer lists three traffic types: ERP to the data centre over the overlay, voice, and nightly backups to cloud storage. Two ISPs per site.
    ask: Propose a strategy per traffic type and explain it simply.
    right_thinking:
      - "Map business need to strategy"
      - "ERP: reliable, cost-aware → Lowest Cost (SLA) over overlays"
      - "Voice: best link now → Best Quality on jitter/loss"
      - "Backups: throughput → Maximize Bandwidth"
    what: A short strategy table the customer can sign off.
    why: Strategy choice is a business decision expressed in config.
    how: ["One line per app: need → strategy → SLA numbers", "Agree thresholds", "Turn it into the test plan"]
    model_answer: |
      ERP needs to be reliable and doesn't need the best link at every moment, so Lowest Cost (SLA): the preferred overlay while it meets the targets, failing over when it doesn't. Voice needs the best link right now, so Best Quality on jitter or packet loss. Backups need throughput and tolerate delay, so Maximize Bandwidth across links that meet SLA. I'd put that in a table with the thresholds you agree, and it becomes our test plan for go-live.
    best_way: "ERP: Lowest Cost. Voice: Best Quality. Backups: Maximize Bandwidth. Agreed thresholds become the test plan."
    rubric: ["correct mapping", "plain explanation", "thresholds agreed", "test plan"]
  - id: M8.03.sc3
    kind: hypothetical
    tier: 3
    title: What if the rule looks right but traffic ignores it?
    situation: |
      During a migration, a rule sends 10.60.0.0/16 to the overlay, but traffic still leaves via the old MPLS router interface.
    ask: What's your hypothesis and how do you prove it?
    right_thinking:
      - "Routing decides whether SD-WAN rules are consulted"
      - "Look for a more specific route or a policy route via the old path"
      - "Policy routes come before SD-WAN rules"
    what: Proof that routing or a policy route bypasses SD-WAN.
    why: Migrations leave old routes and policy routes behind.
    how: ["get router info routing-table all for 10.60.x", "diagnose firewall proute list", "diagnose ip proute match", "Remove or change the old route in a window"]
    model_answer: |
      I'd suspect the old path is still winning before SD-WAN is even consulted. By default the rule is only used if the FIB best match is an SD-WAN member, and policy routes are checked before SD-WAN rules. So I'd check the routing table for 10.60.0.0, and diagnose firewall proute list for a leftover policy route. diagnose ip proute match shows what a test packet would actually use. Then we remove or adjust the old route in the change window.
    best_way: "An old route or policy route is winning before SD-WAN is consulted. Routing table, proute list and proute match prove it."
    rubric: ["routing-first reasoning", "policy route order", "proof commands"]

interview:
  - id: M8.03.t01
    stage: technical
    question: Explain how FortiGate SD-WAN decides which link a session uses.
    testing: End-to-end understanding
    framework: "Routing → rules → strategy → implicit"
    model_answer: |
      "Members are grouped into zones, and health checks measure each member. When a new session arrives, policy routes are checked first, then SD-WAN rules in order. A rule only applies if routing points the destination at SD-WAN, and its strategy picks the member: manual order, best quality on a metric, lowest cost that meets the SLA, or maximize bandwidth. If no rule matches, the implicit rule load-balances with ECMP, by source IP by default."
    best_way: "Policy routes, then SD-WAN rules with a strategy and health data, then the implicit ECMP rule."
    target: "0:50"
  - id: M8.03.t02
    stage: technical
    question: How would you design health checks for a SaaS application?
    testing: Practical design
    framework: "Server → protocol → targets → timers"
    model_answer: |
      "Probe something on the application's path, ideally the SaaS provider's endpoint, with HTTP or HTTPS if ping is filtered, and two servers so one dead server doesn't fail the link. Set targets from what the app needs, slightly inside the limit, because the 5 ms defaults would flap on any real internet link. And keep failtime and recoverytime so it doesn't bounce."
    best_way: "Probe the app's path with two servers, realistic targets, and damping timers."
    target: "0:40"
  - id: M8.03.t03
    stage: technical
    question: An SD-WAN rule doesn't match the traffic you expect. What do you check?
    testing: Troubleshooting depth
    framework: "Routing → policy routes → rule match → commands"
    model_answer: |
      "First routing: by default a rule is only consulted if the FIB best match is an SD-WAN member, so a more specific route elsewhere bypasses it. Then policy routes, which come first. Then the rule's match criteria and order. diagnose sys sdwan service4 shows the rule's selection, diagnose firewall proute list the installed result, and diagnose ip proute match what a given packet would use."
    best_way: "Routing first, then policy routes, then the rule. service4, proute list and proute match prove it."
    target: "0:45"
  - id: M8.03.h01
    stage: hm
    question: Tell me about a rollout you planned with a customer. How did you make sure it succeeded?
    testing: Delivery approach (bridge from your Netskope rollouts)
    framework: "STAR: plan, pilot, measure, scale"
    model_answer: |
      "[Use your Netskope rollout story: the account you took from below 50 % to 70 % utilisation.] Show the same pattern you'd use for SD-WAN: agree success criteria first, pilot with a small group, measure, adjust, then scale with the customer and partner, with a clear communication plan."
    best_way: "Success criteria, pilot, measure, scale: the same pattern for SD-WAN."
    target: "1:15"
  - id: M8.03.t04
    stage: technical
    question: When would you choose Lowest Cost (SLA) over Best Quality?
    testing: Strategy judgement
    framework: "Definition → example"
    model_answer: |
      "Lowest Cost uses the cheapest link as long as it meets the SLA targets, so it's for business apps that need good enough, like SaaS over broadband with MPLS as backup. Best Quality always picks the link with the best metric, so it's for real-time traffic like voice, where the best link right now matters more than cost."
    best_way: "Lowest Cost for good-enough-and-cheap, Best Quality for real-time."
    target: "0:30"

field_reports:
