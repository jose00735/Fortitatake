    title: AI traffic is now normal traffic
    body: |
      **45 %** of employees are regular AI users on corporate devices (2026 DBIR). Expect customers to ask for SaaS and AI services to get specific steering and security inspection: plan ISDB-based rules and SSL inspection together.
