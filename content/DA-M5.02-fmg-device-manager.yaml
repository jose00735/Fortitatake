quiz:
  - id: M5.02.q01
    type: single
    tier: 1
    pretest: true
    stem: "Which FortiManager feature lets a new branch FortiGate get its config automatically when it first connects?"
    options:
      - {id: a, text: "Model device (zero-touch provisioning)", correct: true}
      - {id: b, text: "Log fetching", why_wrong: "FortiAnalyzer feature."}
      - {id: c, text: "Revision diff", why_wrong: "History."}
      - {id: d, text: "Policy block", why_wrong: "Policy reuse."}
    explanation: "Matched by serial."
  - id: M5.02.q02
    type: single
    tier: 2
    stem: "200 branches each need the same NTP and DNS settings. Best tool?"
    options:
      - {id: a, text: "System template", correct: true}
      - {id: b, text: "Edit each device", why_wrong: "Doesn't scale."}
      - {id: c, text: "Policy package", why_wrong: "Policies, not system settings."}
      - {id: d, text: "Device script directly on each FortiGate", why_wrong: "Bypasses previews and drifts."}
    explanation: "Templates standardize settings."
  - id: M5.02.q03
    type: multi
    tier: 2
    stem: "Where can a CLI script run? Select all that apply."
    options:
      - {id: a, text: "Directly on the device", correct: true}
      - {id: b, text: "On the device database", correct: true}
      - {id: c, text: "On the ADOM database (some script types)", correct: true}
      - {id: d, text: "On FortiAnalyzer logs", why_wrong: "No."}
    explanation: "Three targets."

labs:
  - id: M5.02.lab1
    title: Zero-touch branch
    goal: "Prepare FortiManager so a new branch FortiGate configures itself."
    worked:
      config: |
        # 1 Device Manager > Add Device > Model Device: serial FGT60FTK26000123, name BR-PEREIRA
        # 2 Metadata: branch_lan=10.40.0.1/24, branch_id=40
        # 3 Assign: system template STD-SYS, SD-WAN template BRANCH-DUAL, IPsec template HUB-OVERLAY,
        #           CLI template BRANCH-LAN (uses $(branch_lan)), firmware template 7.6-GA
        # 4 Assign policy package BRANCHES (installation target)
        # 5 Ship the box; on first contact FortiManager installs everything
        # 6 Verify: device status synchronized, tunnels up, test from a branch PC
      notes:
        - "Double-check the serial number: it's the match key."
    faded:
      template: |
        # pre-create a {{model}} device with the serial
        # per-device values via {{metadata}} variables
    solo:
      prompt: "Name the FortiManager templates for these settings, one per line: dns/ntp, branch tunnels, sd-wan rules, anything else."
      required: ["system", "ipsec", "sd-wan", "cli"]
      solution: |
        system template
        IPsec tunnel template
        SD-WAN template
        CLI template
      notes: "Plus firmware and static route templates."

scenarios:
  - id: M5.02.sc1
    kind: situation
    tier: 3
    title: The script that went straight to production
    situation: |
      A colleague ran a CLI script directly on 80 FortiGates to change a DNS server. Now FortiManager shows them all
      "modified" and the next policy install fails on 12.
    ask: "What happened and how do you fix it?"
    right_thinking:
      - "Device-target scripts change FortiGates outside FortiManager's database"
      - "Retrieve configs (or reapply via the database) to resync"
      - "Process: scripts on the device database, install with preview"
    what: "Resync and a better process."
    why: "FortiManager only works as a single source of truth if changes go through it."
    how: ["Explain", "Retrieve", "Re-install", "Process"]
    model_answer: |
      "The script changed the FortiGates directly, so FortiManager's device database no longer matches them. I'd
      retrieve the configuration from the affected devices to resync, check the 12 failures' install logs, then
      re-install. For the future: run such scripts on the device database or use the system template, so changes go
      through install preview."
    best_way: "Single source of truth."
    rubric: ["explains drift", "resyncs", "fixes process"]

interview:
  - id: M5.02.t01
    stage: technical
    question: "How would you deploy 50 new branches with FortiManager?"
    testing: "FMG at scale"
    framework: "Model devices → templates → package → verify"
    model_answer: |
      "Model devices by serial with metadata for each branch's addresses, the same system, SD-WAN and IPsec templates
      for all, a branch policy package, and a firmware template. Branches get shipped, plugged in, contact FortiManager
      and receive everything. I verify each one in Device Manager and with a test from the branch."
    best_way: "Template-driven, serial-matched."
    target: "0:35"
