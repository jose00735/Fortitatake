quiz:
  - id: M13.06.q01
    type: single
    tier: 3
    pretest: true
    stem: "A retailer has 80 FortiGates, FortiEDR on 3,000 endpoints, two analysts, and no other security vendors. They want a SOC in 3 months. Which design fits best?"
    options:
      - {id: a, text: "FortiAnalyzer-centred, with event handlers, Fabric View and playbooks for response", correct: true}
      - {id: b, text: "FortiSIEM-centred, because a SOC needs a SIEM with a CMDB to correlate events well", trap: near-miss, why_wrong: "A strong platform, but with a Fortinet-only estate and two analysts it adds cost and time without new sources to correlate."}
      - {id: c, text: "FortiSOAR first, so the two analysts can automate most of the work from the start", trap: near-miss, why_wrong: "Orchestration without a working detection layer automates nothing useful."}
      - {id: d, text: "A FortiNDR deployment on the core network, as it replaces the need for central logging", trap: misconception, why_wrong: "NDR adds network detection; it doesn't replace log collection and investigation."}
    explanation: "Fortinet-only estate, small team, tight timeline: FortiAnalyzer gives correlation, investigation and playbooks with the least integration work."
  - id: M13.06.q02
    type: numeric
    tier: 3
    stem: "A customer averages 1,800 EPS with an average event size of 500 bytes. How many GB of raw logs per day? (1 GB = 10^9 bytes, one decimal)"
    answer: 77.8
    tolerance: 0.2
    unit: GB/day
    explanation: "1,800 × 500 × 86,400 = 77,760,000,000 bytes ≈ 77.8 GB/day before compression or indexing."
  - id: M13.06.q03
    type: single
    tier: 4
    stem: "Which acceptance criterion would you accept for the 'VPN password spraying' use case?"
    options:
      - {id: a, text: "A spray of 15 users from one test IP raised an incident within 5 minutes on 14 June", correct: true}
      - {id: b, text: "The VPN logs arrive in FortiSIEM and the password-spraying rule is enabled for the tenant", trap: near-miss, why_wrong: "Arrival and enablement don't prove the rule fires on the technique."}
      - {id: c, text: "The customer's SOC lead has reviewed the rule logic and signed the rule document", trap: near-miss, why_wrong: "Review is useful, but only a test shows it works on their real logs."}
      - {id: d, text: "No incidents for spraying were raised during the two-week tuning period at all", trap: misconception, why_wrong: "Silence proves nothing; it may mean the rule never fires."}
    explanation: "Test-based acceptance: a named test, the expected result, the time and the date."
  - id: M13.06.q04
    type: order
    tier: 3
    stem: "Order the SOC delivery phases."
    items: ["Discovery: threat profile, sources, owners, authority", "Platform: deploy, HA, NTP, RBAC, backups", "Onboarding: sources in priority order with parsing checks", "Use cases: rules tested on attack and baseline", "Response: runbooks and guarded playbooks", "Tuning and handover: customer-run tuning, package signed"]
    explanation: "Each phase depends on the previous one; playbooks come after the use cases they respond to."
  - id: M13.06.q05
    type: single
    tier: 3
    stem: "An MSSP will run one FortiAnalyzer for 25 small customers. What must the design guarantee first?"
    options:
      - {id: a, text: "Per-customer separation of logs, admin access and reports, using ADOMs and RBAC", correct: true}
      - {id: b, text: "A dedicated FortiAnalyzer VM per customer so their logs don't share a disk", trap: near-miss, why_wrong: "Possible but expensive; ADOMs give logical separation on one platform."}
      - {id: c, text: "A single shared dashboard so the MSSP analysts can compare customers side by side", trap: misconception, why_wrong: "Cross-tenant views without RBAC leak one customer's data to another."}
      - {id: d, text: "Identical event handlers for all 25 customers so tuning is done once for everyone", trap: near-miss, why_wrong: "Shared baselines help, but each tenant needs its own tuning and exceptions."}
    explanation: "Multi-tenancy is a data-protection requirement first: separate data, access and reporting per customer."
  - id: M13.06.q06
    type: single
    tier: 4
    format: first-step
    stem: "Week one of a FortiSIEM deployment: the customer wants to turn on all 2,000 built-in rules 'to see what fires'. What do you do first?"
    options:
      - {id: a, text: "Agree to enable the top-10 use cases now and stage the rest by source and test", correct: true}
      - {id: b, text: "Enable them all for one week in a separate view, then disable whatever was noisiest", trap: near-miss, why_wrong: "Rules that fire on untuned data teach the analysts to ignore the tool from day one."}
      - {id: c, text: "Refuse, and point to the SOW that lists ten use cases as the agreed scope of work", trap: near-miss, why_wrong: "Right content, wrong tone; explain the why and offer a path instead of a refusal."}
      - {id: d, text: "Enable them all and lower their severity to low until the tuning phase starts", trap: misconception, why_wrong: "Noise at low severity is still noise, and real hits get buried."}
    explanation: "Stage rules with the sources that feed them and test each one; explain that noise in week one is how SIEM projects fail."
  - id: M13.06.q07
    type: text
    tier: 2
    stem: "Which Fortinet product provides decoys whose only purpose is to be touched by attackers?"
    accept: ["fortideceptor", "forti deceptor"]
    explanation: "FortiDeceptor."

labs:
  - id: M13.06.lab1
    title: A sizing note the customer can follow
    goal: "Write the sizing note for a FortiSIEM proposal."
    worked:
      config: |
        # Sources (measured 7 days):  FortiGates 1,600 EPS, DCs 350, EDR 120, VPN 30, other 100  -> 2,200 EPS
        # Peak observed:               5,900 EPS for 40 min (scan storm)
        # Average event size:          550 bytes (sample of 100k events)
        # Raw volume:                  2,200 x 550 x 86,400 = 104.5 GB/day
        # Retention:                   90 days online, 365 days archive (customer policy)
        # Licence basis:               devices + 2,500 EPS (normal + ~15% headroom)
        # Collectors/queues:           sized for 6,000 EPS bursts
        # Assumptions to confirm:      compression ratio and storage per the current sizing tool
    faded:
      template: |
        # Raw volume = EPS x {{size}} x {{86400}}
        # Licence for {{normal}} plus headroom, queues for {{peak}}
    solo:
      prompt: "Write the four inputs of a sizing note, one per line."
      required: ["eps", "size", "retention", "peak"]
      solution: |
        EPS per source
        average event size
        retention (online and archive)
        peak EPS
      notes: "Then the assumptions you still need to confirm."

scenarios:
  - id: M13.06.sc1
    kind: situation
    tier: 4
    title: "FortiAnalyzer or FortiSIEM?"
    situation: |
      A university has 12 FortiGates, a Palo Alto at the research network, Microsoft 365, AWS for research labs, and a
      three-person security team. The account manager asks you which to propose: FortiAnalyzer or FortiSIEM.
    ask: "What do you recommend and how do you explain it?"
    right_thinking:
      - "Count non-Fortinet sources: Palo Alto, M365, AWS — correlation across them matters"
      - "FortiSIEM for cross-vendor correlation and CMDB; FortiAnalyzer can stay as the Fortinet log store"
      - "Phase it: start with identity (M365) and edges, then cloud"
      - "Size the team: three people need tuned use cases, not hundreds of rules"
    what: "FortiSIEM-centred with FortiAnalyzer for Fortinet logs, phased by risk."
    why: "Their attacks will cross vendors (cloud identity, research network); only a multi-vendor SIEM sees the whole path."
    how: ["Source count", "Design B", "Phases", "Team-sized use cases"]
    model_answer: |
      "I'd propose FortiSIEM, because their risk crosses vendors: a phished M365 account, then access to AWS or the
      research network behind the Palo Alto. FortiAnalyzer alone would see the FortiGate side well but not that path.
      FortiAnalyzer can stay as the Fortinet log store and forward to FortiSIEM. We start with identity and the edges,
      then cloud, and we keep the rule set small enough for three people to tune."
    best_way: "Their attacks cross vendors, so their SIEM must too — phased to what three people can run."
    rubric: ["counts sources", "right design", "phased plan", "fits the team"]

interview:
  - id: M13.06.t01
    stage: technical
    question: "How would you design a SOC for a customer that is mostly Fortinet?"
    testing: "Architecture judgement"
    framework: "Fit design to estate and team"
    model_answer: |
      "If the estate is mostly Fortinet and the team is small, I'd centre it on FortiAnalyzer: FortiGates, FortiEDR and
      EMS log there, event handlers raise incidents, Fabric View and FortiView support investigations, and
      FortiAnalyzer playbooks plus FortiGate stitches handle response. When non-Fortinet sources or cross-tool
      approvals grow, FortiSIEM and FortiSOAR come in. I'd deliver it in phases with test-based acceptance for each use
      case."
    best_way: "Fit the stack to the estate and the team; prove each use case with a test."
    target: "0:50"
  - id: M13.06.t02
    stage: technical
    question: "How do you size a SIEM?"
    testing: "Method and honesty about numbers"
    framework: "Inputs → formula → peaks → assumptions"
    model_answer: |
      "From measured EPS per source type, the average event size, and retention online and in archive. Raw volume is
      EPS times size times 86,400. I size licences for normal load with headroom and collectors and queues for peaks,
      because losing events during an incident is the worst moment. Compression and current ratios I take from the
      vendor's sizing tool rather than from memory, and I write every assumption into the proposal."
    best_way: "Measured EPS, the formula, peaks, and written assumptions."
    target: "0:45"
