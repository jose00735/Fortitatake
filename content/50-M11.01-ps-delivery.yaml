quiz:
  - id: M11.01.q01
    type: order
    tier: 1
    pretest: true
    stem: Put the PS delivery phases in order.
    items: ["Pre-sales handoff", "Kickoff", "Discovery", "Design (HLD/LLD)", "Build and test", "Implementation", "Acceptance", "Handover"]
    explanation: Handoff, kickoff, discovery, design, build/test, implement, accept, hand over.
  - id: M11.01.q02
    type: single
    tier: 1
    pretest: true
    stem: During implementation the customer asks you to "also quickly set up SD-WAN for the two other branches", which isn't in the SOW. Best answer?
    options:
      - {id: a, text: "Welcome it and raise a change request so it's scoped and scheduled", correct: true}
      - {id: b, text: "Do it tonight as goodwill, since it's small and the window is open", trap: near-miss, why_wrong: "Untracked work breaks timelines, testing and budgets, and becomes expected."}
      - {id: c, text: "Decline politely, as the SOW is signed and the branches aren't in it", trap: near-miss, why_wrong: "Right on scope, wrong on relationship; offer the proper path instead."}
      - {id: d, text: "Ask them to contact sales, who handle anything outside the signed SOW", trap: misconception, why_wrong: "Own it: you can start the change request yourself."}
    explanation: Protect scope without saying no to the customer.
  - id: M11.01.q03
    type: single
    tier: 2
    pretest: true
    stem: Which document lists every interface, IP, policy and route needed to build the solution?
    options:
      - {id: a, text: "The low-level design (LLD)", correct: true}
      - {id: b, text: "High-level design (HLD)", trap: near-miss, why_wrong: "The HLD explains the architecture and reasoning, not every setting."}
      - {id: c, text: "The statement of work (SOW)", trap: misconception, why_wrong: "The SOW defines scope and responsibilities."}
      - {id: d, text: "The method of procedure (MOP)", trap: near-miss, why_wrong: "The MOP sequences the change steps; the LLD holds the full settings."}
    explanation: Low-level design = the build sheet.
  - id: M11.01.q04
    type: multi
    tier: 2
    pretest: true
    stem: Which belong in the pre-checks of a FortiGate change window? Select all that apply.
    options:
      - {id: a, text: "Config backup or FortiManager revision", correct: true}
      - {id: b, text: "Baseline outputs: status, routes, sessions", correct: true}
      - {id: c, text: "Console or out-of-band access confirmed", correct: true}
      - {id: d, text: "Clearing the session table to start clean", trap: misconception, why_wrong: "Disruptive to users, and it destroys the baseline."}
      - {id: e, text: "Upgrading firmware to the newest patch", trap: near-miss, why_wrong: "A separate change with its own window, not a pre-check."}
    explanation: Backup, baseline, console. Then start.
  - id: M11.01.q05
    type: single
    tier: 2
    stem: What makes a rollback plan usable at 2 a.m.?
    options:
      - {id: a, text: "A written trigger with a deadline, plus exact steps back", correct: true}
      - {id: b, text: "An experienced engineer who knows the config by heart", trap: misconception, why_wrong: "Tired people at 2 a.m. need a script, not memory."}
      - {id: c, text: "A TAC case opened in advance with the change details", trap: near-miss, why_wrong: "A useful backup, but it isn't a rollback plan."}
      - {id: d, text: "A config backup taken from the device right before the start", trap: near-miss, why_wrong: "Necessary, but without a trigger and steps nobody knows when or how to use it."}
    explanation: Decide when and how you roll back before you start.
  - id: M11.01.q06
    type: single
    tier: 2
    stem: Which weekly status format do hiring managers usually want to hear?
    options:
      - {id: a, text: "Done, next, risks and decisions needed", correct: true}
      - {id: b, text: "Full log of each command that was run", trap: misconception, why_wrong: "Too detailed for stakeholders to act on."}
      - {id: c, text: "Hours spent per task against the budget", trap: near-miss, why_wrong: "Useful internally, but not what a sponsor needs weekly."}
      - {id: d, text: "A report sent when there's a problem to fix", trap: misconception, why_wrong: "Silence breeds surprise; report on a fixed rhythm."}
    explanation: Short, predictable, decision-oriented.
  - id: M11.01.q07
    type: single
    tier: 3
    format: "first-step"
    stem: Validation fails 20 minutes before the agreed go/no-go time. What do you do?
    options:
      - {id: a, text: "One targeted fix if time allows; at go/no-go, roll back and tell them", correct: true}
      - {id: b, text: "Keep troubleshooting past go/no-go, since you're close to the root cause", trap: misconception, why_wrong: "That's how windows overrun into business hours."}
      - {id: c, text: "Roll back now, then write up what happened for the next morning", trap: near-miss, why_wrong: "Rolling back may be right, but the customer contact needs to hear now."}
      - {id: d, text: "Ask the customer to extend the window by two hours to finish the job", trap: near-miss, why_wrong: "Possible, but the go/no-go time exists so this isn't decided under pressure."}
    explanation: The go/no-go time is a commitment you made to the customer.
  - id: M11.01.q08
    type: single
    tier: 3
    stem: Which ATP test is most likely to catch an MTU/MSS problem on new tunnels?
    options:
      - {id: a, text: "A large file transfer through each tunnel", correct: true}
      - {id: b, text: "A ping between the sites from each LAN side", trap: near-miss, why_wrong: "Small pings pass even when large packets don't."}
      - {id: c, text: "The tunnel status and SA counters on each end", trap: near-miss, why_wrong: "A tunnel can be up while large packets are dropped."}
      - {id: d, text: "NTP sync from a branch to the HQ server", trap: misconception, why_wrong: "NTP uses tiny UDP packets that never hit MTU."}
    explanation: Small things pass; big things reveal MTU problems.
  - id: M11.01.q09
    type: single
    tier: 3
    stem: "A hiring manager asks: 'Have you led full Fortinet implementations end to end?' Best answer?"
    options:
      - {id: a, text: "Not as the named owner; here are the pieces I've done and how I'd close the gap", correct: true}
      - {id: b, text: "Yes, several, since TAC escalations meant rebuilding customer deployments often", trap: misconception, why_wrong: "Stretching support work into delivery collapses under follow-up questions."}
      - {id: c, text: "No, I've done support and customer success, so delivery work would be new to me", trap: near-miss, why_wrong: "Honest, but undersells real design, rollout and recovery work."}
      - {id: d, text: "Not yet, but I'm sure I'd ramp up quickly with a strong team around me", trap: near-miss, why_wrong: "Honest, but offers no evidence of what you have done."}
    explanation: Honesty plus evidence plus a plan beats both bluffing and underselling.
  - id: M11.01.q10
    type: single
    tier: 2
    stem: What's the strongest way to deliver bad news to a customer sponsor?
    options:
      - {id: a, text: "What we found, the impact, options, and my recommendation", correct: true}
      - {id: b, text: "Wait until there's a fix, so the message ends on good news", trap: misconception, why_wrong: "Late news destroys trust more than bad news does."}
      - {id: c, text: "Explain the root cause in full, including whose change it was", trap: near-miss, why_wrong: "Cause matters later; blame doesn't help the sponsor decide."}
      - {id: d, text: "A detailed technical email so they have the full picture to read", trap: near-miss, why_wrong: "Sponsors need impact and options, not a long technical write-up."}
    explanation: Bad news early, always with a plan.
  - id: M11.01.q11
    type: single
    tier: 4
    format: "first-step"
    stem: A partner did half of a customer's deployment and left. The customer is frustrated and the renewal is near. Based on your own experience, what's the best first move?
    options:
      - {id: a, text: "Audit what was delivered against what was promised, then propose staged completion", correct: true}
      - {id: b, text: "Rebuild the deployment from scratch to a known design, then hand it over properly", trap: near-miss, why_wrong: "Wastes what works and delays value; audit first."}
      - {id: c, text: "Escalate to the partner's management so they come back and finish the work they sold", trap: near-miss, why_wrong: "May be needed, but the customer still has a half-done deployment today."}
      - {id: d, text: "Offer a renewal discount to make up for the gap while the partner sorts things out", trap: misconception, why_wrong: "A discount doesn't fix the deployment or the frustration."}
    explanation: "That's exactly what you did at Netskope: gap analysis, then staged completion as QA on the partner's work."
  - id: M11.01.q12
    type: single
    tier: 4
    stem: Mid-window, a routing change cuts off your SSH session to the FortiGate. The MOP was followed. What should have been in place?
    options:
      - {id: a, text: "Console or out-of-band access, checked in pre-checks, plus rollback steps", correct: true}
      - {id: b, text: "A second SSH session kept open from another jump host during the whole window", trap: near-miss, why_wrong: "It rides the same routed path, so the change cuts it off too."}
      - {id: c, text: "execute config-revert scheduled before the change so it undoes itself", trap: near-miss, why_wrong: "Auto-revert helps, but you still need a way in and a plan; it complements console access."}
      - {id: d, text: "A reboot scheduled for ten minutes later in case the session gets lost", trap: misconception, why_wrong: "A reboot doesn't undo a saved bad config."}
    explanation: You've recovered FortiGates over console after bad routing; make console part of every pre-check.
  - id: M11.01.q13
    type: single
    tier: 5
    stem: The customer's CISO wants SSL deep inspection on 3,000 endpoints in one go next week. Which plan shows PS maturity?
    options:
      - {id: a, text: "Pilot group, CA via GPO, exemptions, waves with rollback, agreed success criteria", correct: true}
      - {id: b, text: "Everyone at once to meet the date, with TAC on standby for any broken applications", trap: misconception, why_wrong: "Breaks apps everywhere at once with no rollback path."}
      - {id: c, text: "Certificate inspection for all next week, deep inspection after the CISO signs off", trap: near-miss, why_wrong: "A reasonable step, but it changes the requirement without the pilot and CA plan."}
      - {id: d, text: "Deep inspection for IT staff next week and everyone else in a single second wave", trap: near-miss, why_wrong: "A pilot, but one big second wave still has no rollback per group."}
    explanation: "Phased, reversible, agreed: your real rollout experience distributing the CA through Group Policy."
  - id: M11.01.q14
    type: single
    tier: 3
    stem: Which handover item most reduces post-project support calls?
    options:
      - {id: a, text: "Hands-on knowledge transfer where their team does the key tasks", correct: true}
      - {id: b, text: "A complete as-built document with each setting and screenshot", trap: near-miss, why_wrong: "Needed, but rarely read when something breaks; doing beats reading."}
      - {id: c, text: "Your direct phone number for questions during the first months", trap: misconception, why_wrong: "Doesn't scale or build their capability."}
      - {id: d, text: "A curated list of FortiOS documentation and KB links for the team", trap: near-miss, why_wrong: "Useful, but it doesn't make the team self-sufficient."}
    explanation: Doing beats reading.

labs:
  - id: M11.01.lab1
    title: Fill in a MOP skeleton
    goal: Complete the missing sections of a MOP for adding a VIP for a new web server.
    worked:
      config: |
        CHANGE CHG-1042 · Window Sat 22:00–00:00 · Go/no-go 23:30
        Contacts: PS consultant (you), customer network lead, approver: IT manager
        PRE-CHECKS
          1. Backup config / FortiManager revision "pre-CHG-1042"
          2. Baseline: get system status, get system performance status,
             get router info routing-table all, get system session status
          3. Console access confirmed
        STEPS
          1. Create VIP WEB-NEW (extip 203.0.113.20 → 10.0.20.20 tcp/443)
          2. Create policy wan1 → dmz, dst WEB-NEW, service HTTPS, IPS default, log all
          3. Install (FortiManager install preview reviewed first)
        VALIDATION
          1. External HTTPS to 203.0.113.20 loads the site (customer confirms)
          2. Debug flow shows "Allowed by Policy-<id>"
          3. Logs reach FortiAnalyzer
        ROLLBACK (trigger: validation fails at 23:30)
          1. Restore revision "pre-CHG-1042"; confirm baseline matches
        COMMUNICATION
          Start / go-no-go / close messages to IT manager
      notes:
        - "Every step has an expected result someone can check."
        - "The rollback has a trigger time, not a feeling."
    faded:
      prompt: Fill in the section names.
      template: |
        {{PRE-CHECKS}}
          Backup, baseline, console
        {{STEPS}}
          Numbered changes with expected results
        {{VALIDATION}}
          Tests from the ATP, run with the customer
        {{ROLLBACK}}
          Trigger time and exact steps back
        {{COMMUNICATION}}
          Start, go/no-go, close
    solo:
      prompt: "Write the five headings of a MOP and, under ROLLBACK, a trigger and one restore step for a FortiManager-managed FortiGate."
      required: ["pre-checks", "steps", "validation", "rollback", "communication", "trigger", "revision"]
      solution: |
        PRE-CHECKS / STEPS / VALIDATION / ROLLBACK / COMMUNICATION
        ROLLBACK (trigger: any validation step fails at the 23:30 go/no-go)
          1. Revert the device to FortiManager revision "pre-CHG" and install
          2. Confirm baseline outputs match the pre-check capture
  - id: M11.01.lab2
    title: Write the ATP for a branch cutover
    goal: List acceptance tests for moving a branch to a new FortiGate with an IPsec tunnel to HQ and one published service.
    worked:
      config: |
        ATP-BR07
        T1 Outbound web from staff VLAN → pass (FortiView shows sessions)
        T2 Guest VLAN can't reach staff VLAN → blocked (log shows deny)
        T3 Branch → HQ file share, 2 GB copy completes (MTU/MSS check)
        T4 HQ → branch printer reachable (both directions of the tunnel)
        T5 Published camera portal reachable from internet; blocked countries denied
        T6 Logs visible in FortiAnalyzer within 5 minutes
        T7 Admin access only from management subnet
        Sign-off: customer IT lead ____  date ____
      notes:
        - "Each test: action, expected result, evidence, signature."
        - "T3 catches MTU problems that pings miss."
    solo:
      prompt: "Write three acceptance tests for an HA pair: one for failover, one for failback, one for sessions."
      required: ["failover", "failback", "session"]
      solution: |
        T1 Failover: unplug the primary's monitored WAN → secondary becomes primary within the agreed time; users keep browsing
        T2 Failback: restore the link → cluster returns to the expected primary (per override settings); no outage beyond the agreed time
        T3 Sessions: long-running download / SSH survives failover (session pickup enabled)

scenarios:
  - id: M11.01.sc1
    kind: situation
    tier: 4
    title: The half-finished partner deployment
    situation: |
      You're assigned to a customer where a partner started a FortiGate + FortiManager deployment, configured half the branches, and stopped answering. The customer's IT director is angry and their renewal with Fortinet is in three months.
    stakeholders: ["IT director (angry)", "Partner (absent)", "Fortinet account team"]
    ask: What are your first two weeks?
    right_thinking:
      - "Listen first: the director's impact and expectations, without blaming the partner"
      - "Audit: what the SOW promised vs what exists (FortiManager ADOMs, policy packages, branch status)"
      - "Plan in stages: quick wins in week 1, risky items scheduled with MOPs"
      - "Weekly status with done/next/risks/decisions; one owner per action"
      - "Bring the account team in on the renewal risk with facts"
    what: Gap audit plus staged completion plan, with visible quick wins.
    why: Trust returns when the customer sees progress and predictability; staged delivery limits risk.
    how: ["Listening session", "Gap audit vs SOW", "Staged plan", "Weekly status", "Account team alignment"]
    pitfalls: ["Criticising the partner to the customer", "Rebuilding everything from scratch", "Promising dates before the audit"]
    model_answer: |
      "I did almost exactly this at Netskope: I took over partner PS projects that were only partly delivered and finished them in stages. Week one I'd listen to the director, then audit what the SOW promised against what's really in FortiManager and on the branches. I'd come back with a staged plan: quick wins first so they see progress, riskier changes in proper windows with MOPs. From then on, a weekly status with done, next, risks and decisions, and I'd keep the account team informed because the renewal depends on it."
    could_have_added: ["Name a measurable first-week win (e.g., three branches finished and validated)"]
    best_way: "Listen, audit against the SOW, then finish it in stages the customer can see. I've done this before, at Netskope."
    rubric: ["empathy and listening", "audit", "staged plan", "communication cadence", "commercial awareness"]
  - id: M11.01.sc2
    kind: raid
    tier: 5
    title: "Raid: 01:40, the cutover is failing"
    situation: |
      You're migrating a hospital's core firewall to a FortiGate HA pair. Window 00:00–03:00, go/no-go at 02:15. At 01:40 everything works except the radiology PACS system, which can't reach its cloud archive. The night IT supervisor is nervous; the morning shift starts at 06:00.
    ask: What do you do between 01:40 and 02:15?
    right_thinking:
      - "Communicate: tell the supervisor what works, what doesn't, and that 02:15 is the decision point"
      - "Evidence: sniffer and debug flow for the PACS flow (policy? NAT? route? MTU on large images?)"
      - "One targeted change at a time, each tested by the PACS user"
      - "At 02:15 if not fixed: roll back as per the MOP, or (only if agreed) go live with a documented, approved workaround"
      - "Write up the open issue and next step before you leave"
    what: Time-boxed evidence-based fix with a firm rollback decision at go/no-go.
    why: In healthcare, predictable rollback beats heroic overtime; the go/no-go time protects patient services.
    how: ["Status to supervisor", "Debug flow / sniffer", "One change at a time", "Decision at 02:15", "Written handover"]
    pitfalls: ["Blowing through the go/no-go time", "Several simultaneous changes", "Leaving without a written status"]
    model_answer: |
      "First I tell the supervisor: everything's up except PACS, I have 35 minutes to fix it, and at 02:15 we decide go or roll back. Then evidence: a filtered sniffer and debug flow on the PACS flow, because large medical images can also hit MTU limits. I make one targeted change at a time and have the PACS user test each. If it's not fixed at 02:15, we follow the MOP and roll back, unless the customer explicitly approves going live with a documented workaround. Either way, I leave a written status before the morning shift."
    best_way: "One flow broken, 35 minutes, one change at a time, and at 02:15 we follow the plan, not our hopes."
    rubric: ["communication", "evidence", "change discipline", "decision at go/no-go", "handover"]
  - id: M11.01.sc3
    kind: situation
    tier: 3
    title: Scope creep from the sponsor
    situation: |
      Two weeks before go-live, the customer's sponsor asks you to "also add ZTNA for the remote workers, since you're already here". It's not in the SOW and would affect the timeline.
    ask: How do you respond in the meeting?
    right_thinking:
      - "Acknowledge the value of the idea"
      - "Explain the impact on timeline and testing honestly"
      - "Offer the path: a change request or a phase 2, scoped with pre-sales"
      - "Keep the current go-live safe"
    what: A phase 2 / change request instead of silent scope creep.
    why: Untracked work threatens the agreed go-live and the quality of both deliveries.
    how: ["Acknowledge", "Impact", "Change request / phase 2", "Protect go-live"]
    model_answer: |
      "That's a great next step, and ZTNA fits well with what we're building. If we add it now, it puts the go-live and the testing at risk. Let me raise it as a change request, or a phase 2, with the account team this week, so it's scoped and tested properly, and we keep your go-live date safe."
    best_way: "Great idea, wrong week. Let's make it phase 2 so both projects land well."
    rubric: ["acknowledge", "honest impact", "proper path", "protect commitments"]

interview:
  - id: I2.s01
    stage: hm
    question: Walk me through how you'd run a Fortinet implementation from kickoff to handover.
    testing: Whether you know the PS lifecycle and its documents
    framework: "Phases with one key output each"
    model_answer: |
      "Before the kickoff I read the SOW and talk to pre-sales, so I know what was promised and why. At kickoff we agree on scope, roles, timeline and how we communicate. In discovery I collect the current configs and the requirements, then I write the HLD for the architecture and the LLD with every setting. We build and test, ideally staged in FortiManager or in a lab; at Fortinet I reproduced customer scenarios with Terraform templates before recommending changes. Production changes go in windows with a MOP: pre-checks, steps, validation, rollback with a trigger time. Then the acceptance test plan with the customer, the as-built, and hands-on knowledge transfer."
    could_have_added: ["Weekly status: done, next, risks, decisions"]
    best_way: "Know the promise, design it, prove it in a lab, change it safely, prove it again with the customer, and leave them self-sufficient."
    target: "1:30"
  - id: I2.s02
    stage: hm
    question: Tell me about a project someone else started that you had to finish.
    testing: Ownership, partner handling, quality judgement
    framework: "STAR"
    model_answer: |
      "At Netskope, some partner professional-services projects were left half delivered. The customer had paid, adoption was stuck, and a renewal was coming. I audited what had actually been deployed against what was planned, then completed it in stages, quick wins first, effectively acting as the QA layer on the partner's work. The customer got to a working deployment, and I kept the partner relationship intact by focusing on the gaps, not on blame."
    could_have_added: ["A number if you have it: adoption before and after, or time to complete"]
    best_way: "I audited what was really there, finished it in stages, and kept the partner on side. In practice I was the QA on their PS work."
    follow_ups: ["What would you do differently?", "How did you handle the partner?"]
    target: "1:30"
  - id: I2.s03
    stage: hm
    question: Tell me about a time you turned a hostile customer situation around.
    testing: Composure, technical credibility, commercial awareness
    framework: "STAR + strategic link"
    model_answer: |
      "At Netskope a named enterprise account escalated in a churn-shaped way; the relationship was hostile. Instead of treating it as a relationship problem, I went after the underlying technical issue, diagnosed and resolved it, and used that restored credibility to restructure the agreement as a license exchange rather than a cancellation. That kept more than 900 thousand dollars in total contract value. What I learned for PS: fix the real problem first and the relationship follows."
    best_way: "I fixed the technical problem first; the trust came back with it, and we kept over 900k in contract value."
    target: "1:30"
  - id: I2.s04
    stage: hm
    question: Describe a rollout you planned that had to avoid disrupting users.
    testing: Change discipline
    framework: "STAR"
    model_answer: |
      "At Netskope one account was using less than half of what they'd bought. I worked out what was blocking a secure rollout, planned a one-month rollout step by step, and brought in senior support and a dedicated manager. Utilisation went from below 50 % to 70 %. And at Fortinet I taught customers how to roll out SSL deep inspection estate-wide by distributing the CA certificate through Group Policy, so users didn't get certificate errors."
    best_way: "Find the real blocker, plan it step by step with the right people, and measure it: below 50 % to 70 % utilisation."
    target: "1:30"
  - id: I2.s05
    stage: hm
    question: Have you led full Fortinet implementations end to end?
    testing: Honesty and self-awareness about the main gap
    framework: "Honest answer → evidence of pieces → plan"
    model_answer: |
      "Not as the named delivery owner of a PS project. What I have done: at Fortinet I was a P3 escalation engineer, and many of my cases were implementations in progress: routing, failover, third-party switch integration, SD-WAN designs from requirements, HA in AWS and Azure, and recovering split-brain clusters. At Netskope I finished partners' half-delivered PS projects in stages. So I know the technology and the delivery steps; in my first 90 days I'd shadow your delivery process, use your templates and take ownership of smaller projects first."
    could_have_added: ["Mention you're re-studying 7.6/8.0 right now with the official guides"]
    best_way: "Not as the named owner, but I've done every piece of it, and here's how I'd close the gap in 90 days."
    target: "1:30"
  - id: I2.s06
    stage: hm
    question: Tell me about a time you worked with development or engineering to fix a product issue.
    testing: Escalation quality
    framework: "STAR"
    model_answer: |
      "At Fortinet a customer had packet duplication over SD-WAN across three ISPs over VPN. I reproduced it, traced it to specific SLA settings, and escalated to development with clear reproduction steps, then followed it to the fix. As one of the main escalation points for North American and Brazilian enterprise customers, that was my pattern: real defects went to development with evidence, not opinions."
    best_way: "I reproduced it, narrowed it to specific SLA settings, and handed development a clean repro."
    target: "1:15"
  - id: I2.s07
    stage: hm
    question: How do you handle a customer who keeps adding scope?
    testing: Scope management without damaging the relationship
    framework: "Principle → script → example"
    model_answer: |
      "I welcome the idea and make it visible: 'great idea, let's raise it as a change request so it's scoped and tested properly'. Then I bring in the account team so it can become a change order or a phase 2. That protects the go-live date and the quality, and the customer feels heard, not refused."
    best_way: "Great idea, let's make it a change request so it gets done right."
    target: "0:45"
  - id: I2.s08
    stage: hm
    question: What does your weakness look like at work?
    testing: Self-awareness with improvement
    framework: "Real weakness → impact → what you changed → result"
    model_answer: |
      "Early in my customer-facing roles I let work fragment across email, chat and CRM, and it was hard to keep one source of truth per account. I fixed it by building my own tooling, Python scripts and AI workflows that consolidate account activity and turn notes into action items, so nothing slips. In PS I'd apply the same discipline from day one: one project tracker, weekly status, and a risk register."
    could_have_added: ["Keep it short; end on the system you use now"]
    best_way: "I used to let tasks scatter; now I build systems so nothing slips: one tracker, weekly status, a risk register."
    target: "1:00"
  - id: I2.s09
    stage: hm
    question: How do you mentor or bring others up to speed?
    testing: Team contribution
    framework: "Examples from two jobs"
    model_answer: |
      "At SYKES, on Cisco TAC, I mentored new engineers through structured training. At Netskope I led new Customer Success Manager hires through onboarding and ramp, without a formal reporting line. And I write things down: at Netskope I wrote customer-facing KB articles and how-to guides. In PS that becomes good as-builts and knowledge transfer sessions where the customer's team does the work themselves."
    best_way: "I've onboarded engineers and CSMs, and I write the guides people actually use."
    target: "1:00"
  - id: I2.s10
    stage: hm
    question: A change you made caused an outage. What happened and what did you learn?
    testing: Accountability; works best with a real, small story
    framework: "STAR with the lesson"
    model_answer: |
      "Use a real, small story of your own here. If you don't have one from your own changes, use the closest true one: at Fortinet I recovered FortiGates that customers had cut off with bad routing changes, over console, sometimes with a TFTP restore or a live static-route fix. What it taught me, and what I put in every MOP now, is console access and a tested rollback before any routing change."
    could_have_added: ["Own your part clearly if it was your change; interviewers respect it"]
    best_way: "Routing changes can lock you out. That's why console access and a tested rollback are in every MOP I write."
    target: "1:15"
  - id: I2.s11
    stage: hm
    question: How would you handle a technical disagreement with the customer's architect?
    testing: Influence without authority
    framework: "Listen → evidence → options → decision record"
    model_answer: |
      "First I make sure I understand their reasoning; often they know a constraint I don't. Then I bring evidence: the documentation, a lab test, or numbers. I present options with trade-offs and let the customer decide, and I write the decision down in the design so it's clear later. If it's a security risk, I make the risk explicit and get sign-off on it rather than quietly going along."
    best_way: "Understand, test, present options, and write the decision down. Risks get a signature, not silence."
    target: "1:00"
  - id: I2.s12
    stage: hm
    question: Why would you be good at professional services specifically?
    testing: Motivation and fit
    framework: "Company strength → your skills → contribution"
    model_answer: |
      "Because I've seen the product from both sides. At Fortinet TAC I learned how FortiOS behaves when it breaks: debug flow, NAT, SD-WAN, HA, VPN. At Netskope I learned to own customers: plans, QBRs with executives, and finishing partner PS work that stalled. PS needs both: the depth to design and change things safely, and the customer skills to keep everyone aligned. And I work in English, Spanish and Portuguese and can travel anywhere."
    best_way: "I know how FortiOS breaks and how customers feel when it does. PS is where those two meet."
    target: "1:15"

field_reports:
  - id: M11.01.fr1
    title: Breaches take longer when nobody owns the plan
    body: |
      IBM 2026 found detection and escalation plus lost business make up **63 %** of breach costs. The same is true in projects: most of the cost of a bad night is in the escalation and the lost trust, not the fix. A MOP with a go/no-go time is how you keep that cost near zero.
    source: IBM Cost of a Data Breach Report 2026, Key findings
  - id: M11.01.fr2
    title: Customers are buying speed now
    body: |
      **85 %** of breached organisations in IBM's 2026 study plan to increase security spending in response to frontier AI threats, and three quarters plan more AI agents in triage and vulnerability management. PS consultants who deliver quickly and safely are what turns that budget into protection.
    source: IBM Cost of a Data Breach Report 2026, Key findings
