  - { id: M11.01.c16, unit: M11.01.u3, tier: 2, front: "Your hostile-escalation result at Netskope?", back: "Resolved the technical issue and restructured as a license exchange; kept more than USD 900k in TCV." }
  - { id: M11.01.c17, unit: M11.01.u2, tier: 2, front: "Your 'reproduce before you recommend' proof?", back: "Shared Terraform templates at Fortinet to reproduce customer scenarios and validate fixes first." }
