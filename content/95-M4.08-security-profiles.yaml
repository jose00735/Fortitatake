  - { id: M4.08.c06, unit: M4.08.u2, tier: 2, front: "Web filter check order?", back: "URL filter → FortiGuard categories → content filter → script filter → antivirus." }
  - { id: M4.08.c07, unit: M4.08.u2, tier: 1, front: "Five FortiGuard web filter category actions?", back: "Allow, Monitor, Block, Warning, Authenticate." }
