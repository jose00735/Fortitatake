quiz:
  - id: M4.08.q01
    type: single
    tier: 1
    pretest: true
    stem: Which inspection mode is the default on new firewall policies?
    options:
      - { id: a, text: "Flow-based", correct: true }
      - { id: b, text: "Proxy-based", why_wrong: "Available, but not the default." }
      - { id: c, text: "None until a profile is added", why_wrong: "The mode is set regardless." }
      - { id: d, text: "It depends on the model", why_wrong: "Flow is the default." }
    explanation: Flow is default and recommended.
    source: FortiOS 8.0.2 Admin Guide p. 2481
  - id: M4.08.q02
    type: order
    tier: 2
    pretest: true
    stem: Put the web filter checks in the order FortiOS applies them.
    items: ["URL filter", "FortiGuard web filtering (categories)", "Web content filter", "Web script filter", "Antivirus scanning"]
    explanation: Your static list first, then categories, then content.
    source: FortiOS 8.0.2 Admin Guide p. 2599
  - id: M4.08.q03
    type: single
    tier: 2
    stem: The customer needs a WAF profile on the policy to their web app. What must the policy use?
    options:
      - { id: a, text: "Proxy-based inspection", correct: true }
      - { id: b, text: "Flow-based inspection", why_wrong: "WAF is proxy-only." }
      - { id: c, text: "No inspection", why_wrong: "Then nothing is applied." }
      - { id: d, text: "Certificate inspection", why_wrong: "That's an SSL setting, not the policy mode." }
    explanation: WAF, CDR, video filter, inline CASB are proxy features.
    source: FortiOS 8.0.2 Admin Guide p. 2482
  - id: M4.08.q04
    type: single
    tier: 2
    stem: Which FortiGuard web filter action lets users continue after a message?
    options:
      - { id: a, text: "Warning", correct: true }
      - { id: b, text: "Monitor", why_wrong: "Monitor allows silently and logs." }
      - { id: c, text: "Authenticate", why_wrong: "That requires a login, not just a click." }
      - { id: d, text: "Block", why_wrong: "No way to continue." }
    explanation: Warning shows a page with a continue option.
    source: FortiOS 8.0.2 Admin Guide p. 2603
  - id: M4.08.q05
    type: single
    tier: 3
    stem: A URL is exempted in the URL filter. What happens to it?
    options:
      - { id: a, text: "It skips the later web filter checks (categories, content, and so on)", correct: true }
      - { id: b, text: "It's still category-checked", why_wrong: "Exempt bypasses the subsequent checks." }
      - { id: c, text: "It's blocked", why_wrong: "Exempt is the opposite." }
      - { id: d, text: "Only antivirus is skipped", why_wrong: "Exempt skips more than AV." }
    explanation: Use exempt sparingly.
  - id: M4.08.q06
    type: single
    tier: 2
    stem: IPS signatures haven't updated in weeks on a new FortiGate with a valid license. What's a classic cause?
    options:
      - { id: a, text: "No policy uses an IPS sensor, so updates aren't downloaded", correct: true }
      - { id: b, text: "Flow mode disables updates", why_wrong: "No such behaviour." }
      - { id: c, text: "IPS only updates monthly", why_wrong: "Updates are frequent." }
      - { id: d, text: "The SSL profile is certificate inspection", why_wrong: "Unrelated to updates." }
    explanation: At least one policy must use the profile.
    source: FortiOS 8.0.2 Admin Guide pp. 2523, 2812
  - id: M4.08.q07
    type: single
    tier: 3
    stem: How should you build the IPS sensor for a policy protecting a Linux Apache web server in the DMZ?
    options:
      - { id: a, text: "Filters for server-side signatures matching Linux and Apache/HTTP, block on critical and high", correct: true }
      - { id: b, text: "all_default on everything", why_wrong: "Untuned: more false positives and load." }
      - { id: c, text: "protect_client", why_wrong: "That targets clients, not servers." }
      - { id: d, text: "No IPS because the server is patched", why_wrong: "IPS covers the gap before the next patch." }
    explanation: Tune to what's protected.
    source: FortiOS 8.0.2 Admin Guide pp. 2812, 2817
  - id: M4.08.q08
    type: multi
    tier: 2
    stem: Which are FortiOS ways to control GenAI use? Select all that apply.
    options:
      - { id: a, text: "Web filter with the Artificial Intelligence Technology category", correct: true }
      - { id: b, text: "Application control with the Generative AI category", correct: true }
      - { id: c, text: "DLP keyword matching on prompts", correct: true }
      - { id: d, text: "HA override", why_wrong: "Unrelated." }
    explanation: Coarse to fine.
    source: FortiOS 8.0.2 Admin Guide p. 2500
  - id: M4.08.q09
    type: single
    tier: 2
    stem: In application control, a custom signature and a FortiGuard signature both match. Which is used (same entry)?
    options:
      - { id: a, text: "The custom signature", correct: true }
      - { id: b, text: "The FortiGuard signature", why_wrong: "Custom takes precedence." }
      - { id: c, text: "The one with the lower ID", why_wrong: "ID is the last tiebreaker, and higher wins." }
      - { id: d, text: "Both actions apply", why_wrong: "One signature is selected." }
    explanation: Custom beats FortiGuard.
    source: FortiOS 8.0.2 Admin Guide p. 2743
  - id: M4.08.q10
    type: single
    tier: 2
    stem: What does DNS filter do that web filter can't?
    options:
      - { id: a, text: "Block malicious or C&C domains for any application at name resolution, before a connection exists", correct: true }
      - { id: b, text: "Inspect full HTTPS URLs", why_wrong: "That's web filter with deep inspection." }
      - { id: c, text: "Scan files", why_wrong: "That's antivirus." }
      - { id: d, text: "Decrypt TLS", why_wrong: "That's SSL inspection." }
    explanation: Early and protocol-agnostic.
    source: FortiOS 8.0.2 Admin Guide p. 2693
  - id: M4.08.q11
    type: single
    tier: 3
    stem: A policy uses a profile group. The admin tries to add an extra web filter profile individually. What happens?
    options:
      - { id: a, text: "Not possible: a policy uses either a profile group or individual profiles", correct: true }
      - { id: b, text: "Both apply", why_wrong: "They can't be combined." }
      - { id: c, text: "The individual profile overrides the group", why_wrong: "Not how it works." }
      - { id: d, text: "The group is ignored", why_wrong: "No." }
    explanation: Group or individual, not both.
    source: FortiOS 8.0.2 Admin Guide p. 3126
  - id: M4.08.q12
    type: numeric
    tier: 2
    stem: How many FortiGuard web filter category actions are there (Allow, Monitor, Block, Warning, Authenticate)?
    answer: 5
    explanation: Five actions.
    source: FortiOS 8.0.2 Admin Guide p. 2603
  - id: M4.08.q13
    type: single
    tier: 3
    stem: A new customer wants strict web filtering from day one but doesn't know what their users need. Best approach?
    options:
      - { id: a, text: "Monitor all categories for a short period, review logs with them, then block with evidence", correct: true }
      - { id: b, text: "Block everything except a few categories immediately", why_wrong: "Breaks the business and erodes trust." }
      - { id: c, text: "Leave web filter off", why_wrong: "No protection." }
      - { id: d, text: "Use Warning on every category forever", why_wrong: "Users click through; little value." }
    explanation: Evidence first.

labs:
  - id: M4.08.lab1
    title: Web filter and DNS filter for a new office
    goal: Block malicious and adult categories, monitor AI tools, and block botnet domains in DNS.
    worked:
      config: |
        config webfilter profile
            edit "office-wf"
                set feature-set flow
                config ftgd-wf
                    config filters
                        edit 1
                            set category 26
                            set action block
                        next
                        edit 2
                            set category <AI-Technology-category-id>
                            set action monitor
                        next
                    end
                end
            next
        end
        config dnsfilter profile
            edit "office-dns"
                set block-botnet enable
                config ftgd-dns
                    config filters
                        edit 1
                            set category 26
                            set action block
                        next
                    end
                end
            next
        end
        config firewall policy
            edit 10
                set utm-status enable
                set ssl-ssh-profile "certificate-inspection"
                set webfilter-profile "office-wf"
                set dnsfilter-profile "office-dns"
            next
        end
      notes:
        - "Category 26 is Malicious Websites in FortiGuard; confirm IDs on your unit (the GUI shows names)."
        - "Look up the Artificial Intelligence Technology category ID in the GUI before using it."
        - "Certificate inspection is enough for categories; deep inspection adds full URLs."
    faded:
      template: |
        config webfilter profile
            edit "office-wf"
                config ftgd-wf
                    config filters
                        edit 1
                            set {{category}} 26
                            set {{action}} block
                        next
                    end
                end
            next
        end
        config dnsfilter profile
            edit "office-dns"
                set {{block-botnet}} enable
            next
        end
    solo:
      prompt: "Add web filter and DNS filter profiles office-wf and office-dns to policy 12 (remember the prerequisite)."
      required: ["edit 12", "set utm-status enable", "set webfilter-profile \"office-wf\"", "set dnsfilter-profile \"office-dns\""]
      solution: |
        config firewall policy
            edit 12
                set utm-status enable
                set webfilter-profile "office-wf"
                set dnsfilter-profile "office-dns"
            next
        end
      notes: "utm-status enable must come first."
  - id: M4.08.lab2
    title: A tuned IPS sensor for a DMZ web server
    goal: Protect a Linux Apache server with server-side signatures, block critical and high, and block botnet connections.
    worked:
      config: |
        config ips sensor
            edit "dmz-web"
                set scan-botnet-connections block
                config entries
                    edit 1
                        set location server
                        set os Linux
                        set application Apache
                        set severity high critical
                        set action block
                    next
                    edit 2
                        set location server
                        set protocol HTTP
                        set severity medium
                        set action default
                    next
                end
            next
        end
        config firewall policy
            edit 30
                set utm-status enable
                set ips-sensor "dmz-web"
            next
        end
      notes:
        - "Entry 1 matches signatures that apply to Linux AND Apache (filters are ANDed)."
        - "Entry 2 keeps each signature's own default action for medium severity."
        - "Review IPS logs for false positives before tightening further."
    faded:
      template: |
        config ips sensor
            edit "dmz-web"
                set {{scan-botnet-connections}} block
                config entries
                    edit 1
                        set location {{server}}
                        set severity high critical
                        set action {{block}}
                    next
                end
            next
        end
    solo:
      prompt: "Create IPS sensor users-out for outbound user traffic: client-side signatures, severity high and critical, action block, and monitor botnet connections."
      required: ["config ips sensor", "edit \"users-out\"", "set scan-botnet-connections monitor", "set location client", "set severity high critical", "set action block"]
      solution: |
        config ips sensor
            edit "users-out"
                set scan-botnet-connections monitor
                config entries
                    edit 1
                        set location client
                        set severity high critical
                        set action block
                    next
                end
            next
        end
      notes: "protect_client is the predefined starting point for the same idea."

scenarios:
  - id: M4.08.sc1
    kind: situation
    tier: 3
    title: '"Stop people pasting customer data into ChatGPT"'
    situation: |
      A legal firm's managing partner asks you to stop staff pasting client documents into public AI tools, but they've licensed one approved AI assistant.
    ask: Design the controls and explain them to the partner.
    right_thinking:
      - "Don't just block a category: they have a sanctioned tool"
      - "Layer: identify AI use, allow the sanctioned one, control data with DLP"
      - "Deep inspection is needed to see prompts and uploads"
      - "Measure and report shadow AI"
    what: A layered GenAI policy with reporting.
    why: Blocking everything pushes users to personal devices; layered control keeps work visible.
    how:
      - "Application control Generative AI category: allow the approved app, block or monitor others"
      - "DLP on prompts and uploads for client identifiers"
      - "Deep inspection on that policy, with privacy sign-off"
      - "Monthly report of attempts"
    model_answer: |
      I'd give them three layers. Application control on the Generative AI category: the approved assistant allowed, other AI tools blocked or at least monitored. DLP to stop prompts and uploads that contain client identifiers or document markers, which needs deep inspection on that policy, with the partners' sign-off. And a monthly report of who tried which tools, because shadow AI is a behaviour you manage, not just block. I did similar work at Netskope, getting a couple of accounts close to zero unsanctioned AI traffic with the same pattern: visibility first, then targeted control.
    could_have_added: ["Combine with a short staff policy and training"]
    best_way: "Allow the approved AI, block the rest by application category, DLP on prompts, and a monthly report."
    rubric: ["layered design", "keeps sanctioned tool", "data control", "reporting"]
  - id: M4.08.sc2
    kind: situation
    tier: 2
    title: IPS is "breaking the ERP"
    situation: |
      After enabling an IPS sensor, the ERP application intermittently fails. The customer wants IPS turned off.
    ask: What do you do?
    right_thinking:
      - "Find the exact signature in the IPS logs"
      - "Check it's a false positive, not a real attack"
      - "Narrow exception, not disabling IPS"
      - "Tune the sensor to the ERP's platform"
    what: A precise exception and a tuned sensor.
    why: Turning IPS off removes protection for everything else.
    how: ["Filter IPS logs by ERP server IPs", "Identify signature and action", "Validate with the vendor or packet capture", "Override that signature for those hosts; tune filters"]
    model_answer: |
      I'd ask for a bit of time before turning anything off. The IPS logs will show the exact signature, source and destination when the ERP fails. If it's a false positive, I'd add an override for that one signature on the ERP policy, rather than disabling IPS. I'd also tune the sensor to the ERP's platform so it only uses relevant signatures. Then we retest with the ERP team and document the exception.
    best_way: "Find the exact signature in the logs, override just that one if it's a false positive, and tune the sensor."
    rubric: ["evidence", "narrow exception", "tuning", "retest"]
  - id: M4.08.sc3
    kind: hypothetical
    tier: 3
    title: What if the customer wants proxy mode everywhere "for maximum security"?
    situation: |
      A customer on a mid-range model asks for proxy inspection on every policy.
    ask: What's your recommendation?
    right_thinking:
      - "Flow is the default and recommended unless a proxy feature is needed"
      - "Proxy costs resources and buffering latency"
      - "Use proxy where a proxy-only feature is required"
    what: A justified per-policy mode choice.
    why: Unneeded proxy mode can hurt performance without adding protection.
    how: ["List required proxy-only features per policy", "Proxy only there", "Size the model"]
    model_answer: |
      Proxy isn't automatically more secure; it adds specific features like CDR, WAF, inline CASB and video filter. Fortinet recommends flow unless you need those. I'd list which policies actually need a proxy feature, use proxy only there, and keep the rest flow, which uses fewer resources. If they need proxy broadly, we check the model's sizing first.
    best_way: "Flow by default; proxy only where a proxy-only feature is needed, after checking sizing."
    rubric: ["accurate trade-off", "per-policy choice", "sizing"]

interview:
  - id: M4.08.t01
    stage: technical
    question: "Flow versus proxy inspection: when do you use each?"
    testing: Core design
    framework: "How each works → when"
    model_answer: |
      "Flow inspects packets as they pass, holding only the last packet until there's a verdict, so it's fast and is the default. Proxy buffers the whole file or page, inspects it, then releases it or shows a replacement message. I use flow unless I need a proxy-only feature like WAF, CDR, inline CASB or video filtering, and I try to keep modes consistent for performance."
    best_way: "Flow by default; proxy when a proxy-only feature is needed."
    target: "0:35"
  - id: M4.08.t02
    stage: technical
    question: How would you design an IPS sensor for a DMZ web server?
    testing: Tuning mindset
    framework: "Scope → severity/action → botnet → review"
    model_answer: |
      "Tune it to what it protects: server-side signatures filtered by the server's OS and application, say Linux and Apache, blocking critical and high, and default action for medium. Add botnet C&C blocking. Then I review the logs for false positives and adjust with signature overrides, not by turning IPS off."
    best_way: "Server-side signatures for that OS and app, block high and critical, botnet blocking, then tune from logs."
    target: "0:35"
  - id: M4.08.t03
    stage: technical
    question: In what order does FortiGate apply web filtering?
    testing: Detail knowledge
    framework: "List"
    model_answer: |
      "URL filter first, then FortiGuard categories, then the content filter, the script filter, and finally antivirus scanning. That's why an exempt in the URL filter is powerful: it skips the later checks."
    best_way: "URL filter, FortiGuard categories, content, script, then AV."
    target: "0:20"
  - id: M4.08.t04
    stage: technical
    question: A customer asks how to control generative AI use. What do you propose?
    testing: Current topic, bridging Netskope experience
    framework: "Layers → evidence"
    model_answer: |
      "Three layers on FortiGate: web filter with the AI Technology category, application control with the Generative AI category, and DLP on prompts for sensitive data, with deep inspection where needed. Allow the sanctioned tool, measure the rest, then block with evidence. I did this kind of shadow-AI work at Netskope, and visibility first is what made it stick."
    best_way: "Web filter category, app control, DLP on prompts: allow the sanctioned tool and measure the rest."
    target: "0:40"
  - id: M4.08.h01
    stage: hm
    question: How do you balance security and usability when deploying controls for a customer?
    testing: Consultative approach
    framework: "Monitor → evidence → block → exceptions with owners"
    model_answer: |
      "I start in monitor mode, so the customer sees what's really happening, and we decide what to block using that evidence. Then we block in phases, with a clear path for exceptions that have an owner and a review date. That way security goes up without surprising the business, and the controls stay switched on."
    best_way: "Monitor first, block with evidence, exceptions with owners."
    target: "0:35"

