quiz:
  - id: M5.05.q01
    type: single
    tier: 2
    pretest: true
    stem: "Branch FortiGates over VPN show offline in FortiManager. Likely cause?"
    options:
      - {id: a, text: "FGFM sourced from the WAN IP instead of a tunnel-covered IP (fmg-source-ip)", correct: true}
      - {id: b, text: "FortiManager licence", why_wrong: "Would affect all devices."}
      - {id: c, text: "Policy package too large", why_wrong: "Install issue, not connectivity."}
      - {id: d, text: "Log quota", why_wrong: "FortiAnalyzer."}
    explanation: "Source IP over tunnels."
  - id: M5.05.q02
    type: single
    tier: 2
    stem: "FortiManager fails. What happens to traffic through managed FortiGates?"
    options:
      - {id: a, text: "Nothing; they keep running their configuration", correct: true}
      - {id: b, text: "Traffic stops", why_wrong: "FortiGates are independent."}
      - {id: c, text: "Policies revert", why_wrong: "No."}
      - {id: d, text: "FortiGates reboot", why_wrong: "No."}
    explanation: "Management plane only."
  - id: M5.05.q03
    type: multi
    tier: 2
    stem: "Benefits of FortiManager as local FDS? Select all that apply."
    options:
      - {id: a, text: "Updates for devices without Internet access", correct: true}
      - {id: b, text: "Less Internet bandwidth", correct: true}
      - {id: c, text: "Central control of signature versions", correct: true}
      - {id: d, text: "Replaces FortiGuard licences", why_wrong: "Licences still apply."}
    explanation: "Distribution and control."

labs:
  - id: M5.05.lab1
    title: Morning health check for a managed estate
    goal: "Write the daily FortiManager check for 150 FortiGates."
    worked:
      config: |
        # Device Manager: filter status != synchronized → investigate each (retrieve/reinstall)
        # Connectivity: devices offline → FGFM path / source IP
        # Task Monitor: failed installs overnight → install logs
        # FortiGuard: AV/IPS versions behind → FDS status
        # Firmware: devices not on the target version → plan waves
        # Backup: FortiManager config backup succeeded?
      notes:
        - "15 minutes daily prevents weeks of drift."
    faded:
      template: |
        # not synchronized → {{retrieve}} or reinstall
        # offline → check FGFM TCP {{541}}
    solo:
      prompt: "Write the FGFM port and the setting for its source IP over VPN, one per line."
      required: ["541", "fmg-source-ip"]
      solution: |
        TCP 541
        fmg-source-ip
      notes: "In config system central-management."

scenarios:
  - id: M5.05.sc1
    kind: situation
    tier: 3
    title: Emergency change while FortiManager is down
    situation: |
      FortiManager is down for hardware replacement. An urgent block rule is needed on 30 FortiGates now.
    ask: "How do you do it without creating a mess?"
    right_thinking:
      - "Make the change directly (scripted, consistent) with a change record"
      - "When FortiManager is back: retrieve or apply the same change in the package, then reinstall to align"
      - "Verify sync status"
    what: "Safety now, consistency later."
    why: "Drift is managed, not avoided, in emergencies."
    how: ["Change", "Record", "Reconcile", "Verify"]
    model_answer: |
      "I make the change directly on the 30 FortiGates with one tested script, and log exactly what was changed where.
      When FortiManager is back, I add the same rule to the policy package and reinstall, or retrieve from the devices,
      so the databases match again, and confirm every device shows synchronized."
    best_way: "Do it, record it, reconcile it."
    rubric: ["acts safely", "records", "reconciles"]

interview:
  - id: M5.05.t01
    stage: technical
    question: "A FortiManager install fails on some devices. How do you troubleshoot?"
    testing: "FMG troubleshooting"
    framework: "Log → cause → fix → reinstall"
    model_answer: |
      "I open the install log for the failed devices: usually a missing dynamic mapping for an object or interface, a
      conflict with a local change, or a setting the device's firmware doesn't support. I fix the mapping or
      reconcile the change, preview again, and reinstall only those devices."
    best_way: "The log tells you."
    target: "0:30"
