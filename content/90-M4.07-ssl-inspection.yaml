quiz:
  - id: M4.07.q01
    type: single
    tier: 1
    pretest: true
    stem: Which inspection lets antivirus find malware inside an HTTPS download?
    options:
      - {id: a, text: "Deep (full) SSL inspection", correct: true}
      - {id: b, text: "Certificate (SNI) inspection", trap: near-miss, why_wrong: "It sees the handshake, not the file."}
      - {id: c, text: "IPS without any SSL profile", trap: misconception, why_wrong: "IPS sees encrypted bytes alone."}
      - {id: d, text: "Flow-mode AV with no SSL profile", trap: misconception, why_wrong: "Without decryption AV can't see inside HTTPS."}
    explanation: Only deep inspection decrypts the content.
    source: FortiOS 8.0.2 Admin Guide pp. 3055–3056
  - id: M4.07.q02
    type: single
    tier: 2
    pretest: true
    stem: After enabling deep inspection, every website shows a certificate warning. Most likely cause?
    options:
      - {id: a, text: "Clients don't trust the CA the FortiGate re-signs with", correct: true}
      - {id: b, text: "The web filter blocks each site and returns a TLS error", trap: misconception, why_wrong: "Blocks show block pages, not warnings on every site."}
      - {id: c, text: "The SNI check is strict and closes mismatched sessions", trap: near-miss, why_wrong: "That closes some sessions; it doesn't warn on every site."}
      - {id: d, text: "TLS 1.3 isn't supported, so sites fall back with warnings", trap: misconception, why_wrong: "TLS 1.3 is supported; that's not why every site warns."}
    explanation: Distribute the CA before enabling deep inspection.
    source: FortiOS 8.0.2 Admin Guide p. 3056
  - id: M4.07.q03
    type: single
    tier: 2
    stem: "A user still sees a warning on one site after Fortinet_CA_SSL was installed. The site's own certificate is self-signed. What's happening?"
    options:
      - {id: a, text: "It re-signed with Fortinet_CA_Untrusted, warning correctly about the server", correct: true}
      - {id: b, text: "The CA import failed on that user's laptop, so this one site shows a warning", trap: misconception, why_wrong: "Other sites work, so the import is fine."}
      - {id: c, text: "The site needs Fortinet_CA_Untrusted imported too, so the warning goes away", trap: near-miss, why_wrong: "Never import it: it would hide real attacks."}
      - {id: d, text: "The site is exempt from inspection, so the browser shows its own cert warning", trap: near-miss, why_wrong: "Possible if exempt, but the cause is still the untrusted server certificate."}
    explanation: The warning is the system working.
    source: FortiOS 8.0.2 Admin Guide p. 3056
  - id: M4.07.q04
    type: multi
    tier: 2
    stem: Which web categories are exempt from deep inspection by default? Select all that apply.
    options:
      - {id: a, text: "Finance and Banking", correct: true}
      - {id: b, text: "Health and Wellness", correct: true}
      - {id: c, text: "Personal Privacy", correct: true}
      - {id: d, text: "Social Networking", trap: near-miss, why_wrong: "Privacy-relevant to some, but not exempt by default."}
      - {id: e, text: "Web-based Email", trap: near-miss, why_wrong: "Not in the default exemption list."}
    explanation: The privacy-sensitive categories.
    source: FortiOS 8.0.2 Admin Guide p. 3051
  - id: M4.07.q05
    type: single
    tier: 2
    stem: A web server uses HTTPS on port 8443 and you use the built-in certificate-inspection profile. What happens?
    options:
      - {id: a, text: "8443 isn't inspected; clone the profile and add 8443, or inspect all ports", correct: true}
      - {id: b, text: "It's inspected automatically, as certificate inspection follows the session", trap: misconception, why_wrong: "The built-in profile listens on 443 alone."}
      - {id: c, text: "Edit the built-in profile to add 8443 next to 443 on the HTTPS port list", trap: near-miss, why_wrong: "Built-in profiles are read-only; clone it first."}
      - {id: d, text: "It's inspected if the VIP maps 8443, since VIP ports are added to the profile", trap: misconception, why_wrong: "VIPs don't change the inspection profile's ports."}
    explanation: Clone and add the port.
    source: FortiOS 8.0.2 Admin Guide p. 3054
  - id: M4.07.q06
    type: single
    tier: 3
    format: first-step
    stem: A banking app on employees' phones stops working when deep inspection is enabled, but the bank's website works. Why, and what do you do?
    options:
      - {id: a, text: "The app pins its certificate and rejects the re-signed one; exempt it", correct: true}
      - {id: b, text: "The phones lack the inspection CA; push Fortinet_CA_SSL through MDM", trap: near-miss, why_wrong: "Then the website would also fail; pinned apps reject any CA anyway."}
      - {id: c, text: "The app uses QUIC; block UDP 443 so it falls back to TLS over TCP", trap: near-miss, why_wrong: "QUIC fallback isn't a certificate failure; the website working points to pinning."}
      - {id: d, text: "The app needs older TLS; lower the minimum TLS version on the SSL profile", trap: misconception, why_wrong: "The TLS version isn't what breaks the app."}
    explanation: Pinning needs an exemption.
  - id: M4.07.q07
    type: single
    tier: 2
    stem: How do you inspect inbound HTTPS to your own web server behind a VIP?
    options:
      - {id: a, text: "Import the server's cert and key, and use a Protecting SSL Server profile", correct: true}
      - {id: b, text: "Apply the deep-inspection profile with Fortinet_CA_SSL on the VIP policy", trap: misconception, why_wrong: "Internet clients don't trust that CA; you'd break the site."}
      - {id: c, text: "Apply certificate inspection on the VIP policy, which reads the server cert", trap: near-miss, why_wrong: "It doesn't see the content."}
      - {id: d, text: "Use a customer sub-CA for re-signing, as internet clients trust their PKI", trap: near-miss, why_wrong: "Internet users don't trust the customer's private CA."}
    explanation: Present the real certificate.
    source: FortiOS 8.0.2 Admin Guide pp. 3058–3059
  - id: M4.07.q08
    type: single
    tier: 3
    stem: In a flow-mode policy with deep inspection, Inspect all ports is disabled. Which ports are scanned?
    options:
      - {id: a, text: "All ports", correct: true}
      - {id: b, text: "Mapped ports", trap: near-miss, why_wrong: "That is how proxy mode behaves."}
      - {id: c, text: "443 and 8443", trap: near-miss, why_wrong: "Common HTTPS ports, but flow mode scans all of them."}
      - {id: d, text: "No ports", trap: misconception, why_wrong: "Deep inspection is on, so traffic is scanned."}
    explanation: Flow deep inspection scans all ports regardless.
    source: FortiOS 8.0.2 Admin Guide p. 3052
  - id: M4.07.q09
    type: single
    tier: 2
    stem: What is the default action for revoked server certificates with Custom invalid-certificate settings?
    options:
      - {id: a, text: "Block", correct: true}
      - {id: b, text: "Allow", trap: misconception, why_wrong: "Revoked certificates are blocked by default."}
      - {id: c, text: "Trust & Allow", trap: misconception, why_wrong: "That isn't the default action."}
      - {id: d, text: "Keep Untrusted", trap: near-miss, why_wrong: "That's the default for validation time-outs, not revocation."}
    explanation: Expired, revoked and validation-failed default to block.
    source: FortiOS 8.0.2 Admin Guide p. 3051
  - id: M4.07.q10
    type: order
    tier: 2
    stem: Put a safe deep-inspection rollout in order.
    items: ["Agree scope, privacy sign-off and exemptions", "Distribute the inspection CA to devices", "Enable deep inspection on a pilot policy", "Fix issues with exemptions and widen in phases"]
    explanation: CA first, pilot second, then widen.
  - id: M4.07.q11
    type: single
    tier: 3
    stem: Why does Fortinet's guide recommend a certificate from the customer's own PKI (e.g. Microsoft sub-CA) for deep inspection?
    options:
      - {id: a, text: "Managed devices already trust it, and it can be revoked if compromised", correct: true}
      - {id: b, text: "It makes re-signing faster, since the key size is chosen by the customer", trap: misconception, why_wrong: "Re-signing performance is the same either way."}
      - {id: c, text: "Each unit's Fortinet_CA_SSL differs, so HA peers would need separate trust", trap: near-miss, why_wrong: "Each unit's default CA does differ, but the reason given is existing trust and revocation."}
      - {id: d, text: "It can remove the need for exemptions, as pinned apps trust enterprise CAs", trap: near-miss, why_wrong: "Pinned apps still reject any CA but their own."}
    explanation: Trust and revocation.
    source: FortiOS 8.0.2 Admin Guide p. 4435
  - id: M4.07.q12
    type: text
    tier: 2
    stem: "Which CLI setting under config system global selects the certificate for the admin GUI?"
    accept: ["admin-server-cert", "set admin-server-cert"]
    explanation: set admin-server-cert <name>.
    source: FortiOS 8.0.2 Admin Guide p. 4435
  - id: M4.07.q13
    type: single
    tier: 2
    stem: A customer only wants category-based web filtering and refuses to deploy a CA. What do you recommend?
    options:
      - {id: a, text: "Certificate inspection with web filter, explaining what it can't see", correct: true}
      - {id: b, text: "Deep inspection anyway, with exemptions for the categories they worry about", trap: misconception, why_wrong: "Without the CA, every inspected site breaks."}
      - {id: c, text: "No SSL inspection, with a web filter profile so DNS names can be rated", trap: near-miss, why_wrong: "HTTPS categories need at least certificate inspection on the policy."}
      - {id: d, text: "DNS filter alone, since it covers categories without any profile", trap: near-miss, why_wrong: "Works for domains, but web filter with certificate inspection is the requirement."}
    explanation: Meet the requirement and state the limits.

labs:
  - id: M4.07.lab1
    title: A deep-inspection profile with your CA and exemptions
    goal: Create a deep-inspection profile that uses the customer's CA, exempts banking and health, blocks old TLS and logs exemptions.
    worked:
      config: |
        config firewall ssl-ssh-profile
            edit "deep-corp"
                set server-cert-mode re-sign
                set caname "CORP-Issuing-DPI"
                config https
                    set ports 443 8443
                    set status deep-inspection
                    set min-allowed-ssl-version tls-1.2
                end
                config ssl-exempt
                    edit 1
                        set type fortiguard-category
                        set fortiguard-category 31
                    next
                    edit 2
                        set type fortiguard-category
                        set fortiguard-category 33
                    next
                end
                set ssl-exemption-log enable
            next
        end
        config firewall policy
            edit 10
                set ssl-ssh-profile "deep-corp"
            next
        end
      notes:
        - "Category IDs vary: confirm the IDs for Finance and Banking and Health and Wellness on your FortiGate (the GUI shows names)."
        - "The CA (CORP-Issuing-DPI) is imported first and already trusted by managed devices."
        - "Apply to a pilot policy first."
    faded:
      template: |
        config firewall ssl-ssh-profile
            edit "deep-corp"
                set server-cert-mode {{re-sign}}
                set caname "CORP-Issuing-DPI"
                config https
                    set status {{deep-inspection}}
                    set {{min-allowed-ssl-version}} tls-1.2
                end
                set {{ssl-exemption-log}} enable
            next
        end
    solo:
      prompt: "Create a certificate-inspection profile named cert-8443 that inspects HTTPS on ports 443 and 8443."
      required: ["config firewall ssl-ssh-profile", "edit \"cert-8443\"", "config https", "set ports 443 8443", "set status certificate-inspection"]
      solution: |
        config firewall ssl-ssh-profile
            edit "cert-8443"
                config https
                    set ports 443 8443
                    set status certificate-inspection
                end
            next
        end
      notes: "The built-in certificate-inspection profile is read-only and only uses 443."
  - id: M4.07.lab2
    title: Protect an inbound web server
    goal: Inspect HTTPS to the company portal (VIP portal-vip) with the portal's own certificate.
    worked:
      config: |
        config firewall ssl-ssh-profile
            edit "protect-portal"
                set server-cert-mode replace
                set server-cert "portal-company-com"
                config https
                    set ports 443
                    set status deep-inspection
                end
            next
        end
        config firewall policy
            edit 30
                set name "Internet-to-portal"
                set srcintf "wan1"
                set dstintf "dmz"
                set srcaddr "all"
                set dstaddr "portal-vip"
                set action accept
                set schedule "always"
                set service "HTTPS"
                set utm-status enable
                set ssl-ssh-profile "protect-portal"
                set ips-sensor "protect_http_server"
            next
        end
      notes:
        - "Import the portal certificate with its private key first (System > Certificates)."
        - "server-cert-mode replace = Protecting SSL Server in the GUI."
        - "protect_http_server is a predefined IPS sensor for HTTP servers."
    faded:
      template: |
        config firewall ssl-ssh-profile
            edit "protect-portal"
                set server-cert-mode {{replace}}
                set {{server-cert}} "portal-company-com"
            next
        end
    solo:
      prompt: "Set the FortiGate admin GUI to use the imported certificate named fw-admin-company-com."
      required: ["config system global", "set admin-server-cert \"fw-admin-company-com\""]
      solution: |
        config system global
            set admin-server-cert "fw-admin-company-com"
        end
      notes: "You'll be logged out of the GUI when it changes."

scenarios:
  - id: M4.07.sc1
    kind: situation
    tier: 3
    title: '"Turn on SSL inspection for everyone on Monday"'
    situation: |
      The CISO of a 1,200-user company wants deep inspection on all internet traffic from Monday, after a phishing incident. Laptops are domain-joined; there are also Macs and unmanaged BYOD phones on the guest Wi-Fi.
    ask: How do you respond and plan it?
    right_thinking:
      - "Support the goal: the incident is a real reason"
      - "A big-bang rollout breaks things and burns trust; propose a fast phased plan"
      - "CA distribution per device type, privacy sign-off, exemptions"
      - "BYOD: certificate inspection only, or no CA deployment"
    what: A one-week phased plan with clear decisions for the CISO.
    why: Deep inspection done badly leads to it being switched off; done well it stays on.
    how:
      - "Day 1: legal/HR sign-off, exemption list, CA from their PKI"
      - "Day 1–2: GPO for Windows, MDM for Macs; test"
      - "Day 2–3: pilot with IT and a business group"
      - "Day 4+: phases by department; BYOD stays on certificate inspection"
    model_answer: |
      I'd support the goal: after a phishing incident, inspecting HTTPS is the right move. But switching everyone on Monday will break apps and generate warnings, and the pressure will be to turn it off. I'd propose a fast phased plan instead: get privacy sign-off and agree exemptions like banking and health, issue the inspection certificate from their Microsoft PKI, push it by Group Policy to Windows and MDM to Macs, pilot with IT and one business team for two days, then roll out by department. Guest BYOD stays on certificate inspection because we can't install the CA there. They get protection within the week, and it sticks.
    could_have_added: ["Show the SSL logs from the pilot as evidence of value"]
    best_way: "Right goal; let's do it in a week, in phases: sign-off, CA via GPO and MDM, pilot, then departments. BYOD stays on certificate inspection."
    rubric: ["supports goal", "phased plan", "device-type CA plan", "BYOD handled"]
  - id: M4.07.sc2
    kind: situation
    tier: 2
    title: The app that broke
    situation: |
      Day two of the pilot. Finance reports that their banking token software and a tax-authority portal client stopped working.
    ask: Diagnose and fix without weakening the whole policy.
    right_thinking:
      - "Likely certificate pinning or client certificates"
      - "Find the destinations from logs, exempt narrowly"
      - "Log exemptions, document the owner"
    what: Narrow exemptions with evidence.
    why: Broad exemptions defeat the purpose.
    how: ["Check SSL/UTM logs for the user's sessions", "Identify FQDNs", "Add address or wildcard-FQDN exemptions", "Retest and document"]
    model_answer: |
      These apps usually pin their certificate or use a client certificate, so a re-signed certificate breaks them. I'd find their destinations in the logs for that user, add narrow exemptions by FQDN or wildcard FQDN, not whole categories, and turn on exemption logging. Then retest with Finance and add the entries to the exemption register with an owner.
    best_way: "Pinned apps: exempt their exact destinations, log it, and record who owns the exemption."
    rubric: ["correct cause", "narrow fix", "documentation"]
  - id: M4.07.sc3
    kind: hypothetical
    tier: 3
    title: What if legal says "no decryption of personal data"?
    situation: |
      The customer's legal team says employees' personal browsing must not be decrypted.
    ask: What options do you give?
    right_thinking:
      - "Respect the constraint; it's a requirement, not an obstacle"
      - "Exempt personal categories, decrypt business-relevant traffic"
      - "Certificate inspection for the rest still blocks bad categories"
    what: A policy design that meets legal and security goals.
    why: The best design is one the customer can legally keep running.
    how: ["Exempt privacy categories", "Deep-inspect high-risk and uncategorized sites", "Certificate inspection elsewhere", "Document"]
    model_answer: |
      That's a requirement we design around. Banking, health and personal privacy are already exempt by default, and we can exempt other personal categories legal names. We'd keep deep inspection where the risk is: uncategorized and newly registered domains, file downloads, and business apps. Everything else gets certificate inspection, which still blocks malicious categories without decrypting. Legal signs off the category list, and we log exemptions so audits are easy.
    best_way: "Exempt personal categories, deep-inspect risky and business traffic, certificate-inspect the rest, with legal signing the list."
    rubric: ["respects constraint", "risk-based design", "audit trail"]

interview:
  - id: M4.07.t01
    stage: technical
    question: What's the difference between certificate inspection and deep inspection?
    testing: Core concept
    framework: "What each sees → use case → trade-off"
    model_answer: |
      "Certificate inspection only reads the handshake, the SNI and the server certificate, so it's enough for category filtering with no certificate rollout. Deep inspection makes the FortiGate act as the server to the client: it decrypts, inspects with AV, IPS and web filter, and re-encrypts. It sees the content, but needs the CA trusted on devices, exemptions for pinned apps, and more CPU."
    best_way: "Certificate inspection sees the handshake; deep inspection sees the content, at the cost of a CA rollout and CPU."
    target: "0:40"
  - id: M4.07.t02
    stage: technical
    question: After enabling deep inspection, users get certificate warnings. How do you troubleshoot?
    testing: Troubleshooting
    framework: "Scope → cause → fix"
    model_answer: |
      "First, is it every site or some? Every site means the re-signing CA isn't trusted on that device, so I check how the CA was distributed, GPO, MDM, and app stores like Firefox. Some sites only: if their real certificate is untrusted, the FortiGate signs with Fortinet_CA_Untrusted on purpose, and that warning is correct. Never import that CA. Apps that fail without a warning are usually pinned, and need an exemption."
    best_way: "All sites: CA not trusted on the device. Some sites: untrusted real certificate, working as designed. Apps: pinning, exempt them."
    target: "0:45"
  - id: M4.07.t03
    stage: technical
    question: How would you plan a deep-inspection rollout for an enterprise?
    testing: Delivery planning (I did this at Netskope)
    framework: "Sign-off → CA → pilot → phases"
    model_answer: |
      "I've done this with customers at Netskope, rolling out SSL deep inspection with the CA pushed by Group Policy. The plan: privacy and legal sign-off and an exemption list, an inspection certificate from their PKI, distribution per device type, a pilot group, then phases by department with a rollback to certificate inspection. I track broken apps and add narrow exemptions as we go."
    best_way: "Sign-off, CA from their PKI pushed by GPO and MDM, pilot, phases, narrow exemptions. I did this at Netskope."
    target: "0:50"
  - id: M4.07.t04
    stage: technical
    question: How do you inspect HTTPS going to a customer's own web server?
    testing: Inbound design
    framework: "Method → requirement"
    model_answer: |
      "With a Protecting SSL Server profile: import the server's certificate and private key into the FortiGate and use the profile on the inbound VIP policy. The FortiGate presents the real certificate, decrypts and inspects with IPS, and WAF in proxy mode. You don't use the outbound deep-inspection CA, because internet clients wouldn't trust it."
    best_way: "Import the server's own certificate and key and use Protecting SSL Server on the inbound policy."
    target: "0:30"
  - id: M4.07.h01
    stage: hm
    question: How do you handle a customer who wants something done fast that you think is risky?
    testing: Judgement and influence
    framework: "Agree goal → risk → faster safe path → decision in writing"
    model_answer: |
      "I agree with the goal first, then show the risk in their terms, and offer a path that's nearly as fast but safe. For example, a CISO who wants deep inspection for everyone on Monday: I'd propose a one-week phased rollout that gets them protection quickly without breaking apps. If they still want the risky route, I make sure the decision and risk are written down."
    best_way: "Agree the goal, show the risk, offer a fast safe path, and get decisions in writing."
    target: "0:45"

field_reports:
  - id: M4.07.fr1
    title: Ransomware is everywhere
    body: |
      Ransomware featured in **48 %** of breaches in the 2026 DBIR, and **69 %** of victims didn't pay. Payloads and command-and-control travel over TLS; deep inspection is what lets AV and IPS see them.
    source: Verizon 2026 DBIR
  - id: M4.07.fr2
    title: Phishing still opens the door
    body: |
      Phishing (**16 %**) and pretexting (**6 %**) remain common in the 2026 DBIR, and the human element was involved in **62 %** of breaches. Inspecting the HTTPS a phishing link leads to gives web filter and sandboxing a chance to stop the second step.
    source: Verizon 2026 DBIR
