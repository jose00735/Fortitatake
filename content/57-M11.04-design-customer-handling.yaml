quiz:
  - id: M11.04.q01
    type: single
    tier: 1
    pretest: true
    stem: Which document should contain the full NAT table and every VPN parameter?
    options:
      - {id: a, text: "The low-level design (LLD)", correct: true}
      - {id: b, text: "The high-level design (HLD)", trap: near-miss, why_wrong: "The HLD is for approval; details go in the LLD."}
      - {id: c, text: "The statement of work (SOW)", trap: misconception, why_wrong: "The SOW defines scope, not configuration."}
      - {id: d, text: "The acceptance test plan (ATP)", trap: near-miss, why_wrong: "The ATP tests results; it doesn't hold the build parameters."}
    explanation: LLD is the build document.
  - id: M11.04.q02
    type: single
    tier: 2
    pretest: true
    stem: '"The ISP circuit for the branch wasn''t delivered and cutover is next week." In a RAID log, this is…'
    options:
      - {id: a, text: "An issue, since it's happening now", correct: true}
      - {id: b, text: "A risk, since cutover hasn't failed", trap: near-miss, why_wrong: "The missing circuit already happened; that makes it an issue."}
      - {id: c, text: "An assumption that the ISP will deliver", trap: misconception, why_wrong: "It's a fact now, not something you rely on."}
      - {id: d, text: "A dependency to add to the project plan", trap: near-miss, why_wrong: "The circuit was a dependency; once missed it's tracked as an issue."}
    explanation: Issue, with owner and due date.
  - id: M11.04.q03
    type: single
    tier: 2
    stem: The cutover might slip because the customer's change board meets monthly. What status do you report this week?
    options:
      - {id: a, text: "Amber on schedule, with the reason and the decision needed", correct: true}
      - {id: b, text: "Green until it slips, to avoid alarming the sponsor early", trap: misconception, why_wrong: "That creates a surprise later."}
      - {id: c, text: "Red now, since any slip means the date can't be met at all", trap: near-miss, why_wrong: "It's a risk, not yet a failure."}
      - {id: d, text: "Green, with the change board listed in the risk log instead", trap: near-miss, why_wrong: "Logging it is right, but the status should reflect the risk too."}
    explanation: Amber early.
  - id: M11.04.q04
    type: multi
    tier: 2
    stem: "The customer asks: 'While you're here, can you also set up the guest Wi-Fi?' It's not in the SOW. Good responses? Select all that apply."
    options:
      - {id: a, text: "Acknowledge the request positively", correct: true}
      - {id: b, text: "Explain it's outside the SOW, estimate it", correct: true}
      - {id: c, text: "Offer a change request or follow-up", correct: true}
      - {id: d, text: "Do it quietly tonight as a favour", trap: misconception, why_wrong: "Unbilled work sets expectations and hides cost."}
      - {id: e, text: "Decline it to protect the timeline", trap: near-miss, why_wrong: "Protects scope but damages the relationship; offer the path instead."}
    explanation: Helpful and controlled.
  - id: M11.04.q05
    type: order
    tier: 2
    stem: Put the customer-story structure in order.
    items: ["Problem", "Impact", "Approach", "Proof"]
    explanation: Problem, impact, approach, proof.
  - id: M11.04.q06
    type: single
    tier: 3
    format: "first-step"
    stem: The customer's architect insists on A-A HA where you recommended A-P. Best approach?
    options:
      - {id: a, text: "Compare both against their requirements with evidence, then document the choice", correct: true}
      - {id: b, text: "Decline to build A-A, as your company's design standard requires A-P for this case", trap: misconception, why_wrong: "It's their risk to take, with information."}
      - {id: c, text: "Build A-A as asked and note your preference in the as-built for the record", trap: near-miss, why_wrong: "You owe them your reasoning before the build, not after."}
      - {id: d, text: "Escalate to their CIO so a senior decision-maker settles the disagreement", trap: near-miss, why_wrong: "Try the technical discussion with evidence first."}
    explanation: Evidence, then a documented decision.
  - id: M11.04.q07
    type: single
    tier: 2
    stem: Which principle does "templates in FortiManager and naming standards" serve?
    options:
      - {id: a, text: "Manageability", correct: true}
      - {id: b, text: "Resilience", trap: misconception, why_wrong: "Resilience is about surviving failures."}
      - {id: c, text: "Standardisation", trap: near-miss, why_wrong: "Templates do standardise, but the design principle served is manageability."}
      - {id: d, text: "Visibility", trap: near-miss, why_wrong: "Visibility is logging and alerts, not templates."}
    explanation: The customer must be able to operate it.
  - id: M11.04.q08
    type: single
    tier: 3
    format: "first-step"
    stem: A sponsor is angry about repeated outages and threatens to cancel. First move?
    options:
      - {id: a, text: "Listen, get the facts, find the cause behind the anger, then present a plan", correct: true}
      - {id: b, text: "Offer a service credit straight away to show that you take the outages seriously", trap: near-miss, why_wrong: "May come later, but it doesn't fix the cause."}
      - {id: c, text: "Explain the outages came from their changes, with the logs to prove it", trap: misconception, why_wrong: "Defensive; even if true, lead with listening and a plan."}
      - {id: d, text: "Give them a day to calm down, then book a meeting to talk it through", trap: near-miss, why_wrong: "Silence makes it worse; respond now."}
    explanation: Solve the problem, and the relationship follows.

scenarios:
  - id: M11.04.sc1
    kind: raid
    tier: 4
    title: "Raid: the project is drifting"
    situation: |
      Week 5 of an 8-week SD-WAN rollout for 25 branches. Only 6 branches are done. The customer's network lead is on leave, two ISP circuits are late, and the sponsor has just asked for "a quick status" before tomorrow's board meeting.
    ask: What do you send the sponsor tonight, and what do you change in the plan?
    right_thinking:
      - "Honest RAG: schedule red or amber with clear reasons"
      - "Separate causes: customer dependency (lead on leave), third party (ISPs), your own pace"
      - "Offer options to recover: parallel branches, temporary delegate, re-sequence by circuit availability"
      - "Ask for the decisions you need"
    what: A one-page status with options and decisions requested.
    why: The board will ask; the sponsor needs facts and a plan, not reassurance.
    how: ["RAG + facts", "RAID highlights", "Recovery options with dates", "Decisions needed"]
    pitfalls: ["Reporting green", "Blaming the customer", "No options"]
    model_answer: |
      I'd send a one-page status tonight. Schedule: red, 6 of 25 branches done against a plan of 15. Causes, factually: two ISP circuits late (owner: ISP, escalated), and approvals slowed while the network lead is on leave. Recovery options: re-sequence so we do branches with circuits ready first, run two branches per window instead of one, and a temporary delegate for approvals. With those, the new forecast is week 10, or week 9 if we get a delegate by Monday. Decisions needed: approve the delegate and the double windows. That gives the sponsor a clear story for the board and a plan, not just bad news.
    best_way: "Red, with causes, options and a new forecast, and the two decisions we need from you."
    rubric: ["honest RAG", "factual causes", "options", "decisions requested"]
  - id: M11.04.sc2
    kind: situation
    tier: 3
    title: The design review that turns hostile
    situation: |
      In your HLD review, the customer's security lead says: "This design is too complex, our team can't run it. Why did Fortinet sell us this?"
    ask: How do you respond in the meeting?
    right_thinking:
      - "Don't defend the sale; engage with the concern"
      - "Manageability is a design principle: it's a valid requirement"
      - "Simplify where possible; offer knowledge transfer and runbooks"
    what: A respectful, constructive reply and a design adjustment.
    why: A design the team can't run will fail after handover.
    how: ["Acknowledge", "Ask which parts worry them", "Propose simplifications", "Plan KT and runbooks"]
    model_answer: |
      "That's an important point: if your team can't run it, it's not the right design. Which parts worry you most?" Then I'd look for simplifications, like fewer SD-WAN rules, A-P instead of A-A, templates in FortiManager, and add knowledge transfer and runbooks to the plan. I'd update the HLD with those changes and the reasons, so the decision is clear for everyone.
    best_way: "If your team can't run it, it's not right. Tell me which parts worry you, and we'll simplify and plan knowledge transfer."
    rubric: ["non-defensive", "asks", "simplifies", "updates HLD"]

interview:
  - id: M11.04.h01
    stage: hm
    question: How do you keep a project's stakeholders informed?
    testing: Communication discipline
    framework: "Cadence → format → example"
    model_answer: |
      "A one-page weekly status at the same time each week: RAG for scope, schedule and budget, done and next, decisions needed, and the RAID highlights. I show amber early with the reason, so nobody is surprised. At Netskope I kept that rhythm across a portfolio: weekly status on open issues and quarterly reviews with executives in three languages."
    best_way: "Weekly one-pager with RAG, decisions and RAID. Amber early, no surprises."
    target: "0:45"
  - id: M11.04.h02
    stage: hm
    question: Tell me about a time you had to deliver bad news to a customer.
    testing: Honesty and composure
    framework: "STAR-L"
    model_answer: |
      "[Use a real case: for example, telling an account that the support backlog was blocking their rollout, while escalating it to the director of support.] Show: you told them early, with facts and a plan, you followed up visibly, and the relationship held because there were no surprises."
    best_way: "Early, factual, with a plan, and visible follow-up."
    target: "1:00"
  - id: M11.04.h03
    stage: hm
    question: How do you handle a customer who keeps changing requirements?
    testing: Scope control
    framework: "Pattern"
    model_answer: |
      "I welcome the change and make its cost visible. Check it against the SOW, explain the impact on time and effort, and raise a change request, or park it for a later phase. And I write down each decision. Customers usually appreciate it, because they can prioritise with real information."
    best_way: "Welcome it, show the impact, change request or later phase, and write it down."
    target: "0:40"
  - id: M11.04.t01
    stage: technical
    question: What's the difference between an HLD and an LLD?
    testing: Delivery documentation
    framework: "Audience → content"
    model_answer: |
      "The HLD is for approval: requirements, target architecture, key decisions and why, risks. The LLD is for building: every interface, IP, route, VPN, HA, SD-WAN, policy and NAT detail, plus the acceptance tests. A good LLD makes the MOP straightforward."
    best_way: "HLD for approval, LLD for building."
    target: "0:30"
  - id: M11.04.h04
    stage: hm
    question: Tell me about turning around an unhappy customer.
    testing: Recovery
    framework: "STAR-L"
    model_answer: |
      "A named enterprise account escalated and was ready to leave. I treated it as a technical problem first: diagnosed and fixed the underlying issue, and with that credibility we restructured the agreement as a licence exchange instead of a cancellation, keeping more than 900 thousand dollars in contract value. Learning: fix the real problem and the relationship follows."
    best_way: "Fixed the technical cause first; the escalation became a licence exchange, more than USD 900k kept."
    target: "1:00"

field_reports:
  - id: M11.04.fr1
    title: Speed of response is money
    body: |
      IBM's 2026 report found organizations using security AI and automation extensively saved **USD 1.93 million** and **65 days** per breach. Good designs include the logging, alerting and runbooks that make fast response possible.
    source: IBM Cost of a Data Breach Report 2026
