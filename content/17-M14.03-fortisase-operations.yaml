id: M14.03
title: "Operating FortiSASE: SOC logging, troubleshooting remote users and migration projects"
stage: S14
stage_title: "S14 · FortiSASE (consultant level)"
order: 16.3
quality: 2
est_sessions: 1.5
objectives:
  - Send FortiSASE logs to FortiAnalyzer, syslog or CEF over public or private (SPA) paths, reliably
  - Troubleshoot remote users with Digital Experience Monitoring, endpoint views and PoP packet capture
  - Recognise the break-fix patterns that recur in SASE rollouts and their root causes
  - Run a migration to FortiSASE (from VPN, from on-prem EMS, from another SSE) with waves and success criteria
sources:
  - "FortiSASE 7.4 Administration Guide: Operations — DEM, endpoints, connected users, logs and log forwarding (pp. 72–111, 260–275)"
  - "FortiSASE 7.4 Administration Guide: FAQs — EMS shift, subscriptions (pp. 962–978)"
  - "Earlier modules: M14.01 (onboarding, SSL-to-IPsec), M14.02 (policies, SPA, ZTNA), M13.01 (log sources)"

units:
  - id: M14.03.u1
    title: "Getting SASE logs into the SOC"
    tier: 3
    est_min: 14
    body: |
      Remote users are invisible to the SOC unless FortiSASE's logs reach it. Log forwarding sends them to up to
      **two external servers**, each one of:

      - **FortiAnalyzer** (the usual choice for a Fortinet SOC),
      - **Syslog**, or **CEF** for third-party SIEMs.

      Design decisions per server:

      | Decision | Options | Guidance |
      |---|---|---|
      | Path | Public (over the Internet) or **private through SPA** to an on-prem collector | Private keeps logs off the Internet and needs SPA working first |
      | Transport | UDP or **reliable** (TCP) | Reliable for anything compliance-relevant; TLS for syslog needs reliable mode and the remote CA imported |
      | Frequency | Real time, every minute, every 5 minutes | Real time for detection use cases |
      | Filters | Log types and severities | Traffic logs dominate volume; size the collector |

      On the FortiAnalyzer side, the PoPs show up as devices that must be **authorized** before logs are stored —
      the step most often forgotten in projects.

      Inside the portal, log views and downloads exist (downloads are capped, for example 100,000 entries per
      export), but a SOC needs the stream, not exports.

      :::recall
      Q: How many external log servers can FortiSASE forward to?
      A: Two (FortiAnalyzer, syslog or CEF each).
      :::

      :::why
      Q: Why do logs sometimes not appear in FortiAnalyzer even though forwarding is configured correctly?
      A: The PoPs must be authorized as devices on FortiAnalyzer; until then their logs aren't stored.
      :::
  - id: M14.03.u2
    title: "Troubleshooting remote users"
    tier: 4
    est_min: 16
    body: |
      Remote-user tickets are rarely "the firewall". Work from the user outwards:

      1. **Endpoint view**: is FortiClient connected, which endpoint profile, which PoP, tunnel up? Endpoint details
         show interfaces, installed software and FortiClient version.
      2. **Digital Experience Monitoring (DEM)**: with the DEM agent online, run a **trace job** from the endpoint
         to a SaaS app to see RTT and loss per hop, and the PoP-to-SaaS health metrics. Ping/ICMP must not be blocked
         by policy or application control for traces to work.
      3. **Policy and logs**: which policy matched (ID in the log), which profile blocked what.
      4. **Packet capture on the PoP** for agent and agentless users when you need packets.

      **Patterns that recur (and their causes):**

      | Symptom | Usual cause |
      |---|---|
      | IPsec agents fail SSO after the transition | IdP lacks the new SP values (port 11443) |
      | Users authenticate but hit implicit deny | Groups match the legacy SSO source, not the IPsec one |
      | One SaaS locks everyone out after a change | Dedicated egress IPs changed; conditional access lists the old ones |
      | Agentless users loop at login | PAC file sends the IdP through the proxy; exclude it |
      | Private app unreachable for everyone after a hub change | A /1 or default route advertised; or hub health check failing |
      | Policy change not applied to some users | SSL agents apply changes after reconnecting |
      | Internal app breaks on certain ports | The port is reserved at the PoP (e.g. 8008–8020 web-filter ports) |

      :::recall
      Q: What must be true for a DEM trace job to run?
      A: The DEM agent is installed and online, and policy/application control doesn't block ICMP.
      :::

      :::why
      Q: Why start with the endpoint view instead of the policy list?
      A: Most remote-user problems are client state (profile, tunnel, PoP, posture); the policy only matters once traffic arrives.
      :::
  - id: M14.03.u3
    title: "Migration projects"
    tier: 4
    est_min: 16
    body: |
      **Common starting points and what changes:**

      - **From FortiGate SSL VPN.** Users move to the agent; private apps move to SPA (the old VPN FortiGate often
        becomes the SPA hub) or ZTNA; internet traffic is now inspected at the PoP. Keep the old VPN as a fallback
        until the last wave.
      - **From on-prem EMS or FortiClient Cloud.** FortiSASE uses its own EMS; old configuration isn't preserved, so
        profiles are rebuilt, then endpoints are moved in waves with the invitation code.
      - **From another SSE (for example Netskope or Zscaler).** Map concepts, not menus: steering configuration →
        endpoint profiles and split tunnel; real-time protection policies → FortiSASE policies with profile groups;
        private access publishers → FortiGate SPA hubs or ZTNA gateways; client rollout by MDM → FortiClient
        packages by MDM. Run both clients side by side only for testing; two steering agents on one laptop fight.
      - **Licensing changes.** Moving between FortiFlex and other licence forms can mean a new instance; do it before
        the full deployment, not after.

      **A wave plan that works:** pilot (IT, 20–50 users, varied OS) → early adopters by department → bulk waves
      by region or business unit → stragglers and exceptions. Each wave has entry criteria (devices compliant,
      users told), exit criteria (login success rate, top-10 apps work, ticket rate under a threshold) and a
      rollback.

      :::recall
      Q: Name three exit criteria for a SASE wave.
      A: Login success rate, top apps working, ticket rate under a threshold (and logs arriving at the SOC).
      :::

      :::why
      Q: Why avoid running two SSE agents in production on the same laptop?
      A: Both try to steer the same traffic; the result is broken connectivity and confusing troubleshooting.
      :::

