  - {id: M1.02.c03, unit: M1.02.u1, tier: 2, front: "IPv6 neighbour discovery uses", back: "ICMPv6 (NDP), not ARP."}
  - {id: M1.02.c04, unit: M1.02.u2, tier: 2, front: "ICMP type 3 code 3", back: "Port unreachable: host up, nothing on that UDP port."}
  - {id: M1.02.c05, unit: M1.02.u2, tier: 2, front: "ICMP type 3 code 4", back: "Fragmentation needed (DF set, packet too big)."}
  - {id: M1.02.c06, unit: M1.02.u2, tier: 2, front: "ICMP type 11", back: "Time exceeded: TTL reached zero (traceroute)."}
