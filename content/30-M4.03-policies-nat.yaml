quiz:
  - id: M4.03.q01
    type: single
    tier: 1
    pretest: true
    stem: Policy 5 allows LAN → WAN HTTPS. Policy 2, above it, denies LAN → WAN for the same source. What happens to the HTTPS traffic?
    options:
      - {id: a, text: "Denied, since policy 2 matches first", correct: true}
      - {id: b, text: "Allowed, since accept beats deny here", trap: misconception, why_wrong: "There's no precedence by action; order decides."}
      - {id: c, text: "Allowed, since the HTTPS service is more exact", trap: near-miss, why_wrong: "FortiGate takes the first match, not the most specific policy."}
      - {id: d, text: "Denied, and policy 5 logs it as a shadow hit", trap: near-miss, why_wrong: "Denied is right, but the first matching policy alone applies and logs."}
    explanation: Top-down, first match.
  - id: M4.03.q02
    type: single
    tier: 1
    pretest: true
    stem: Which FortiOS object performs destination NAT?
    options:
      - {id: a, text: "A virtual IP object", correct: true}
      - {id: b, text: "An overload IP pool", trap: near-miss, why_wrong: "IP pools are for source NAT."}
      - {id: c, text: "A central SNAT rule", trap: near-miss, why_wrong: "Central SNAT rewrites sources; DNAT is still done by VIPs."}
      - {id: d, text: "An address group", trap: misconception, why_wrong: "Address groups group addresses; they don't translate."}
    explanation: VIPs map external addresses to internal ones.
  - id: M4.03.q03
    type: single
    tier: 2
    pretest: true
    stem: A deny policy for a list of bad IPs sits above the VIP policy for the web server, yet those IPs still reach the server. Most likely cause?
    options:
      - {id: a, text: "match-vip is off on the deny policy, so VIP traffic skips it", correct: true}
      - {id: b, text: "Deny policies are evaluated after accepts when both match one flow", trap: misconception, why_wrong: "Order normally decides; VIP traffic is the special case."}
      - {id: c, text: "The VIP needs portforward enabled so the deny policy sees the port", trap: near-miss, why_wrong: "Port forwarding changes which ports map, not whether denies match."}
      - {id: d, text: "The deny policy uses the public IPs, but needs the mapped server IP", trap: near-miss, why_wrong: "Destination matching is fine; without match-vip the deny is skipped for DNAT traffic."}
    explanation: Enable match-vip on the deny policy (or use a src-filter VIP in a deny policy).
    source: FortiOS 8.0.2 Admin Guide pp. 2107–2108
  - id: M4.03.q04
    type: single
    tier: 2
    pretest: true
    stem: With central NAT enabled, where is outbound SNAT configured?
    options:
      - {id: a, text: "In the central-snat-map table", correct: true}
      - {id: b, text: "In each policy's NAT setting", trap: misconception, why_wrong: "That option is skipped when central NAT is on."}
      - {id: c, text: "In an IP pool on the interface", trap: near-miss, why_wrong: "Pools are referenced by central SNAT rules; they don't apply themselves."}
      - {id: d, text: "In the VIP's source settings", trap: misconception, why_wrong: "VIPs handle destination NAT, not source."}
    explanation: Central NAT separates translation into central-snat-map.
    source: FortiOS 8.0.2 Admin Guide p. 2177
  - id: M4.03.q05
    type: single
    tier: 1
    pretest: true
    stem: Which IP pool type should a branch normally use for internet access?
    options:
      - {id: a, text: "Overload", correct: true}
      - {id: b, text: "One-to-one", trap: misconception, why_wrong: "Needs one public IP per user."}
      - {id: c, text: "Fixed port range", trap: near-miss, why_wrong: "Used when you need deterministic IP:port tracing, not by default."}
      - {id: d, text: "Port block alloc", trap: near-miss, why_wrong: "Mostly for carrier-grade or very large guest networks."}
    explanation: Overload is the general PAT case.
  - id: M4.03.q06
    type: multi
    tier: 1
    stem: Which fields must all match for a FortiGate firewall policy to match a new session? Select all that apply.
    options:
      - {id: a, text: "Incoming interface", correct: true}
      - {id: b, text: "Outgoing interface", correct: true}
      - {id: c, text: "Service and port", correct: true}
      - {id: d, text: "Schedule in force", correct: true}
      - {id: e, text: "Source MAC vendor", trap: near-miss, why_wrong: "Device detection can feed policies, but MAC vendor isn't a standard match field."}
    explanation: Interfaces, addresses, service and schedule (plus users/devices when set).
    source: FortiOS 8.0.2 Admin Guide p. 2094
  - id: M4.03.q07
    type: single
    tier: 2
    stem: What is the default source port translation when you enable NAT with the outgoing interface address?
    options:
      - {id: a, text: "Only when ports conflict", correct: true}
      - {id: b, text: "Always, on each new session", trap: near-miss, why_wrong: "'Always' is an option, not the default."}
      - {id: c, text: "Never, keeping the port", trap: near-miss, why_wrong: "'Never' is an option, not the default."}
      - {id: d, text: "Random per packet", trap: misconception, why_wrong: "Ports are chosen per session, not per packet."}
    explanation: FortiGate keeps the original source port unless it collides.
    source: FortiOS 8.0.2 Admin Guide p. 2167
  - id: M4.03.q08
    type: single
    tier: 2
    stem: "One public IP must publish HTTPS for server A and SSH for server B. Which VIP setting makes this possible?"
    options:
      - {id: a, text: "Port forwarding with per-port mappings", correct: true}
      - {id: b, text: "Two static NAT VIPs on the same external IP", trap: near-miss, why_wrong: "Static NAT maps the whole port range; two would overlap."}
      - {id: c, text: "An overload IP pool with both servers in it", trap: misconception, why_wrong: "IP pools are source NAT."}
      - {id: d, text: "A VIP group with server A and B as members", trap: near-miss, why_wrong: "Groups combine VIPs; each still needs port forwarding to share the IP."}
    explanation: Port-forwarding VIPs map specific ports, so one IP can front several servers.
  - id: M4.03.q09
    type: single
    tier: 2
    stem: Can you enable match-vip on an accept policy?
    options:
      - {id: a, text: "No; it's a deny-policy option", correct: true}
      - {id: b, text: "Yes, and it's on by default", trap: misconception, why_wrong: "It can't be enabled when the action is accept."}
      - {id: c, text: "Yes, but with central NAT on", trap: near-miss, why_wrong: "Central NAT doesn't change this."}
      - {id: d, text: "Yes, in policy-based NGFW mode", trap: near-miss, why_wrong: "It isn't a mode-dependent option."}
    explanation: match-vip is a deny-policy option; it's enabled by default on new deny policies.
    source: FortiOS 8.0.2 Admin Guide p. 2108
  - id: M4.03.q10
    type: single
    tier: 3
    stem: A customer needs to identify which internal user was behind public IP 203.0.113.5 port 40112 last Tuesday, but they don't keep per-session NAT logs. Which IP pool type should they have used?
    options:
      - {id: a, text: "Fixed port range", correct: true}
      - {id: b, text: "Overload pool", trap: misconception, why_wrong: "Port use is dynamic; without logs you can't map it back."}
      - {id: c, text: "One-to-one pool", trap: near-miss, why_wrong: "Traceable, but needs one public IP per user."}
      - {id: d, text: "Port block allocation", trap: near-miss, why_wrong: "Blocks are assigned dynamically, so you still need the allocation logs."}
    explanation: Fixed port range maps each internal IP to a known port range, so IP:port can be traced deterministically.
  - id: M4.03.q11
    type: order
    tier: 3
    stem: Order the FortiOS hairpin NAT configuration steps from the guide.
    items: ["Create a VIP mapping the external IP to the internal server", "Create a DNAT firewall policy with the VIP", "Create a SNAT policy for internal users", "Verify access from inside and outside"]
    explanation: VIP, DNAT policy, SNAT policy, verify.
    source: FortiOS 8.0.2 Admin Guide p. 2231
  - id: M4.03.q12
    type: single
    tier: 3
    stem: Which statement about central NAT is correct?
    options:
      - {id: a, text: "Off by default; once on, NAT settings in IPv4 policies are skipped", correct: true}
      - {id: b, text: "On by default for new VDOMs, so the policy NAT settings are skipped", trap: misconception, why_wrong: "It isn't enabled by default."}
      - {id: c, text: "It moves DNAT to a central table but leaves SNAT in each policy", trap: near-miss, why_wrong: "SNAT moves to central-snat-map; DNAT stays with VIPs."}
      - {id: d, text: "Its SNAT rules apply before the security policy has been checked", trap: near-miss, why_wrong: "Central SNAT is applied after the security policy."}
    explanation: Disabled by default; SNAT moves to the central table, read top-down, applied after the security policy.
    source: FortiOS 8.0.2 Admin Guide p. 2177
  - id: M4.03.q13
    type: numeric
    tier: 3
    stem: "A port block allocation pool uses block size 128. How many blocks fit in one external IP's 60,416 ports? (whole number)"
    answer: 472
    explanation: 60,416 / 128 = 472 (the guide's own example).
    source: FortiOS 8.0.2 Admin Guide p. 2170
  - id: M4.03.q14
    type: numeric
    tier: 3
    stem: Same pool, 8 blocks per user. What's the maximum number of ports one internal IP can use?
    answer: 1024
    explanation: 128 × 8 = 1,024.
    source: FortiOS 8.0.2 Admin Guide p. 2170
  - id: M4.03.q15
    type: single
    tier: 4
    stem: "After upgrading to FortiOS 7.6.5, a one-arm design where traffic leaves the interface it arrived on starts dropping. What changed?"
    options:
      - {id: a, text: "allow-traffic-redirect is now off by default, so it needs an IPv4 policy", correct: true}
      - {id: b, text: "The upgrade turned on central NAT by default, so policy NAT is now ignored", trap: misconception, why_wrong: "Upgrades don't enable central NAT."}
      - {id: c, text: "Anti-replay now drops the TCP replies that come back on the same port", trap: near-miss, why_wrong: "May matter once a policy exists, but the first change is the redirect default."}
      - {id: d, text: "Strict RPF became the default, so same-interface replies fail the check", trap: near-miss, why_wrong: "RPF defaults didn't change; the redirect setting did."}
    explanation: The guide notes the default change and that it applies after upgrade even if previously enabled. Add a policy (and disable anti-replay for such TCP traffic if needed).
    source: FortiOS 8.0.2 Admin Guide p. 2107
  - id: M4.03.q16
    type: single
    tier: 4
    stem: "Debug flow for a blocked flow says `Denied by forward policy check (policy 0)`. What does that mean?"
    options:
      - {id: a, text: "No configured policy matched; the implicit deny dropped it", correct: true}
      - {id: b, text: "Policy ID 0 is the first policy in the list, a deny policy", trap: misconception, why_wrong: "Policy IDs start at 1; 0 is the implicit deny."}
      - {id: c, text: "A policy matched but its IPS profile dropped the first packet", trap: near-miss, why_wrong: "IPS drops show differently, with the real policy ID."}
      - {id: d, text: "The route lookup found no path, so no policy could be checked", trap: near-miss, why_wrong: "A route failure gives a different message."}
    explanation: Policy 0 is the implicit deny. Check interfaces (routing), addresses, service and schedule of the policy you expected.
  - id: M4.03.q17
    type: "output"
    tier: 4
    output: |
      msg="vd-root:0 received a packet(proto=6, 10.10.1.20:50544->52.7.1.9:443) from lan. flag [S]"
      msg="allocate a new session-0004c3d1"
      msg="find a route: flag=00000000 gw-10.255.0.1 via vpn-hq"
      msg="Denied by forward policy check (policy 0)"
    stem: "A new lan → wan policy for this traffic never gets hits. What's wrong?"
    options:
      - {id: a, text: "Routing picks vpn-hq, so the lookup wants a lan → vpn-hq policy", correct: true}
      - {id: b, text: "The new policy sits below a deny and needs to move up the list", trap: near-miss, why_wrong: "Order doesn't help when the interface pair doesn't match."}
      - {id: c, text: "NAT is off on the policy, so the session can't leave through wan", trap: misconception, why_wrong: "NAT doesn't decide the outgoing interface."}
      - {id: d, text: "The policy's schedule doesn't cover now, so it's skipped silently", trap: near-miss, why_wrong: "Possible in general, but the debug shows the egress is vpn-hq."}
    explanation: The outgoing interface comes from routing before the policy lookup. Fix the route (or add the right policy if the routing is intended).
  - id: M4.03.q18
    type: single
    tier: 5
    stem: A customer migrating 900 Check Point rules wants to keep NAT reviewable separately from security rules. They plan to "just flip central NAT on" during cutover night. Your advice?
    options:
      - {id: a, text: "Decide it in design, build and test the central tables before cutover, keep a rollback", correct: true}
      - {id: b, text: "Flip it during cutover, since it's one command and can be turned back off if needed", trap: misconception, why_wrong: "It changes how every policy behaves; untested on cutover night is high risk."}
      - {id: c, text: "Cut over with policy NAT first, then switch to central NAT a week later without a window", trap: near-miss, why_wrong: "Switching later still changes every policy; it needs its own tested change."}
      - {id: d, text: "Use FortiConverter's central NAT output as is, since the tool already tests the tables", trap: near-miss, why_wrong: "Conversion is a draft; the tables still need review and testing."}
    explanation: Central NAT is a design decision with a test plan, not a cutover toggle.
  - id: M4.03.q19
    type: single
    tier: 2
    stem: With an overload IP pool of several IPs, how does FortiOS choose which public IP a client gets?
    options:
      - {id: a, text: "Deterministically, from the source IP modulo the pool size", correct: true}
      - {id: b, text: "Randomly per session, to spread the load over the pool's IPs", trap: misconception, why_wrong: "The guide shows a deterministic calculation."}
      - {id: c, text: "Round robin per new session across the IPs in the pool", trap: near-miss, why_wrong: "Close, but the choice comes from the source IP, so a client keeps its IP."}
      - {id: d, text: "The first IP until its ports run out, then the next IP", trap: near-miss, why_wrong: "That's not how overload pools assign IPs."}
    explanation: The guide's formula is Y = P1 + X mod R1, so a client keeps the same public IP.
    source: FortiOS 8.0.2 Admin Guide pp. 2167–2168
  - id: M4.03.q20
    type: single
    tier: 3
    stem: What does the guide say policy-based NGFW mode implies about NAT?
    options:
      - {id: a, text: "Central SNAT is implicitly enabled", correct: true}
      - {id: b, text: "NAT isn't supported in that mode", trap: misconception, why_wrong: "NAT works; it's done centrally."}
      - {id: c, text: "IP pools are set in each security policy", trap: near-miss, why_wrong: "Pools are referenced from the central SNAT table in this mode."}
      - {id: d, text: "VIPs move into the security policies", trap: near-miss, why_wrong: "DNAT is still configured with VIPs, not inside security policies."}
    explanation: In policy-based NGFW mode, central SNAT is implicit.
    source: FortiOS 8.0.2 Admin Guide p. 2177
  - id: M4.03.q21
    type: single
    tier: 4
    stem: Inside users can't reach the intranet portal by its public name; outside users can. There's a VIP policy WAN → DMZ only. Which addition from the FortiOS hairpin example fixes it?
    options:
      - {id: a, text: "A policy from the inside interface to the VIP, plus SNAT so replies return", correct: true}
      - {id: b, text: "A second VIP for inside users with its own external IP and the same server", trap: near-miss, why_wrong: "The issue is the inside policy and return path, not the IP."}
      - {id: c, text: "Disable match-vip on the deny policies so inside users reach the VIP fine", trap: misconception, why_wrong: "Unrelated to inside users reaching a VIP."}
      - {id: d, text: "A policy from the inside to the VIP, without SNAT, so the server sees users", trap: near-miss, why_wrong: "Without SNAT the server answers users directly and the session breaks."}
    explanation: Hairpin needs the inside → VIP path allowed and SNAT so the server answers through the FortiGate. Split DNS is the alternative.

labs:
  - id: M4.03.lab1
    title: Publish a web server with a port-forwarding VIP
    goal: Publish 172.16.200.55:80 as 10.1.100.199 on TCP 8080–8082 (FortiOS guide example) and allow it from wan1.
    worked:
      config: |
        config firewall vip
            edit "WebServer_VIP_Services"
                set service "TCP_8080-8082"
                set extip 10.1.100.199
                set extintf "any"
                set portforward enable
                set mappedip "172.16.200.55"
                set mappedport 80
            next
        end
        config firewall policy
            edit 30
                set name "Publish-Web"
                set srcintf "wan1"
                set dstintf "dmz"
                set srcaddr "all"
                set dstaddr "WebServer_VIP_Services"
                set action accept
                set schedule "always"
                set service "ALL"
                set utm-status enable
                set ips-sensor "default"
                set logtraffic all
            next
        end
      notes:
        - "The VIP is the destination address of the policy."
        - "Add IPS on every published service; restrict srcaddr when the customer knows who connects."
        - "Test from outside, and from inside only if hairpin NAT is configured."
    faded:
      template: |
        config firewall {{vip}}
            edit "WebServer_VIP_Services"
                set extip 10.1.100.199
                set {{portforward}} enable
                set {{mappedip}} "172.16.200.55"
                set mappedport {{80}}
            next
        end
    solo:
      prompt: "Publish SSH on external IP 203.0.113.10 port 2222 to internal 10.0.10.30 port 22 (VIP name SSH-JUMP, external interface wan1)."
      required: ["config firewall vip", "edit ssh-jump", "set extip 203.0.113.10", "set extintf wan1", "set portforward enable", "set mappedip 10.0.10.30", "set extport 2222", "set mappedport 22"]
      solution: |
        config firewall vip
            edit "SSH-JUMP"
                set extip 203.0.113.10
                set extintf "wan1"
                set portforward enable
                set mappedip "10.0.10.30"
                set extport 2222
                set mappedport 22
            next
        end
      notes: "Then reference SSH-JUMP as the destination of a wan1 → lan accept policy, ideally limited to known source IPs."
  - id: M4.03.lab2
    title: Outbound SNAT with an overload IP pool
    goal: Make LAN users leave wan1 from pool 172.16.200.1–172.16.200.2 instead of the interface IP.
    worked:
      config: |
        config firewall ippool
            edit "Overload-ippool"
                set type overload
                set startip 172.16.200.1
                set endip 172.16.200.2
            next
        end
        config firewall policy
            edit 10
                set srcintf "lan"
                set dstintf "wan1"
                set srcaddr "LAN-NET"
                set dstaddr "all"
                set action accept
                set schedule "always"
                set service "ALL"
                set nat enable
                set ippool enable
                set poolname "Overload-ippool"
            next
        end
      notes:
        - "Overload = PAT across the pool's IPs."
        - "The ISP must route the pool IPs to the FortiGate (or they must be in the WAN subnet)."
        - "Each client keeps the same pool IP (source IP mod pool size)."
    faded:
      template: |
        config firewall ippool
            edit "Overload-ippool"
                set type {{overload}}
                set {{startip}} 172.16.200.1
                set endip 172.16.200.2
            next
        end
        config firewall policy
            edit 10
                set nat {{enable}}
                set {{ippool}} enable
                set poolname "Overload-ippool"
            next
        end
    solo:
      prompt: "Create a one-to-one IP pool ONE2ONE for 198.51.100.10–198.51.100.11 and apply it to policy 12."
      required: ["config firewall ippool", "edit one2one", "set type one-to-one", "set startip 198.51.100.10", "set endip 198.51.100.11", "edit 12", "set nat enable", "set ippool enable", "set poolname one2one"]
      solution: |
        config firewall ippool
            edit "ONE2ONE"
                set type one-to-one
                set startip 198.51.100.10
                set endip 198.51.100.11
            next
        end
        config firewall policy
            edit 12
                set nat enable
                set ippool enable
                set poolname "ONE2ONE"
            next
        end
  - id: M4.03.lab3
    title: Block bad sources in front of a published server
    goal: Deny the address group BLOCKLIST from reaching the VIP policy on wan1, using match-vip.
    worked:
      config: |
        config firewall policy
            edit 1
                set name "deny-policy-1"
                set srcintf "wan1"
                set dstintf "lan1"
                set srcaddr "BLOCKLIST"
                set dstaddr "all"
                set action deny
                set schedule "always"
                set service "ALL"
                set match-vip enable
            next
        end
      notes:
        - "Place it above the VIP accept policy."
        - "match-vip is on by default for new deny policies; check it wasn't turned off."
        - "Log the deny policy to show the customer what it blocks."
    solo:
      prompt: "Write deny policy 3 from wan1 to dmz for source GEO-BLOCK, any destination, all services, that also matches VIP traffic and logs it."
      required: ["config firewall policy", "edit 3", "set srcintf wan1", "set dstintf dmz", "set srcaddr geo-block", "set action deny", "set match-vip enable", "set logtraffic all"]
      solution: |
        config firewall policy
            edit 3
                set srcintf "wan1"
                set dstintf "dmz"
                set srcaddr "GEO-BLOCK"
                set dstaddr "all"
                set action deny
                set schedule "always"
                set service "ALL"
                set match-vip enable
                set logtraffic all
            next
        end

scenarios:
  - id: M4.03.sc1
    kind: situation
    tier: 4
    title: The geo-block that didn't block
    situation: |
      A healthcare customer's CISO asked to block all traffic from three countries. Their admin added a deny policy with GEO addresses at the top. A week later their published patient portal still shows logins from those countries.
    stakeholders: ["CISO", "Firewall admin", "Compliance officer"]
    ask: Explain what happened in plain words and fix it.
    right_thinking:
      - "Check the deny policy's match-vip setting and its position relative to the VIP policy"
      - "Explain: VIP policies have priority, so without match-vip the deny never sees portal traffic"
      - "Fix: enable match-vip (or a src-filter VIP in a deny policy); log the deny"
      - "Validate with logs: deny hits from those countries, no more portal sessions"
      - "Report to CISO: impact window, fix, evidence, and an audit of other deny policies"
    what: Enable match-vip on the geo deny policy and prove it with logs.
    why: Policies with VIPs have priority over typical policies; match-vip lets a deny policy cover VIP traffic.
    how: ["show the deny policy config", "set match-vip enable", "log it", "check FortiView / logs", "audit other deny policies"]
    pitfalls: ["Moving the deny policy around without checking match-vip", "Not telling compliance there was an exposure window"]
    model_answer: |
      "The deny policy was in the right place, but FortiGate treats policies with virtual IPs differently: they get priority, so traffic to the portal never hit the geo-block. The fix is one setting, match-vip, on the deny policy. I'll enable it, log it, and show you the denies in the logs today. I'll also review your other deny policies for the same gap, and give compliance the exposure window so they can decide if anything needs reporting."
    could_have_added: ["Suggest IPS and rate limiting on the portal VIP policy", "Propose reviewing the portal's authentication logs for that week"]
    best_way: "Your block was in the right place but couldn't see traffic to the portal. One setting fixes it, and I'll show you the proof in the logs."
    rubric: ["diagnosis", "plain-language explanation", "fix", "evidence", "governance and follow-up"]
  - id: M4.03.sc2
    kind: situation
    tier: 5
    title: Central NAT in a 900-rule migration
    situation: |
      You're leading the migration of a bank's Check Point cluster (900 rules, 60 NAT rules) to a FortiGate HA pair managed by FortiManager. Their security team wants NAT kept separate from security rules for audits. Cutover is in four weeks.
    constraints: ["Two 4-hour maintenance windows", "Auditors need a NAT report after go-live"]
    stakeholders: ["Security architect", "Network ops", "Auditors"]
    ask: How do you handle NAT in the design and migration plan?
    right_thinking:
      - "Decide central NAT vs policy NAT in the design workshop, with the reasons written down"
      - "Map every source NAT rule to central SNAT and every static/destination NAT to VIPs (central DNAT)"
      - "Build in FortiManager, review with the security team, lab-test the rule base"
      - "Acceptance test plan: one test per VIP and per SNAT path"
      - "Rollback: config backup / FMG revision, documented in the MOP"
    what: Central NAT, designed and tested before cutover, with a per-rule test plan.
    why: Central NAT keeps translations reviewable in one ordered table; enabling it changes how every policy behaves, so it must be designed and tested, not toggled.
    how: ["Design decision record", "NAT mapping sheet", "FMG build and review", "Lab test", "ATP per VIP and SNAT", "MOP with rollback"]
    pitfalls: ["Leaving NAT design to cutover night", "Not testing return traffic", "Forgetting hairpin cases for internal users"]
    model_answer: |
      "I'd make NAT a design decision in week one: central NAT fits their audit need, because all translations sit in one ordered table. Every Check Point NAT rule gets mapped to a central SNAT rule or a VIP in a mapping sheet the security team signs off. We build it in FortiManager, test it in the lab, and the acceptance plan has one test per VIP and per SNAT path. The MOP has a FortiManager revision and a config backup as rollback, and after go-live the auditors get the central NAT table as their report."
    best_way: "NAT is a design decision, not a cutover switch. One mapping sheet, signed off, tested rule by rule."
    rubric: ["design decision", "mapping", "build and review", "testing", "rollback and audit"]
  - id: M4.03.sc3
    kind: raid
    tier: 4
    title: "Raid: after the upgrade, the branch portal dies"
    situation: |
      07:40, Monday. You upgraded 30 branch FortiGates to 7.6.5 over the weekend. Three branches with a one-arm design (traffic re-routed out the same interface) report their local app is unreachable. Everything else is fine.
    ask: What do you check and what do you change?
    right_thinking:
      - "Pattern: only one-arm branches, only after the upgrade"
      - "Recall the upgrade note: allow-traffic-redirect is disabled by default from 7.6.5, even if enabled before"
      - "Debug flow on one branch to confirm the drop"
      - "Fix: add the IPv4 policy the traffic now needs (and disable anti-replay for that TCP traffic if required), or re-enable the setting if the design depends on it, as a documented decision"
      - "Apply to the other two branches, update the upgrade runbook"
    what: Restore the redirected traffic path with an explicit policy and update the runbook.
    why: From 7.6.5, allow-traffic-redirect is disabled by default and after upgrade; same-interface traffic then needs a matching IPv4 policy.
    how: ["debug flow", "add policy / adjust setting", "test", "runbook update"]
    pitfalls: ["Rolling back 30 branches for a 3-branch problem", "Not reading release notes before upgrades"]
    model_answer: |
      "Only the one-arm branches broke, right after 7.6.5. That matches a documented change: allow-traffic-redirect is disabled by default from 7.6.5, even if it was on before. I'd confirm with debug flow on one branch, then add the IPv4 policy that traffic now needs, test, and apply it to the other two. Then I'd add this check to our upgrade runbook so the next wave doesn't hit it."
    best_way: "Three branches, same design, same upgrade: that's a documented default change. Confirm on one, fix all three, update the runbook."
    rubric: ["pattern recognition", "confirm with evidence", "targeted fix", "scale the fix", "prevent recurrence"]

interview:
  - id: M4.03.i1
    stage: technical
    question: Walk me through how FortiGate decides whether to allow a new connection.
    testing: Order of operations, clarity
    framework: "Route lookup → policy lookup (first match) → NAT → session → profiles"
    model_answer: |
      "When the first packet arrives, FortiGate does a route lookup to find the outgoing interface. Then it checks the policy table top-down for the first policy where the interfaces, source, destination, service and schedule all match. If none match, the implicit deny drops it. If an accept policy matches, it creates a session with any NAT from the policy or central NAT, and applies the policy's security profiles. Every later packet rides that session. One catch: policies with VIPs have priority, so deny policies need match-vip to stop VIP traffic."
    could_have_added: ["Mention debug flow names the policy ID, and 'policy 0' is the implicit deny"]
    best_way: "Route first, then first-match policy, then NAT and profiles on the session. VIP policies are the exception."
    target: "1:15"
  - id: M4.03.i2
    stage: technical
    question: When would you recommend central NAT to a customer?
    testing: Design judgement, migration experience
    framework: "What it is → when it fits → risk → how you'd roll it out"
    model_answer: |
      "Central NAT moves translation out of each policy into ordered SNAT and DNAT tables. I'd recommend it for large rule bases, customers migrating from vendors that already separate NAT, or teams that must audit NAT on its own. It's off by default and enabling it changes how every policy behaves, so I'd decide it in the design phase, build and test the tables before cutover, and keep a config backup or FortiManager revision as rollback."
    best_way: "Central NAT is great for big rule bases and audits, but it's a design decision with a test plan, never a cutover toggle."
    target: "1:00"
  - id: M4.03.i3
    stage: technical
    question: A customer's deny policy doesn't stop traffic to their published server. Why?
    testing: A FortiGate-specific gotcha
    framework: "Mechanism → fix → validation"
    model_answer: |
      "Because policies with a virtual IP have priority over normal policies, a deny with destination 'all' can be skipped for VIP traffic. The fix is match-vip on the deny policy; it's enabled by default on new deny policies but often turned off, and it can't be used on accept policies. Or you use a VIP with a source filter in a deny policy. Then I'd prove it with logs."
    best_way: "VIP policies jump the queue. match-vip puts the deny back in front."
    target: "0:45"
  - id: M4.03.i4
    stage: technical
    question: Explain the FortiGate IP pool types and when you'd use each.
    testing: Breadth plus a use case per type
    framework: "Type → behaviour → use case"
    model_answer: |
      "There are four. Overload is PAT across one or more IPs, about 60,416 ports per IP per destination service: normal internet access. One-to-one gives each inside host its own outside IP with no port translation: a few hosts that need a stable identity. Fixed port range gives each inside IP a known port range, so you can trace IP and port back to a user without session logs. Port block allocation hands out blocks of ports per user, which cuts logging in large guest or carrier networks."
    best_way: "Overload for everyone, one-to-one for the few, fixed port range for traceability, PBA for scale."
    target: "1:00"
  - id: M4.03.i5
    stage: technical
    question: How would you publish an internal server so both internet and office users can use the same URL?
    testing: VIP plus hairpin understanding
    framework: "VIP → policies → hairpin or split DNS → test"
    model_answer: |
      "A VIP maps the public IP and port to the server, used in an accept policy from the WAN with IPS on it. For office users using the same public name, I'd either set up hairpin NAT, which in FortiOS means a DNAT policy with the VIP from the inside plus SNAT so replies come back through the FortiGate, or split DNS so they resolve the private IP. I prefer split DNS when they control DNS, because it's simpler and avoids hairpinning, and I'd test both paths in acceptance."
    best_way: "VIP for the world, hairpin or split DNS for the office, a test case for each."
    target: "1:00"
  - id: M4.03.i6
    stage: technical
    question: How do you troubleshoot 'the new firewall rule doesn't work'?
    testing: Method
    framework: "Facts → debug flow → compare → fix → verify"
    model_answer: |
      "I get the exact flow first: source, destination, port and time. Then I run debug flow filtered on that address. It tells me the route it chose, which policy matched, or 'policy 0', the implicit deny. Most of the time the outgoing interface isn't what the rule expects because of routing, or a broader rule above it matches first, or for published servers it's VIP priority and match-vip. I fix the specific cause, retest with debug flow, and show the customer the hit in the logs."
    best_way: "Get the 5-tuple, run debug flow, and let FortiGate tell you which rule it picked and why."
    target: "1:00"

field_reports:
  - id: M4.03.fr1
    title: Identity is the cheapest control you're not using
    body: |
      IBM's 2026 report found **92 %** of organisations with an AI-related breach lacked proper AI access controls, even though identity and access management is one of the most effective cost reducers overall. Policies that use users and groups, not only IP addresses, are how a FortiGate turns that into practice.
    source: IBM Cost of a Data Breach Report 2026, Key findings
  - id: M4.03.fr2
    title: Patching is slow, so the firewall buys time
    body: |
      Only **26 %** of CISA KEV vulnerabilities were fully remediated in 2025, with a median of **43 days** to fix (DBIR 2026). For every VIP, IPS and virtual patching on the policy cover that gap until the server owner patches.
    source: Verizon 2026 DBIR, Key topics and findings
