        edit 2
        set name POS-DNS
        set srcintf POS
        set dstintf wan
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service DNS
        set nat enable
        next
        edit 3
        set name Staff-Web
        set srcintf STAFF
        set dstintf wan
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service HTTP HTTPS DNS
