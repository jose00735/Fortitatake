        set allowaccess ping
        next
        end
        config system dns
        set primary 8.8.8.8
        end
        config router static
        edit 1
        set gateway 181.49.10.1
        set device wan
        next
        end
        config system dhcp server
        edit 10
        set interface STAFF
        set default-gateway 10.40.10.1
        set netmask 255.255.255.0
        set dns-service default
        config ip-range
        edit 1
        set start-ip 10.40.10.100
        set end-ip 10.40.10.199
        next
        end
        next
        edit 20
        set interface POS
        set default-gateway 10.40.20.1
        set netmask 255.255.255.0
        set dns-service default
        config ip-range
        edit 1
        set start-ip 10.40.20.100
        set end-ip 10.40.20.199
        next
        end
        next
        edit 30
        set interface GUEST
        set default-gateway 10.40.30.1
        set netmask 255.255.255.0
        set dns-service default
        config ip-range
        edit 1
        set start-ip 10.40.30.100
        set end-ip 10.40.30.199
        next
        end
        next
        end
        config firewall address
        edit PAGOS-API
