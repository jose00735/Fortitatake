      services: [tcp/389, tcp/636, udp/1812, udp/1813, tcp/8000, tcp/445, udp/53, tcp/88]
      directory:
        domain: andes.local
        base: DC=andes,DC=local
        ldap:
          ports: [389, 636]
          cert_name: dc01.andes.local
          require_tls: false
          bind: {dn: "CN=svc-fortigate,OU=Service Accounts,DC=andes,DC=local", pass: "Sv-FGT.2026!"}
        radius: {secret: "NPS-Andes-77", clients: [10.20.40.1], groups: true}
        fsso:
          port: 8000
          password: "FSSO-Andes!"
          groups: [Finance, Staff, Contractors]
          logons:
            - {user: jperez, ip: 10.20.10.60, ws: FIN-PC-JPEREZ}
            - {user: mrojas, ip: 10.20.10.50, ws: HQ-PC-MROJAS}
        users:
          - {sam: jperez, cn: Juan Perez, ou: "OU=Bogota,OU=Staff,DC=andes,DC=local", pass: "Andes.Fin26", groups: [Finance, Staff, VPN-Users]}
          - {sam: mrojas, cn: Maria Rojas, ou: "OU=Bogota,OU=Staff,DC=andes,DC=local", pass: "Andes.Ops26", groups: [Staff]}
          - {sam: lgomez, cn: Luis Gomez, ou: "OU=Contractors,DC=andes,DC=local", pass: "Contr4t1sta!", groups: [Contractors]}
          - {sam: ccastro, cn: Carlos Castro, ou: "OU=Bogota,OU=Staff,DC=andes,DC=local", pass: "Old.Pass19", groups: [Finance, Staff], disabled: true}
          - {sam: svc-fortigate, cn: svc-fortigate, ou: "OU=Service Accounts,DC=andes,DC=local", pass: "Sv-FGT.2026!", groups: []}
