# Reusable topologies for FortiTatake labs. A lab uses one with `topology: {use: <name>}` and overrides devices.
# Canvas is 960 x 560. "seg:<id>" positions draw a switch for segments with more than two members.

# ---------------------------------------------------------------------------
# Clínica San Rafael, Santa Marta: one FortiGate-60F, a staff LAN, a DMZ portal, one ISP.
clinic:
  title: Clínica San Rafael · Santa Marta
  devices:
    - id: FGT-SR
      kind: fortigate
      model: FortiGate-60F
      hostname: FGT-SR
      serial: FGT60FTK23051842
      ports: [{name: wan1, role: wan}, {name: wan2, role: wan}, {name: internal, role: lan}, {name: dmz, role: dmz}]
    - {id: RECEPCION, kind: host, os: windows, nic: {ip: dhcp}}
    - {id: CONSULTORIO, kind: host, os: windows, nic: {ip: dhcp}}
    - {id: ADMIN-PC, kind: host, os: windows, nic: {ip: 10.10.10.10/24, gw: 10.10.10.1, dns: [10.10.10.1]}}
    - {id: NAS-01, kind: server, os: linux, nic: {ip: 10.10.10.50/24, gw: 10.10.10.1, dns: [8.8.8.8]}, services: [udp/69, tcp/445, tcp/22]}
    - {id: WEB-CITAS, kind: server, os: linux, nic: {ip: 192.168.50.10/24, gw: 192.168.50.1}, services: [tcp/80, tcp/443, tcp/22]}
    - id: ISP-CLARO
      kind: router
      label: Claro (ISP)
      ifaces: [{name: ge0, ip: 203.0.113.1/28}, {name: inet0, ip: 198.51.100.2/30}]
      routes: [{dst: 0.0.0.0/0, dev: internet}]
    - id: ISP-TIGO
      kind: router
      label: Tigo (home ISP)
      ifaces: [{name: lan0, ip: 100.25.7.1/24}, {name: inet0, ip: 198.51.100.6/30}]
      routes: [{dst: 0.0.0.0/0, dev: internet}]
    - {id: HOME-PC, kind: host, os: windows, hostname: PACIENTE, nic: {ip: 100.25.7.9/24, gw: 100.25.7.1, dns: [8.8.8.8]}}
    - id: INTERNET
      kind: cloud
      hosts:
        - {name: dns.google, ip: 8.8.8.8, services: [udp/53]}
        - {name: one.one.one.one, ip: 1.1.1.1, services: [udp/53]}
        - {name: www.fortinet.com, ip: 23.32.10.5, services: [tcp/80, tcp/443]}
        - {name: www.google.com, ip: 142.250.78.4, services: [tcp/80, tcp/443]}
        - {name: update.microsoft.com, ip: 13.107.4.50, services: [tcp/80, tcp/443]}
        - {name: soporte.historiaclinica.co, ip: 45.60.12.7, services: [tcp/443, tcp/8443]}
        - {name: rdp.example.net, ip: 52.10.20.30, services: [tcp/3389, tcp/443]}
        - {name: ftp.example.net, ip: 52.10.20.31, services: [tcp/21]}
  dns:
    citas.clinicasanrafael.co: 203.0.113.2
  segments:
    - {id: wan, members: ["FGT-SR:wan1", "ISP-CLARO:ge0"]}
    - {id: lan, label: LAN 10.10.10.0/24, members: ["FGT-SR:internal", RECEPCION, CONSULTORIO, ADMIN-PC, NAS-01]}
    - {id: dmz, members: ["FGT-SR:dmz", WEB-CITAS]}
    - {id: up1, members: ["ISP-CLARO:inet0", INTERNET]}
    - {id: up2, members: ["ISP-TIGO:inet0", INTERNET]}
    - {id: home, members: ["ISP-TIGO:lan0", HOME-PC]}
  layout:
    INTERNET: [480, 70]
    ISP-CLARO: [300, 158]
    ISP-TIGO: [700, 158]
    HOME-PC: [860, 300]
    FGT-SR: [300, 295]
    seg:lan: [250, 425]
    RECEPCION: [70, 500]
    CONSULTORIO: [190, 500]
    ADMIN-PC: [310, 500]
    NAS-01: [430, 500]
    WEB-CITAS: [560, 400]

# The same clinic, fully working: what an existing customer looks like on day 30.
clinic-live:
  extends: clinic
  devices:
    FGT-SR:
      config: |
        config system interface
        edit wan1
        set ip 203.0.113.2/28
        set allowaccess ping
        set alias "Claro"
        next
        edit internal
        set ip 10.10.10.1/24
        set allowaccess ping https ssh
        set alias "LAN-Staff"
        next
        edit dmz
        set ip 192.168.50.1/24
        set allowaccess ping
        set alias "DMZ"
        next
        end
        config system dns
        set primary 8.8.8.8
        set secondary 1.1.1.1
        end
        config system dhcp server
        edit 1
        set interface internal
        set default-gateway 10.10.10.1
        set netmask 255.255.255.0
        set dns-service default
        config ip-range
        edit 1
        set start-ip 10.10.10.100
        set end-ip 10.10.10.199
        next
        end
        next
        end
        config router static
        edit 1
        set gateway 203.0.113.1
        set device wan1
        set comment "Default to Claro"
        next
        end
        config firewall address
        edit LAN-Staff
        set subnet 10.10.10.0/24
        next
        edit WEB-CITAS
        set subnet 192.168.50.10/32
        next
        end
        config firewall vip
        edit VIP-CITAS-443
        set extip 203.0.113.2
        set mappedip 192.168.50.10
        set extintf wan1
        set portforward enable
        set extport 443
        set mappedport 443
        next
        end
        config firewall policy
        edit 1
        set name "Staff-Internet"
        set srcintf internal
        set dstintf wan1
        set srcaddr LAN-Staff
        set dstaddr all
        set action accept
        set schedule always
        set service ALL
        set nat enable
        next
        edit 2
        set name "Citas-Publish"
        set srcintf wan1
        set dstintf dmz
        set srcaddr all
        set dstaddr VIP-CITAS-443
        set action accept
        set schedule always
        set service HTTPS
        next
        edit 3
        set name "Staff-to-Portal"
        set srcintf internal
        set dstintf dmz
        set srcaddr LAN-Staff
        set dstaddr WEB-CITAS
        set action accept
        set schedule always
        set service HTTPS SSH
        next
        end

# ---------------------------------------------------------------------------
# Tiendas Macondo, Barranquilla store: a FortiGate-40F, one trunk to a switch with three VLANs.
retail:
  title: Tiendas Macondo · Barranquilla
  devices:
    - id: FGT-MAC
      kind: fortigate
      model: FortiGate-40F
      hostname: FGT-MACONDO
      serial: FGT40FTK22094417
      ports: [{name: wan, role: wan}, {name: lan1, role: lan}, {name: lan2, role: lan}, {name: lan3, role: lan}]
    - {id: STAFF-PC, kind: host, os: windows, nic: {ip: dhcp}}
    - {id: POS-01, kind: host, os: windows, hostname: POS-01, nic: {ip: dhcp}}
    - {id: POS-02, kind: host, os: windows, hostname: POS-02, nic: {ip: dhcp}}
    - {id: GUEST-PHONE, kind: host, os: linux, hostname: guest-phone, nic: {ip: dhcp}}
    - {id: CCTV-NVR, kind: server, os: linux, nic: {ip: 10.40.40.20/24, gw: 10.40.40.1}, services: [tcp/443, tcp/554]}
    - id: ISP-TIGO
      kind: router
      label: Tigo Business (ISP)
      ifaces: [{name: ge0, ip: 181.49.10.1/29}, {name: inet0, ip: 198.51.100.10/30}]
      routes: [{dst: 0.0.0.0/0, dev: internet}]
    - id: INTERNET
      kind: cloud
      hosts:
        - {name: dns.google, ip: 8.8.8.8, services: [udp/53]}
        - {name: api.pagos.co, ip: 190.85.33.10, services: [tcp/443]}
        - {name: inventario.macondo.co, ip: 190.85.40.22, services: [tcp/443]}
        - {name: www.google.com, ip: 142.250.78.4, services: [tcp/80, tcp/443]}
        - {name: www.youtube.com, ip: 142.250.78.14, services: [tcp/443]}
        - {name: torrent.example.org, ip: 91.200.12.4, services: [tcp/6881, tcp/443]}
  segments:
    - {id: wan, members: ["FGT-MAC:wan", "ISP-TIGO:ge0"]}
    - {id: v10, label: VLAN 10 Staff, members: [{at: "FGT-MAC:lan1", vlan: 10}, STAFF-PC]}
    - {id: v20, label: VLAN 20 POS, members: [{at: "FGT-MAC:lan1", vlan: 20}, POS-01, POS-02]}
    - {id: v30, label: VLAN 30 Guest, members: [{at: "FGT-MAC:lan1", vlan: 30}, GUEST-PHONE]}
    - {id: cctv, members: ["FGT-MAC:lan2", CCTV-NVR]}
    - {id: up, members: ["ISP-TIGO:inet0", INTERNET]}
  layout:
    INTERNET: [480, 70]
    ISP-TIGO: [480, 175]
    FGT-MAC: [480, 285]
    seg:v10: [200, 420]
    seg:v20: [440, 420]
    seg:v30: [700, 420]
    STAFF-PC: [200, 500]
    POS-01: [380, 500]
    POS-02: [500, 500]
    GUEST-PHONE: [680, 500]
    CCTV-NVR: [840, 330]

# ---------------------------------------------------------------------------
# Andes Logistics: HQ Bogotá and the Cali branch, joined by an MPLS link, each with its own ISP.
andes:
  title: Andes Logistics · Bogotá HQ and Cali branch
  devices:
    - id: FGT-BOG
      kind: fortigate
      model: FortiGate-100F
      hostname: FGT-BOG-HQ
      ports: [{name: port1, role: wan}, {name: port2, role: lan}, {name: port3, role: wan}, {name: port4, role: dmz}]
      config: |
        config system interface
        edit port1
        set ip 200.31.20.2/29
        set allowaccess ping
        set alias "ISP-ETB"
        next
        edit port2
        set ip 10.20.10.1/24
        set allowaccess ping https ssh
        set alias "HQ-LAN"
        next
        edit port3
        set ip 10.255.0.2/30
        set allowaccess ping
        set alias "MPLS"
        next
        end
        config router static
        edit 1
        set gateway 200.31.20.1
        set device port1
        next
        end
    - id: FGT-CLO
      kind: fortigate
      model: FortiGate-60F
      hostname: FGT-CLO-BR
      ports: [{name: wan1, role: wan}, {name: wan2, role: wan}, {name: internal, role: lan}, {name: dmz, role: dmz}]
      config: |
        config system interface
        edit wan1
        set ip 190.14.8.2/29
        set allowaccess ping
        set alias "ISP-Emcali"
        next
        edit wan2
        set ip 10.255.0.6/30
        set allowaccess ping
        set alias "MPLS"
        next
        edit internal
        set ip 10.30.0.1/24
        set allowaccess ping https ssh
        next
        end
        config router static
        edit 1
        set gateway 190.14.8.1
        set device wan1
        next
        end
    - {id: ERP-SRV, kind: server, os: linux, nic: {ip: 10.20.10.20/24, gw: 10.20.10.1}, services: [tcp/443, tcp/1433, tcp/22]}
    - {id: HQ-PC, kind: host, os: windows, nic: {ip: 10.20.10.50/24, gw: 10.20.10.1, dns: [8.8.8.8]}}
    - {id: CLO-PC, kind: host, os: windows, nic: {ip: 10.30.0.20/24, gw: 10.30.0.1, dns: [8.8.8.8]}}
    - id: MPLS-PE
      kind: router
      label: Carrier MPLS
      drop_private: false
      ifaces: [{name: bog, ip: 10.255.0.1/30}, {name: clo, ip: 10.255.0.5/30}]
      routes: [{dst: 10.20.0.0/16, via: 10.255.0.2}, {dst: 10.30.0.0/16, via: 10.255.0.6}]
    - id: ISP-ETB
      kind: router
      label: ETB (HQ ISP)
      ifaces: [{name: ge0, ip: 200.31.20.1/29}, {name: inet0, ip: 198.51.100.14/30}]
      routes: [{dst: 0.0.0.0/0, dev: internet}]
    - id: ISP-EMCALI
      kind: router
      label: Emcali (branch ISP)
      ifaces: [{name: ge0, ip: 190.14.8.1/29}, {name: inet0, ip: 198.51.100.18/30}]
      routes: [{dst: 0.0.0.0/0, dev: internet}]
    - id: INTERNET
      kind: cloud
      hosts:
        - {name: dns.google, ip: 8.8.8.8, services: [udp/53]}
        - {name: www.google.com, ip: 142.250.78.4, services: [tcp/80, tcp/443]}
        - {name: login.microsoftonline.com, ip: 20.190.160.1, services: [tcp/443]}
  segments:
    - {id: bog-wan, members: ["FGT-BOG:port1", "ISP-ETB:ge0"]}
    - {id: bog-lan, label: HQ LAN 10.20.10.0/24, members: ["FGT-BOG:port2", ERP-SRV, HQ-PC]}
    - {id: bog-mpls, members: ["FGT-BOG:port3", "MPLS-PE:bog"]}
    - {id: clo-mpls, members: ["FGT-CLO:wan2", "MPLS-PE:clo"]}
    - {id: clo-wan, members: ["FGT-CLO:wan1", "ISP-EMCALI:ge0"]}
    - {id: clo-lan, members: ["FGT-CLO:internal", CLO-PC]}
    - {id: up1, members: ["ISP-ETB:inet0", INTERNET]}
    - {id: up2, members: ["ISP-EMCALI:inet0", INTERNET]}
  layout:
    INTERNET: [480, 60]
    ISP-ETB: [220, 160]
    ISP-EMCALI: [740, 160]
    FGT-BOG: [220, 300]
    FGT-CLO: [740, 300]
    MPLS-PE: [480, 300]
    seg:bog-lan: [220, 430]
    ERP-SRV: [140, 505]
    HQ-PC: [300, 505]
    CLO-PC: [740, 480]

# The Macondo store with VLANs, DHCP and policies in place (the state after F1.07).
retail-live:
  extends: retail
  devices:
    FGT-MAC:
      config: |
        config system interface
        edit wan
        set ip 181.49.10.2/29
        set allowaccess ping
        next
        edit STAFF
        set vdom root
        set type vlan
        set interface lan1
        set vlanid 10
        set ip 10.40.10.1/24
        set allowaccess ping https ssh
        next
        edit POS
        set vdom root
        set type vlan
        set interface lan1
        set vlanid 20
        set ip 10.40.20.1/24
        set allowaccess ping
        next
        edit GUEST
        set vdom root
        set type vlan
        set interface lan1
        set vlanid 30
        set ip 10.40.30.1/24
        set allowaccess ping
        next
        end
        config system dns
        set primary 8.8.8.8
        end
        config router static
        edit 1
        set gateway 181.49.10.1
        set device wan
        next
        end
        config system dhcp server
        edit 10
        set interface STAFF
        set default-gateway 10.40.10.1
        set netmask 255.255.255.0
        set dns-service default
        config ip-range
        edit 1
        set start-ip 10.40.10.100
        set end-ip 10.40.10.199
        next
        end
        next
        edit 20
        set interface POS
        set default-gateway 10.40.20.1
        set netmask 255.255.255.0
        set dns-service default
        config ip-range
        edit 1
        set start-ip 10.40.20.100
        set end-ip 10.40.20.199
        next
        end
        next
        edit 30
        set interface GUEST
        set default-gateway 10.40.30.1
        set netmask 255.255.255.0
        set dns-service default
        config ip-range
        edit 1
        set start-ip 10.40.30.100
        set end-ip 10.40.30.199
        next
        end
        next
        end
        config firewall address
        edit PAGOS-API
        set type fqdn
        set fqdn api.pagos.co
        next
        end
        config firewall policy
        edit 1
        set name POS-to-Pagos
        set srcintf POS
        set dstintf wan
        set srcaddr all
        set dstaddr PAGOS-API
        set action accept
        set schedule always
        set service HTTPS
        set nat enable
        next
        edit 2
        set name POS-DNS
        set srcintf POS
        set dstintf wan
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service DNS
        set nat enable
        next
        edit 3
        set name Staff-Web
        set srcintf STAFF
        set dstintf wan
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service HTTP HTTPS DNS
        set nat enable
        next
        edit 4
        set name Guest-Web
        set srcintf GUEST
        set dstintf wan
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service HTTP HTTPS DNS
        set nat enable
        next
        end
