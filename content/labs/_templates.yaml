# Andes HQ with Active Directory: DC-01 (LDAP/LDAPS, NPS RADIUS, FSSO collector agent) and the ERP
# on a server segment behind port4, two staff PCs on the LAN. Internet and AD policies in place.
andes-id:
  extends: andes
  dns: {dc01.andes.local: 10.20.40.10, erp.andes.local: 10.20.40.20}
  remove_segments: [bog-lan]
  devices:
    ERP-SRV: {nic: {ip: 10.20.40.20/24, gw: 10.20.40.1}, services: [tcp/443, tcp/1433, tcp/22]}
    HQ-PC: {hostname: HQ-PC-MROJAS}
    FGT-BOG:
      config: |
        config system interface
        edit port4
        set ip 10.20.40.1/24
        set allowaccess ping
        set alias "SERVERS"
        next
        end
        config system dns
        set primary 8.8.8.8
        end
        config firewall address
        edit HQ-LAN
        set subnet 10.20.10.0 255.255.255.0
        next
        edit DC-01
        set subnet 10.20.40.10 255.255.255.255
        next
        edit ERP-SRV
        set subnet 10.20.40.20 255.255.255.255
        next
        end
        config firewall policy
        edit 1
        set name "HQ-Internet"
        set srcintf port2
        set dstintf port1
        set srcaddr HQ-LAN
        set dstaddr all
        set action accept
        set schedule always
        set service ALL
        set nat enable
        next
        edit 2
        set name "HQ-to-DC"
        set srcintf port2
        set dstintf port4
        set srcaddr HQ-LAN
        set dstaddr DC-01
        set action accept
        set schedule always
        set service ALL
        next
        end
  add_devices:
    - {id: FIN-PC, kind: host, os: windows, hostname: FIN-PC-JPEREZ, nic: {ip: 10.20.10.60/24, gw: 10.20.10.1, dns: [8.8.8.8]}}
