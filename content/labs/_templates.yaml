# Reusable topologies for FortiTatake labs. A lab uses one with `topology: {use: <name>}` and overrides devices.
# Canvas is 960 x 560. "seg:<id>" positions draw a switch for segments with more than two members.

# ---------------------------------------------------------------------------
# Clínica San Rafael, Santa Marta: one FortiGate-60F, a staff LAN, a DMZ portal, one ISP.
clinic:
  title: Clínica San Rafael · Santa Marta
  devices:
    - id: FGT-SR
      kind: fortigate
      model: FortiGate-60F
      hostname: FGT-SR
      serial: FGT60FTK23051842
      ports: [{name: wan1, role: wan}, {name: wan2, role: wan}, {name: internal, role: lan}, {name: dmz, role: dmz}]
    - {id: RECEPCION, kind: host, os: windows, nic: {ip: dhcp}}
    - {id: CONSULTORIO, kind: host, os: windows, nic: {ip: dhcp}}
    - {id: ADMIN-PC, kind: host, os: windows, nic: {ip: 10.10.10.10/24, gw: 10.10.10.1, dns: [10.10.10.1]}}
    - {id: NAS-01, kind: server, os: linux, nic: {ip: 10.10.10.50/24, gw: 10.10.10.1, dns: [8.8.8.8]}, services: [udp/69, tcp/445, tcp/22]}
    - {id: WEB-CITAS, kind: server, os: linux, nic: {ip: 192.168.50.10/24, gw: 192.168.50.1}, services: [tcp/80, tcp/443, tcp/22]}
    - id: ISP-CLARO
      kind: router
      label: Claro (ISP)
      ifaces: [{name: ge0, ip: 203.0.113.1/28}, {name: inet0, ip: 198.51.100.2/30}]
      routes: [{dst: 0.0.0.0/0, dev: internet}]
    - id: ISP-TIGO
      kind: router
      label: Tigo (home ISP)
      ifaces: [{name: lan0, ip: 100.25.7.1/24}, {name: inet0, ip: 198.51.100.6/30}]
      routes: [{dst: 0.0.0.0/0, dev: internet}]
    - {id: HOME-PC, kind: host, os: windows, hostname: PACIENTE, nic: {ip: 100.25.7.9/24, gw: 100.25.7.1, dns: [8.8.8.8]}}
    - id: INTERNET
      kind: cloud
      hosts:
        - {name: dns.google, ip: 8.8.8.8, services: [udp/53]}
        - {name: one.one.one.one, ip: 1.1.1.1, services: [udp/53]}
        - {name: www.fortinet.com, ip: 23.32.10.5, services: [tcp/80, tcp/443]}
        - {name: www.google.com, ip: 142.250.78.4, services: [tcp/80, tcp/443]}
        - {name: update.microsoft.com, ip: 13.107.4.50, services: [tcp/80, tcp/443]}
        - {name: soporte.historiaclinica.co, ip: 45.60.12.7, services: [tcp/443, tcp/8443]}
        - {name: rdp.example.net, ip: 52.10.20.30, services: [tcp/3389, tcp/443]}
        - {name: ftp.example.net, ip: 52.10.20.31, services: [tcp/21]}
        - {name: www.apuestas-ya.co, ip: 181.78.10.20, services: [tcp/80, tcp/443]}
        - {name: m.apuestas-ya.co, ip: 181.78.10.21, services: [tcp/80, tcp/443]}
        - {name: www.casino-caribe.co, ip: 104.21.5.8, services: [tcp/80, tcp/443]}
        - {name: secure.eicar.org, ip: 89.238.73.97, services: [tcp/80, tcp/443], files: {"/download/eicar.com": eicar, "/download/readme.txt": clean}}
        - {name: www.bancolombia.com, ip: 200.13.200.10, services: [tcp/443], pinned: true}
  dns:
    citas.clinicasanrafael.co: 203.0.113.2
  segments:
    - {id: wan, members: ["FGT-SR:wan1", "ISP-CLARO:ge0"]}
    - {id: lan, label: LAN 10.10.10.0/24, members: ["FGT-SR:internal", RECEPCION, CONSULTORIO, ADMIN-PC, NAS-01]}
    - {id: dmz, members: ["FGT-SR:dmz", WEB-CITAS]}
    - {id: up1, members: ["ISP-CLARO:inet0", INTERNET]}
    - {id: up2, members: ["ISP-TIGO:inet0", INTERNET]}
    - {id: home, members: ["ISP-TIGO:lan0", HOME-PC]}
  layout:
    INTERNET: [480, 70]
    ISP-CLARO: [300, 158]
    ISP-TIGO: [700, 158]
    HOME-PC: [860, 300]
    FGT-SR: [300, 295]
    seg:lan: [250, 425]
    RECEPCION: [70, 500]
    CONSULTORIO: [190, 500]
    ADMIN-PC: [310, 500]
    NAS-01: [430, 500]
    WEB-CITAS: [560, 400]

# The same clinic, fully working: what an existing customer looks like on day 30.
clinic-live:
  extends: clinic
  devices:
    FGT-SR:
      config: |
        config system interface
        edit wan1
        set ip 203.0.113.2/28
        set allowaccess ping
        set alias "Claro"
        next
        edit internal
        set ip 10.10.10.1/24
        set allowaccess ping https ssh
        set alias "LAN-Staff"
        next
        edit dmz
        set ip 192.168.50.1/24
        set allowaccess ping
        set alias "DMZ"
        next
        end
        config system dns
        set primary 8.8.8.8
        set secondary 1.1.1.1
        end
        config system dhcp server
        edit 1
        set interface internal
        set default-gateway 10.10.10.1
        set netmask 255.255.255.0
        set dns-service default
        config ip-range
        edit 1
        set start-ip 10.10.10.100
        set end-ip 10.10.10.199
        next
        end
        next
        end
        config router static
        edit 1
        set gateway 203.0.113.1
        set device wan1
        set comment "Default to Claro"
        next
        end
        config firewall address
        edit LAN-Staff
        set subnet 10.10.10.0/24
        next
        edit WEB-CITAS
        set subnet 192.168.50.10/32
        next
        end
        config firewall vip
        edit VIP-CITAS-443
        set extip 203.0.113.2
        set mappedip 192.168.50.10
        set extintf wan1
        set portforward enable
        set extport 443
        set mappedport 443
        next
        end
        config firewall policy
        edit 1
        set name "Staff-Internet"
        set srcintf internal
        set dstintf wan1
        set srcaddr LAN-Staff
        set dstaddr all
        set action accept
        set schedule always
        set service ALL
        set nat enable
        next
        edit 2
        set name "Citas-Publish"
        set srcintf wan1
        set dstintf dmz
        set srcaddr all
        set dstaddr VIP-CITAS-443
        set action accept
        set schedule always
        set service HTTPS
        next
        edit 3
        set name "Staff-to-Portal"
        set srcintf internal
        set dstintf dmz
        set srcaddr LAN-Staff
        set dstaddr WEB-CITAS
        set action accept
        set schedule always
        set service HTTPS SSH
        next
        end

