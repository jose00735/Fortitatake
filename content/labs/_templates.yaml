# Bogotá ↔ Cali tunnel working (the state after V2.01).
andes-vpn-live:
  extends: andes-vpn
  devices:
    FGT-BOG:
      config: |
        config vpn ipsec phase1-interface
        edit VPN-CLO
        set interface port1
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes256-sha256
        set dhgrp 20
        set remote-gw 190.14.8.2
        set psksecret An3s-S2S-2026#
        next
        end
        config vpn ipsec phase2-interface
        edit VPN-CLO-P2
        set phase1name VPN-CLO
        set proposal aes256-sha256
        set dhgrp 20
        set src-subnet 10.20.0.0/16
        set dst-subnet 10.30.0.0/24
        set auto-negotiate enable
        next
        end
        config router static
        edit 2
        set dst 10.30.0.0/24
        set device VPN-CLO
        next
        edit 3
        set dst 10.30.0.0/24
        set blackhole enable
        set distance 254
        next
        end
        config firewall policy
        edit 1
        set name BOG-to-CLO
        set srcintf port2
        set dstintf VPN-CLO
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service ALL
        next
        edit 2
        set name CLO-to-BOG
        set srcintf VPN-CLO
        set dstintf port2
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service ALL
        next
        edit 3
        set name HQ-Internet
        set srcintf port2
        set dstintf port1
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service ALL
        set nat enable
        next
        end
    FGT-CLO:
      config: |
        config vpn ipsec phase1-interface
        edit VPN-BOG
        set interface wan1
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes256-sha256
        set dhgrp 20
        set remote-gw 200.31.20.2
        set psksecret An3s-S2S-2026#
        next
        end
        config vpn ipsec phase2-interface
        edit VPN-BOG-P2
        set phase1name VPN-BOG
        set proposal aes256-sha256
        set dhgrp 20
        set src-subnet 10.30.0.0/24
        set dst-subnet 10.20.0.0/16
        set auto-negotiate enable
        next
        end
        config router static
        edit 2
        set dst 10.20.0.0/16
        set device VPN-BOG
        next
        edit 3
        set dst 10.20.0.0/16
        set blackhole enable
        set distance 254
        next
        end
        config firewall policy
        edit 1
        set name CLO-to-BOG
        set srcintf internal
        set dstintf VPN-BOG
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service ALL
        next
        edit 2
        set name BOG-to-CLO
        set srcintf VPN-BOG
        set dstintf internal
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service ALL
        next
        edit 3
        set name CLO-Internet
        set srcintf internal
        set dstintf wan1
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service ALL
        set nat enable
        next
        end

# Cali branch with SD-WAN working (the state after S2.01 part b).
sdwan-live:
  extends: sdwan-branch
  devices:
    FGT-CLO:
      config: |
        config system sdwan
        set status enable
        config members
        edit 1
        set interface wan1
        set gateway 190.14.8.1
        next
        edit 2
        set interface wan2
        set gateway 181.52.6.1
        next
        end
        config health-check
        edit HC-DNS
        set server 8.8.8.8
        set members 1 2
        config sla
        edit 1
        set latency-threshold 150
        set jitter-threshold 30
        set packetloss-threshold 2
        next
        end
        next
        end
        end
        config router static
        edit 1
        set sdwan-zone virtual-wan-link
        next
        end
        config firewall policy
        edit 1
        set name LAN-Internet
        set srcintf internal
        set dstintf virtual-wan-link
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service ALL
        set nat enable
        next
        end

