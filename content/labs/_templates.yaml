        set action accept
        set schedule always
        set service HTTPS
        set nat enable
        next
        edit 2
        set name POS-DNS
        set srcintf POS
        set dstintf wan
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service DNS
        set nat enable
        next
        edit 3
