# Andes Logistics: HQ Bogotá and the Cali branch, joined by an MPLS link, each with its own ISP.
andes:
  title: Andes Logistics · Bogotá HQ and Cali branch
  devices:
    - id: FGT-BOG
      kind: fortigate
      model: FortiGate-100F
      hostname: FGT-BOG-HQ
      ports: [{name: port1, role: wan}, {name: port2, role: lan}, {name: port3, role: wan}, {name: port4, role: dmz}]
      config: |
        config system interface
        edit port1
        set ip 200.31.20.2/29
        set allowaccess ping
        set alias "ISP-ETB"
        next
        edit port2
        set ip 10.20.10.1/24
        set allowaccess ping https ssh
        set alias "HQ-LAN"
        next
        edit port3
        set ip 10.255.0.2/30
        set allowaccess ping
        set alias "MPLS"
        next
        end
        config router static
        edit 1
        set gateway 200.31.20.1
        set device port1
        next
        end
    - id: FGT-CLO
      kind: fortigate
      model: FortiGate-60F
      hostname: FGT-CLO-BR
      ports: [{name: wan1, role: wan}, {name: wan2, role: wan}, {name: internal, role: lan}, {name: dmz, role: dmz}]
      config: |
        config system interface
        edit wan1
        set ip 190.14.8.2/29
        set allowaccess ping
        set alias "ISP-Emcali"
        next
        edit wan2
        set ip 10.255.0.6/30
        set allowaccess ping
        set alias "MPLS"
        next
        edit internal
        set ip 10.30.0.1/24
        set allowaccess ping https ssh
        next
        end
        config router static
        edit 1
        set gateway 190.14.8.1
        set device wan1
        next
        end
    - {id: ERP-SRV, kind: server, os: linux, nic: {ip: 10.20.10.20/24, gw: 10.20.10.1}, services: [tcp/443, tcp/1433, tcp/22]}
    - {id: HQ-PC, kind: host, os: windows, nic: {ip: 10.20.10.50/24, gw: 10.20.10.1, dns: [8.8.8.8]}}
    - {id: CLO-PC, kind: host, os: windows, nic: {ip: 10.30.0.20/24, gw: 10.30.0.1, dns: [8.8.8.8]}}
    - id: MPLS-PE
      kind: router
      label: Carrier MPLS
      drop_private: false
      ifaces: [{name: bog, ip: 10.255.0.1/30}, {name: clo, ip: 10.255.0.5/30}]
      routes: [{dst: 10.20.0.0/16, via: 10.255.0.2}, {dst: 10.30.0.0/16, via: 10.255.0.6}]
    - id: ISP-ETB
      kind: router
      label: ETB (HQ ISP)
      ifaces: [{name: ge0, ip: 200.31.20.1/29}, {name: inet0, ip: 198.51.100.14/30}]
      routes: [{dst: 0.0.0.0/0, dev: internet}]
    - id: ISP-EMCALI
      kind: router
      label: Emcali (branch ISP)
      ifaces: [{name: ge0, ip: 190.14.8.1/29}, {name: inet0, ip: 198.51.100.18/30}]
      routes: [{dst: 0.0.0.0/0, dev: internet}]
    - id: INTERNET
      kind: cloud
      hosts:
        - {name: dns.google, ip: 8.8.8.8, services: [udp/53]}
        - {name: www.google.com, ip: 142.250.78.4, services: [tcp/80, tcp/443]}
        - {name: login.microsoftonline.com, ip: 20.190.160.1, services: [tcp/443]}
  segments:
    - {id: bog-wan, members: ["FGT-BOG:port1", "ISP-ETB:ge0"]}
    - {id: bog-lan, label: HQ LAN 10.20.10.0/24, members: ["FGT-BOG:port2", ERP-SRV, HQ-PC]}
    - {id: bog-mpls, members: ["FGT-BOG:port3", "MPLS-PE:bog"]}
    - {id: clo-mpls, members: ["FGT-CLO:wan2", "MPLS-PE:clo"]}
    - {id: clo-wan, members: ["FGT-CLO:wan1", "ISP-EMCALI:ge0"]}
    - {id: clo-lan, members: ["FGT-CLO:internal", CLO-PC]}
    - {id: up1, members: ["ISP-ETB:inet0", INTERNET]}
    - {id: up2, members: ["ISP-EMCALI:inet0", INTERNET]}
  layout:
    INTERNET: [480, 60]
    ISP-ETB: [220, 160]
    ISP-EMCALI: [740, 160]
    FGT-BOG: [220, 300]
    FGT-CLO: [740, 300]
    MPLS-PE: [480, 300]
    seg:bog-lan: [220, 430]
    ERP-SRV: [140, 505]
    HQ-PC: [300, 505]
    CLO-PC: [740, 480]

# The Macondo store with VLANs, DHCP and policies in place (the state after F1.07).
