        next
        edit 30
        set interface GUEST
        set default-gateway 10.40.30.1
        set netmask 255.255.255.0
        set dns-service default
        config ip-range
        edit 1
        set start-ip 10.40.30.100
        set end-ip 10.40.30.199
        next
        end
        next
        end
        config firewall address
