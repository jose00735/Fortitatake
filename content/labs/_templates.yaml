        set dstintf wan
        set srcaddr all
        set dstaddr all
        set action accept
        set schedule always
        set service HTTP HTTPS DNS
        set nat enable
        next
        end

# ---------------------------------------------------------------------------
# Andes Logistics over the Internet: no MPLS, plus a remote worker at home.
andes-vpn:
  extends: andes
  remove_devices: [MPLS-PE]
  remove_segments: [bog-mpls, clo-mpls]
  add_devices:
    - id: ISP-HOME
      kind: router
      label: Movistar Hogar
      ifaces: [{name: lan0, ip: 181.60.4.1/24}, {name: inet0, ip: 198.51.100.22/30}]
      routes: [{dst: 0.0.0.0/0, dev: internet}]
    - id: LAPTOP
      kind: host
      os: windows
      hostname: LAPTOP-JGOMEZ
      nic: {ip: 181.60.4.25/24, gw: 181.60.4.1, dns: [8.8.8.8]}
      vpn: {name: Andes VPN, gw: 200.31.20.2, psk: "Andes-Remote-2026!", ike: 2, user: jgomez, password: "Cl4ve-Segura!", proposal: [aes256-sha256, aes128-sha256], dhgrp: [20, 14]}
  add_segments:
    - {id: home, members: ["ISP-HOME:lan0", LAPTOP]}
    - {id: up3, members: ["ISP-HOME:inet0", INTERNET]}
  layout: {ISP-HOME: [480, 200], LAPTOP: [480, 330]}

