id: O4.01
track: routing
modules: [M2.01, M8.02]
tier: 4
order: 10
kind: ticket
title: "\"The warehouse lost everything after the core switch swap\""
customer: Andes Logistics
par: 25
skills: [OSPF neighbor states, MTU, ExStart]
brief: |
  **Ticket 8120, priority 1.** Last night the integrator replaced CORE-SW with a new model "with the same config".
  This morning the warehouse has no Internet and HQ can't see the cameras. The integrator says OSPF "is up, I can see
  the FortiGate as a neighbor".

  Fix it on the FortiGate side: the switch's settings are locked until their next maintenance window.
topology:
  use: andes-ospf
  devices:
    CORE-SW:
      ospf:
        router_id: 10.20.255.2
        interfaces:
          - {name: uplink, area: 0.0.0.0, cost: 10, hello: 10, dead: 40, mtu: 9000}
          - {name: vlan60, area: 0.0.0.0, passive: true}
          - {name: vlan70, area: 0.0.0.0, passive: true}
    FGT-BOG:
      config: |
        config router ospf
        set router-id 10.20.255.1
        set default-information-originate enable
        config area
        edit 0.0.0.0
        next
        end
        config network
        edit 1
        set prefix 10.20.50.0 255.255.255.248
        set area 0.0.0.0
        next
        edit 2
        set prefix 10.20.10.0 255.255.255.0
        set area 0.0.0.0
        next
        end
        set passive-interface port2
        end
        config firewall policy
        edit 4
        set name "Campus-Internet"
        set srcintf port5
        set dstintf port1
        set srcaddr CAMPUS
        set dstaddr all
        set action accept
        set schedule always
        set service ALL
        set nat enable
        next
        end
tasks:
  - "Look at the neighbor state on FGT-BOG and find out why it's stuck."
  - "Restore routing without touching CORE-SW."
  - "Answer the root cause."
checks:
  - text: "FGT-BOG and CORE-SW are Full"
    ospf: {dev: FGT-BOG, neighbor: CORE-SW}
  - text: "The warehouse browses again"
    probe: {from: WH-PC, to: www.google.com, proto: tcp, port: 443}
  - text: "Root cause"
    answer: {accept: ["~mtu|jumbo|9000|exstart"], sample: "The new switch uses MTU 9000 on the uplink; FortiGate port5 is 1500, so the adjacency is stuck in ExStart", hint: "A neighbor that exists but never reaches Full: which state, and what is compared in that state?", why: "OSPF compares the interface MTU in the database description exchange. 9000 vs 1500 leaves the adjacency in ExStart: hellos work (so the integrator 'sees' the neighbor) but no routes are exchanged."}
hints:
  - "`get router info ospf neighbor` shows the state; `diagnose ip router ospf all enable` + `diagnose debug enable` tells you why."
  - "Match the MTU or tell OSPF to ignore it on port5: `config ospf-interface` / `edit CORE` / `set interface port5` / `set mtu-ignore enable`. Plan the real fix (same MTU both sides) for the next window."
solution:
  FGT-BOG: |
    get router info ospf neighbor
    config router ospf
    config ospf-interface
    edit CORE
    set interface port5
    set mtu-ignore enable
    next
    end
    end
explain: |
  ExStart/Exchange stuck is the classic MTU symptom: the neighbors see each other's hellos (so they're "neighbors"),
  but the database description packets are refused. `mtu-ignore` is the quick fix; matching MTUs is the right one,
  because a 9000-byte frame towards a 1500-byte port still gets dropped.
