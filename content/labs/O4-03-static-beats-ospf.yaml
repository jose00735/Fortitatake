id: O4.03
track: routing
modules: [M1.04, M4.05, M8.02]
tier: 4
order: 12
kind: ticket
title: "\"OSPF is Full but HQ still can't see the cameras\""
customer: Andes Logistics
par: 20
skills: [administrative distance, route selection, routing-table database]
brief: |
  **Ticket 8151, priority 2.** The camera VLAN (10.20.70.0/24) moved behind CORE-SW last month, when OSPF went live.
  OSPF is Full and the warehouse works, but HQ still can't open the camera recorder (10.20.70.10). "OSPF must be
  broken for that VLAN," says the customer.
topology:
  use: andes-ospf
  devices:
    FGT-BOG:
      config: |
        config router ospf
        set router-id 10.20.255.1
        set default-information-originate enable
        config area
        edit 0.0.0.0
        next
        end
        config network
        edit 1
        set prefix 10.20.50.0 255.255.255.248
        set area 0.0.0.0
        next
        edit 2
        set prefix 10.20.10.0 255.255.255.0
        set area 0.0.0.0
        next
        end
        set passive-interface port2
        end
        config firewall policy
        edit 4
        set name "Campus-Internet"
        set srcintf port5
        set dstintf port1
        set srcaddr CAMPUS
        set dstaddr all
        set action accept
        set schedule always
        set service ALL
        set nat enable
        next
        end
        config router static
        edit 5
        set dst 10.20.70.0 255.255.255.0
        set gateway 10.20.10.254
        set device port2
        set comment "old camera switch"
        next
        end
tasks:
  - "Compare `get router info routing-table all` with `get router info routing-table database`."
  - "Fix it so the camera VLAN follows OSPF."
  - "Answer the root cause."
checks:
  - text: "FGT-BOG reaches the camera VLAN through OSPF"
    route: {dev: FGT-BOG, dst: 10.20.70.0/24, type: O}
  - text: "HQ-PC opens the recorder"
    probe: {from: HQ-PC, to: 10.20.70.10, proto: tcp, port: 443}
  - text: "Root cause"
    answer: {accept: ["~static|distance|old|leftover"], sample: "A leftover static route to 10.20.70.0/24 (distance 10) wins over the OSPF route (110)", hint: "Two sources know 10.20.70.0/24. Which one wins, and why?", why: "Same prefix length, so administrative distance decides: static 10 beats OSPF 110. The old static route to the retired camera switch still points at 10.20.10.254, which no longer exists."}
hints:
  - "`get router info routing-table database` lists both routes; the one marked active has the lower distance."
  - "`config router static` / `delete 5`."
solution:
  FGT-BOG: |
    get router info routing-table database
    config router static
    delete 5
    end
explain: |
  The OSPF route was there all along, just not active: the database view shows it. Migrations to dynamic routing
  should include a clean-up of the static routes they replace, or set them as floating backups with a distance above
  110.
