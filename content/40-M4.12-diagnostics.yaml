  - { id: M4.12.c03, unit: M4.12.u1, tier: 1, front: "Command for total session count?", back: "`get system session status`." }
  - { id: M4.12.c04, unit: M4.12.u1, tier: 2, front: "Command for firmware and FortiGuard engine versions?", back: "`get system status`." }
