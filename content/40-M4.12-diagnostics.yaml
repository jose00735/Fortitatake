  - { id: M4.12.c11, unit: M4.12.u3, tier: 2, front: "Debug flow filter options?", back: "addr, saddr, daddr, port, sport, dport, proto, vd, negate, clear (filter6 for IPv6)." }
  - { id: M4.12.c12, unit: M4.12.u3, tier: 2, front: "Meaning: `allocate a new session-00000e90`?", back: "First packet of a flow: FortiOS created a new session." }
  - { id: M4.12.c13, unit: M4.12.u3, tier: 2, front: "Meaning: `Allowed by Policy-3: SNAT`?", back: "Policy ID 3 matched and source NAT is applied." }
  - { id: M4.12.c14, unit: M4.12.u3, tier: 2, front: "Meaning: `Denied by forward policy check (policy 0)`?", back: "No configured policy matched; the implicit deny dropped it." }
