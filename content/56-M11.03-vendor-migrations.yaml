quiz:
  - id: M11.03.q01
    type: output
    tier: 3
    format: first-step
    output: |
      interface GigabitEthernet0/1
       nameif inside
       security-level 100
      interface GigabitEthernet0/2
       nameif dmz
       security-level 50
      interface GigabitEthernet0/0
       nameif outside
       security-level 0
      access-group OUTSIDE_IN in interface outside
      ! no access-group on inside or dmz
    stem: "The converter produced FortiGate policies from the ASA ACLs. What do you check first before the cutover?"
    options:
      - {id: a, text: "Add policies for inside→dmz, inside→outside and dmz→outside that the levels allowed", correct: true}
      - {id: b, text: "Convert OUTSIDE_IN so that it uses VIP objects as the destinations of each policy", trap: near-miss, why_wrong: "Needed in policy NAT mode, but the converter handles explicit ACLs; the missing flows aren't in any ACL."}
      - {id: c, text: "Map the security levels to FortiGate zones with intra-zone traffic set to allow", trap: misconception, why_wrong: "Zones don't carry levels; the implicit flows run between different interfaces."}
      - {id: d, text: "Check that the converter kept the OUTSIDE_IN rule order when it built the port1 policies", trap: near-miss, why_wrong: "Worth a look, but order of explicit rules is what converters handle; the missing level-based flows aren't in any ACL."}
    explanation: "With no ACL on inside and dmz, the ASA allowed traffic to lower levels. That behaviour isn't in the config, so the converter can't produce it."
  - id: M11.03.q02
    type: single
    tier: 3
    stem: "After moving from Palo Alto, two servers in the same VLAN behind one FortiGate interface can't talk through the firewall. Why?"
    options:
      - {id: a, text: "PAN-OS allowed intrazone traffic by default; the FortiGate needs a same-interface policy", correct: true}
      - {id: b, text: "The converter dropped the App-ID rule between them, so add an application control profile", trap: near-miss, why_wrong: "App-ID conversion matters, but this traffic was allowed by a default rule, not a written one."}
      - {id: c, text: "FortiGate blocks intra-VLAN traffic in hardware unless the switch-controller is turned off", trap: misconception, why_wrong: "There's no such default; the implicit deny covers same-interface flows."}
      - {id: d, text: "The servers' default gateway still points at the old Palo Alto address after cutover", trap: near-miss, why_wrong: "Possible in a cutover, but then they'd lose all routed traffic, not only each other."}
    explanation: "PAN-OS intrazone-default allows; FortiGate's implicit deny applies even when ingress and egress are the same interface."
  - id: M11.03.q03
    type: single
    tier: 3
    stem: "The customer's FortiGate runs central NAT. How should a converted rule for a published web server reference the server?"
    options:
      - {id: a, text: "Use the server's real internal address as destination; the VIP does the DNAT", correct: true}
      - {id: b, text: "Use the VIP object as the destination, as you would in a policy NAT mode design", trap: near-miss, why_wrong: "That's policy NAT mode; with central NAT the policy matches the mapped address."}
      - {id: c, text: "Use the public address as destination and enable NAT on the firewall policy", trap: misconception, why_wrong: "Policy NAT settings are absent in central NAT, and DNAT happens before the lookup."}
      - {id: d, text: "Use an address group with both public and private IPs to cover both modes", trap: near-miss, why_wrong: "Hides a design error and can match traffic you didn't intend."}
    explanation: "In central NAT mode, DNAT from the VIP happens first and policies reference the real address, like ASA 8.3+ ACLs."
  - id: M11.03.q04
    type: single
    tier: 4
    stem: "A Check Point rulebase has 1,400 rules. The customer wants the conversion next week. What is your first move?"
    options:
      - {id: a, text: "Export 90 days of hit counts and agree with the owner which rules to drop", correct: true}
      - {id: b, text: "Run the converter on all rules now and review the FortiGate result later", trap: near-miss, why_wrong: "Reviewing 1,400 converted rules afterwards is harder than cleaning first."}
      - {id: c, text: "Convert the top 200 rules by position and allow the rest with any/any", trap: misconception, why_wrong: "Position isn't use; any/any undoes the security the project is for."}
      - {id: d, text: "Rebuild the policy from scratch on the FortiGate with an interview per team", trap: near-miss, why_wrong: "Cleaner design but far longer, and misses flows people forget."}
    explanation: "Usage data first: it shrinks the rulebase and gives the customer evidence for each decision."
  - id: M11.03.q05
    type: multi
    tier: 3
    stem: "Which belong in every migration cutover plan? Select all that apply."
    options:
      - {id: a, text: "Acceptance tests written with the app owners", correct: true}
      - {id: b, text: "A go/no-go time for rolling back in the window", correct: true}
      - {id: c, text: "Clearing ARP or MAC entries on upstream gear", correct: true}
      - {id: d, text: "A temporary any/any rule as the safety net", trap: misconception, why_wrong: "It hides gaps and tends to become permanent."}
      - {id: e, text: "A converter re-run on the final rulebase", trap: near-miss, why_wrong: "Re-running in the window adds unreviewed changes; convert and review beforehand."}
    explanation: "Tests, a decision time and upstream cache handling make a cutover safe; any/any doesn't."

labs:
  - id: M11.03.lab1
    title: Recreate an ASA level-based allow
    goal: "Write the FortiGate policy for a flow the ASA allowed by security level."
    worked:
      config: |
        config firewall policy
        edit 20
        set name "inside-to-dmz-migrated"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "inside-net"
        set dstaddr "dmz-net"
        set action accept
        set schedule "always"
        set service "HTTPS" "SSH"
        set logtraffic all
        next
        end
    faded:
      template: |
        config firewall policy
        edit 21
        set srcintf "{{port3}}"
        set dstintf "{{port1}}"
        set srcaddr "dmz-net"
        set dstaddr "all"
        set action {{accept}}
        set nat {{enable}}
        next
        end
    solo:
      prompt: "Add policy 22 'inside-to-outside' from port2 to port1, source inside-net, any destination, HTTP/HTTPS, NAT on, log all."
      required: ["edit 22", "port2", "port1", "inside-net", "nat enable", "logtraffic all"]
      solution: |
        config firewall policy
        edit 22
        set name "inside-to-outside"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "inside-net"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS"
        set nat enable
        set logtraffic all
        next
        end
      notes: "Prefer named services from the hit-count data over ALL."

scenarios:
  - id: M11.03.sc1
    kind: situation
    tier: 4
    title: "Monday after the ASA cutover"
    situation: "Saturday's ASA → FortiGate cutover passed the acceptance tests. Monday 08:30: payroll can't reach the bank's SFTP and the IT manager asks for 'any/any until you fix it'."
    ask: "What do you do?"
    right_thinking:
      - "Decline any/any politely; offer a fast specific fix"
      - "Filter deny logs for the payroll host, find the flow (likely a level-based allow or an object missing)"
      - "Add the specific policy, test with the user, update the workbook and acceptance tests"
    what: "Specific fix from logs in minutes."
    why: "An any/any rule hides every other gap and tends to stay."
    how: ["Deny logs", "Specific policy", "Update tests"]
    model_answer: "\"I'd rather fix it properly in the next ten minutes. I'll filter the deny logs for the payroll PC, find the SFTP flow — probably something the ASA allowed by security level — and add a policy just for it. Then I'll test with the user and add the flow to our acceptance tests so the remaining sites don't hit it.\""
    best_way: "Specific policy from deny logs, added to the tests."
    rubric: ["declines any/any", "uses logs", "closes the loop"]

interview:
  - id: M11.03.t01
    stage: technical
    question: "What goes wrong most often when migrating from Cisco ASA to FortiGate?"
    testing: "Real migration experience or depth"
    framework: "Hidden behaviour → NAT model → process"
    model_answer: "\"The things the ASA does without config: traffic from higher to lower security levels is allowed with no ACL, so the converter produces nothing for it. Second, NAT: ASA's three NAT sections and real-IP ACLs map best onto FortiGate central NAT, and mixing models causes mismatches. I clean the rulebase with hit counts first, test with app owners, and watch deny logs after cutover.\""
    best_way: "Implicit allows and NAT model, then a clean-test-watch process."
    target: "0:45"
