  - {id: M11.03.c02, unit: M11.03.u1, tier: 2, front: "PAN-OS default rules", back: "Intrazone allow, interzone deny; FortiGate denies intra-interface too."}
  - {id: M11.03.c03, unit: M11.03.u1, tier: 3, front: "ASA 8.3+ ACL addresses", back: "Real (untranslated) IPs, like FortiGate central NAT policies."}
  - {id: M11.03.c04, unit: M11.03.u1, tier: 3, front: "Policy NAT vs central NAT destination", back: "Policy NAT: VIP object in the policy. Central NAT: real (mapped) IP."}
  - {id: M11.03.c05, unit: M11.03.u2, tier: 3, front: "Hit-count window", back: "60–90 days, covering month-end and quarter-end."}
