  - { id: M6.03.c11, unit: M6.03.u3, tier: 2, front: "Six-step investigation routine?", back: "Scope, FortiView, Asset Identity Center, Log View, correlate, decide and document." }

quiz:
  - id: M6.03.q01
    type: single
    tier: 1
    pretest: true
    stem: FortiView shows no data for dates older than 45 days, but Archive holds a year. Why?
    options:
      - {id: a, text: "FortiView reads Analytics logs, and Analytics retention is shorter", correct: true}
      - {id: b, text: "FortiView is hard-limited to 45 days of history in each release", trap: misconception, why_wrong: "The data policy decides how far back FortiView goes."}
      - {id: c, text: "The FortiGates deleted their local copies of the older log files", trap: misconception, why_wrong: "FortiAnalyzer holds its own copies."}
      - {id: d, text: "Archive logs are encrypted at rest until an admin unlocks the ADOM first", trap: near-miss, why_wrong: "Archive logs are compressed, not locked; they need re-indexing."}
    explanation: Data policy decides what's indexed.
    source: FortiAnalyzer 8.0.2 Admin Guide p. 113
  - id: M6.03.q02
    type: single
    tier: 2
    pretest: true
    stem: Where do you look at compressed log files directly?
    options:
      - {id: a, text: "Log View > Log Browse", correct: true}
      - {id: b, text: "FortiView > Top Sources", trap: near-miss, why_wrong: "FortiView reads Analytics, not the compressed files."}
      - {id: c, text: "Reports > Generated", trap: misconception, why_wrong: "Reports also read the Analytics database."}
      - {id: d, text: "Fabric View > Assets", trap: misconception, why_wrong: "Asset and identity data, not raw log files."}
    explanation: Log Browse reads files.
    source: FortiAnalyzer 8.0.2 Admin Guide pp. 158, 179
  - id: M6.03.q03
    type: single
    tier: 2
    stem: You want one view and one report for 30 branch FortiGates without extra storage. Use…
    options:
      - {id: a, text: "A log group of the 30 devices", correct: true}
      - {id: b, text: "A new ADOM for those branches", trap: near-miss, why_wrong: "ADOMs separate administration and storage, adding policy overhead."}
      - {id: c, text: "A device group in Device Manager", trap: near-miss, why_wrong: "Device groups organise devices but aren't a log source for views."}
      - {id: d, text: "Log fetching into a reports ADOM", trap: misconception, why_wrong: "Fetching copies archives and uses storage."}
    explanation: Virtual, up to 100 devices.
    source: FortiAnalyzer 8.0.2 Admin Guide p. 179
  - id: M6.03.q04
    type: multi
    tier: 2
    stem: Which are FortiGate Security log types in FortiAnalyzer? Select all that apply.
    options:
      - {id: a, text: "Intrusion logs", correct: true}
      - {id: b, text: "Web Filter logs", correct: true}
      - {id: c, text: "DNS Query logs", correct: true}
      - {id: d, text: "HA event logs", trap: near-miss, why_wrong: "HA is an Event log, not a Security log."}
      - {id: e, text: "VPN event logs", trap: near-miss, why_wrong: "VPN activity is logged under Event logs."}
    explanation: Security vs Event categories.
    source: FortiAnalyzer 8.0.2 Admin Guide p. 158
  - id: M6.03.q05
    type: order
    tier: 2
    stem: Put the investigation routine in order.
    items: ["Scope the trigger and time window", "FortiView: find the host", "Asset Identity Center: user and endpoint", "Log View: filtered logs", "Correlate DNS, web, IPS, AV", "Decide, contain and document"]
    explanation: Broad to specific, then act.
  - id: M6.03.q06
    type: single
    tier: 3
    format: "first-step"
    stem: "Imported log files from an old FortiGate don't appear in Log View analytics. What do you check first?"
    options:
      - {id: a, text: "That the SQL start-time and Analytics retention cover the imported dates", correct: true}
      - {id: b, text: "That log import is supported for that model's older FortiOS version at all", trap: misconception, why_wrong: "Import is supported; the logs went to archive."}
      - {id: c, text: "That the old FortiGate is in a log group with the current device", trap: near-miss, why_wrong: "Log groups combine views; they don't index imported files."}
      - {id: d, text: "That the device is authorised again under its old serial in the ADOM", trap: near-miss, why_wrong: "Needed for the files to be accepted, but they were imported; indexing is the gap."}
    explanation: The SQL time window must include the imported dates.
    source: FortiAnalyzer 8.0.2 Admin Guide p. 180
  - id: M6.03.q07
    type: single
    tier: 2
    stem: In an incident you need to know which user was on 10.1.20.55 and which other IPs their laptop used. Where?
    options:
      - {id: a, text: "Fabric View > Asset Identity Center", correct: true}
      - {id: b, text: "A user activity report run on demand", trap: near-miss, why_wrong: "Reports are slow for live work and don't map endpoints to IPs."}
      - {id: c, text: "Log Browse on the raw traffic files", trap: near-miss, why_wrong: "Raw files have the IP but no user-endpoint mapping."}
      - {id: d, text: "FortiView > Threats for that address", trap: misconception, why_wrong: "Threat views list detections, not identity."}
    explanation: User-endpoint mapping lives there.
    source: FortiAnalyzer 8.0.2 Admin Guide p. 191

labs:
  - id: M6.03.lab1
    title: Investigate a suspicious download
    goal: A user reports a strange file download yesterday at about 15:00. Write the FortiAnalyzer steps you'd take.
    worked:
      config: |
        1. FortiView > Threats > Top Threats, time: yesterday 14:00–16:00, device: HQ-FGT
        2. Drill into the threat → source IP 10.1.20.55
        3. Fabric View > Asset Identity Center → search 10.1.20.55 → user jdoe, laptop LT-0412
        4. Log View > Security > Antivirus, filter srcip=10.1.20.55 → file name, virus, action
        5. Log View > Security > DNS and Web Filter, same filter → domains looked up and visited before
        6. Log View > Traffic, filter srcip=10.1.20.55 and dstip=<C2 candidate> → any later callbacks?
        7. Incidents & Alerts → raise incident, attach logs, recommend containment
      notes:
        - "Keep the filters visible in screenshots."
        - "DNS → web → AV → traffic tells the story in order."
    faded:
      template: |
        1. FortiView > Threats > {{Top Threats}}
        3. Fabric View > {{Asset Identity Center}}
        4. Log View > Security > {{Antivirus}}, filter srcip=10.1.20.55
        7. Incidents & Alerts → raise {{incident}}
    solo:
      prompt: "Write the Log View filter you'd use to find all traffic from 10.1.20.55 to 203.0.113.66 (use field names srcip and dstip, joined with 'and')."
      required: ["srcip=10.1.20.55", "dstip=203.0.113.66"]
      solution: |
        srcip=10.1.20.55 and dstip=203.0.113.66
      notes: "Narrow the time range first; broad queries over months are slow. The filter builder in Log View shows the exact operator syntax for your version."

scenarios:
  - id: M6.03.sc1
    kind: situation
    tier: 3
    title: '"Show me it''s worth the money"'
    situation: |
      A CIO says the FortiAnalyzer "just sits there". The team never opens it.
    ask: How do you turn it into something they use?
    right_thinking:
      - "Find what they need to know daily and weekly"
      - "Saved views and monitors for the NOC; a morning routine"
      - "Scheduled reports for management; alerts for critical events"
      - "Short training with their own data"
    what: A usage plan built on their questions.
    why: Unused tools are cut at renewal; value comes from routine.
    how: ["Ask the top 3 questions they need answered", "Build views/monitors", "Schedule 2 reports", "Enable key alert handlers", "30-min training"]
    model_answer: |
      I'd ask the team and the CIO what three questions they need answered, like "is anyone infected", "what's using our bandwidth", "are we compliant". Then I'd build saved views and a monitor for the NOC screen, a ten-minute morning routine, two scheduled reports for management, and alert handlers for critical events. A 30-minute session with their own data closes it. At Netskope I turned unused capabilities into routines with health checks and dashboards, and that's what moves an account from red to green.
    best_way: "Start from their three questions; give them views, a routine, scheduled reports and alerts, with training on their own data."
    rubric: ["customer questions first", "concrete artefacts", "training", "evidence of value"]

interview:
  - id: M6.03.t01
    stage: technical
    question: Walk me through investigating a malware alert in FortiAnalyzer.
    testing: SOC workflow
    framework: "Routine"
    model_answer: |
      "Scope the alert and time window. In FortiView, find the host in Top Threats or compromised hosts. Use the Asset Identity Center to get the user and endpoint. Then Log View filtered on that IP: DNS and web filter logs for what was looked up and visited, antivirus for the file, traffic logs for any callbacks. Raise an incident with the logs attached and recommend containment."
    best_way: "Scope, FortiView, Asset Identity Center, filtered Log View, correlate, raise an incident."
    target: "0:45"
  - id: M6.03.t02
    stage: technical
    question: Why might FortiView look empty when logs are clearly arriving?
    testing: Troubleshooting
    framework: "Causes"
    model_answer: |
      "FortiView uses Analytics logs, so if the time range is older than Analytics retention it's empty. Other causes: the wrong ADOM, the SQL database rebuilding, FortiView disabled for performance, or the device not authorised so logs aren't inserted."
    best_way: "Analytics retention, wrong ADOM, SQL rebuilding, FortiView disabled, or device not authorised."
    target: "0:30"

field_reports:
  - id: M6.03.fr1
    title: Ransomware leaves a trail first
    body: |
      Ransomware featured in **48 %** of breaches in the 2026 DBIR. The DNS lookups, web connections and callbacks that come before encryption are in the logs; a team that looks every morning can catch them early.
    source: Verizon 2026 DBIR
