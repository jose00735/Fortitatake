  - { id: M6.03.c04, unit: M6.03.u1, tier: 1, front: "Drill-down order?", back: "Time → device → top threat/source → user/IP → sessions → raw logs." }
  - { id: M6.03.c05, unit: M6.03.u2, tier: 2, front: "Log Browse vs Logs view?", back: "Log Browse shows the log files (current and compressed); Logs shows real-time or Analytics logs." }
  - { id: M6.03.c06, unit: M6.03.u2, tier: 2, front: "Three FortiGate log categories?", back: "Traffic, Security (AV, IPS, app control, web/DNS filter, DLP…), Event (system, VPN, HA, user…)." }
  - { id: M6.03.c07, unit: M6.03.u2, tier: 2, front: "Log group limits?", back: "Up to 100 devices; virtual, no extra SQL or disk; VDOMs included automatically." }
