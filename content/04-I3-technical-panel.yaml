quiz:
  - id: I3.q01
    type: order
    tier: 2
    pretest: true
    stem: Put the FortiGate packet flow in order (high level).
    items: ["Ingress", "Destination NAT (VIP)", "Routing decision", "Firewall policy lookup", "Security profiles", "Source NAT", "Egress"]
    explanation: DNAT happens before routing and policy; SNAT near the end.
  - id: I3.q02
    type: single
    tier: 1
    format: "first-step"
    pretest: true
    stem: The panel says "Design SD-WAN for our retail chain." What should you do first?
    options:
      - {id: a, text: "Ask clarifying questions: sites, links, apps, availability, management", correct: true}
      - {id: b, text: "Draw a dual-hub topology with ADVPN, then ask what they'd change on it", trap: near-miss, why_wrong: "A good design may follow, but you'd be designing before you know the requirements."}
      - {id: c, text: "Ask which FortiOS version they run, then design for that release's features", trap: near-miss, why_wrong: "One question isn't discovery; requirements come before versions."}
      - {id: d, text: "Walk through the SD-WAN config blocks in order so they see your CLI depth", trap: misconception, why_wrong: "Commands come much later; they want design thinking."}
    explanation: Clarify, then draw.
  - id: I3.q03
    type: single
    tier: 2
    format: "first-step"
    stem: "'Users can't reach a server through the FortiGate.' Which first two checks follow the packet-flow method?"
    options:
      - {id: a, text: "Sniffer to see packets arrive and leave, then debug flow for route and policy", correct: true}
      - {id: b, text: "Check the traffic logs for denies, then reboot if nothing at all shows up there", trap: near-miss, why_wrong: "Logs help, but a reboot destroys evidence and changes nothing."}
      - {id: c, text: "Debug flow first, then a sniffer if the debug output turns out to be empty", trap: near-miss, why_wrong: "Close, but proving arrival first tells you whether the FortiGate is involved at all."}
      - {id: d, text: "Disable the security profiles on the policy, then retest the server access", trap: misconception, why_wrong: "Changes without proof of where the packet stops."}
    explanation: Prove where it stops.
  - id: I3.q04
    type: single
    tier: 2
    stem: "You don't remember a default value during the panel. Best response?"
    options:
      - {id: a, text: "Give your best understanding and say you'd verify it in the docs", correct: true}
      - {id: b, text: "Give a confident number, since the panels reward decisive answers", trap: misconception, why_wrong: "Panels test honesty; wrong and confident is worse."}
      - {id: c, text: "Say you don't know it and ask to move on to the next question", trap: near-miss, why_wrong: "Honest, but offer what you know and how you'd check first."}
      - {id: d, text: "Explain how you'd find it in the CLI with a question mark there", trap: near-miss, why_wrong: "Good habit, but also give your best understanding of the value."}
    explanation: Honest and practical.
  - id: I3.q05
    type: single
    tier: 2
    stem: Which routing component is evaluated first on FortiGate?
    options:
      - {id: a, text: "Policy routes", correct: true}
      - {id: b, text: "SD-WAN rules", trap: near-miss, why_wrong: "They come after policy routes."}
      - {id: c, text: "Static routes", trap: misconception, why_wrong: "The routing table comes last."}
      - {id: d, text: "Connected routes", trap: misconception, why_wrong: "Connected routes are in the routing table, checked after policy routes."}
    explanation: Policy routes, SD-WAN rules, then the routing table.
  - id: I3.q06
    type: multi
    tier: 3
    stem: Which failure modes are worth naming in a DC HA design? Select all that apply.
    options:
      - {id: a, text: "Split brain if heartbeats share one switch", correct: true}
      - {id: b, text: "Sessions dropping without session pickup", correct: true}
      - {id: c, text: "Override taking primary back after reboot", correct: true}
      - {id: d, text: "Web filter ratings changing after failover", trap: misconception, why_wrong: "Not an HA failure mode."}
      - {id: e, text: "Config drift if one unit isn't in sync", trap: near-miss, why_wrong: "Worth checking, but FGCP syncs config; it's a symptom, not a design failure mode."}
    explanation: Name the failure, then how you designed it out.
  - id: I3.q07
    type: single
    tier: 3
    stem: Why end a whiteboard design with acceptance tests?
    options:
      - {id: a, text: "They define how the customer signs off that the design works", correct: true}
      - {id: b, text: "They let the panel see you know the FortiGate diagnostic commands", trap: near-miss, why_wrong: "A side benefit; the point is agreed proof that it works."}
      - {id: c, text: "They capture the low-level settings, so the LLD itself can stay short", trap: near-miss, why_wrong: "Tests prove behaviour; the LLD still holds the settings."}
      - {id: d, text: "They're a Fortinet requirement for PS projects before any go-live", trap: misconception, why_wrong: "There's no such product requirement; it's delivery practice."}
    explanation: Prove it works; it's what gets signed.
  - id: I3.q08
    type: single
    tier: 2
    stem: In a debug flow, which line shows the policy decision?
    options:
      - {id: a, text: "Allowed by Policy-N, or Denied by forward policy check", correct: true}
      - {id: b, text: "allocate a new session, which follows the policy match", trap: near-miss, why_wrong: "That's session creation, before the policy line."}
      - {id: c, text: "find a route, which picks the policy by egress interface", trap: near-miss, why_wrong: "That's routing; it sets the egress, but the policy line comes after."}
      - {id: d, text: "received a packet, which lists the matched policy's ID", trap: misconception, why_wrong: "That's ingress; no policy is named there."}
    explanation: Policy lines name the policy ID.
  - id: I3.q09
    type: single
    tier: 3
    format: answer-reason
    stem: A panelist asks "Why A-P and not A-A?" for a mid-size DC. Strongest answer?
    options:
      - {id: a, text: "A-P is simpler to run and one unit's throughput fits; A-A adds complexity they don't need", correct: true}
      - {id: b, text: "A-A suits it less, as most sessions would still pass through the primary unit anyway", trap: near-miss, why_wrong: "Partly true, but the deciding reason is that one unit fits and A-P is simpler."}
      - {id: c, text: "A-P gives more throughput, because the secondary keeps its CPU free for the session sync", trap: misconception, why_wrong: "Not the point; one unit handles the traffic either way."}
      - {id: d, text: "A-A would double throughput, but the customer can't afford licences for a second FortiGate", trap: near-miss, why_wrong: "Both modes need two units; the real trade-off is complexity vs need."}
    explanation: Trade-off grounded in requirements.
  - id: I3.q10
    type: single
    tier: 2
    stem: Which design element addresses the risk that VPN gateways are prime targets?
    options:
      - {id: a, text: "Fast patching, MFA, and local-in policies limiting who reaches IKE", correct: true}
      - {id: b, text: "Strong DH groups and AES-256, so that the tunnels can't be broken into", trap: near-miss, why_wrong: "Good crypto, but gateways are breached through bugs and stolen credentials."}
      - {id: c, text: "3DES and DH group 2 enabled as fallbacks for partner compatibility", trap: misconception, why_wrong: "Weakens security without reducing exposure."}
      - {id: d, text: "IKE on a non-standard port, so the gateway is harder for scanners", trap: near-miss, why_wrong: "Obscurity doesn't replace patching, MFA and access limits."}
    explanation: Exposure, identity, patching.

scenarios:
  - id: I3.sc1
    kind: situation
    tier: 3
    title: "Whiteboard: 40 branches, 2 data centres"
    situation: |
      "We have 40 branches with two internet links each, two data centres, Microsoft 365 and an on-prem ERP. Design the network security and WAN."
    ask: Talk through it as you would at the whiteboard, in 3–4 minutes.
    right_thinking:
      - "Clarify: availability, voice, compliance, team skills, existing gear"
      - "Hub-and-spoke overlays to both DCs, BGP, SD-WAN rules per app"
      - "HA pairs in the DCs, FortiManager templates, FortiAnalyzer logs"
      - "Failure modes and acceptance tests"
    what: A structured design with reasons and risks.
    why: It's exactly what you'd do in a design workshop.
    how: ["Questions", "Draw underlay, overlay, hubs", "Rules per app", "Management and logging", "Failure modes", "Acceptance tests"]
    model_answer: |
      I'd start with questions: uptime target, voice at branches, compliance like PCI, and who operates it. Assuming two ISPs per branch: each branch FortiGate builds IPsec overlays to both data centres, with BGP over the overlays so the DCs are reachable over either. SD-WAN zones for underlay and overlay; health checks to the hubs and to Microsoft 365; rules: voice on Best Quality, ERP over the overlay with Lowest Cost (SLA), Microsoft 365 straight out locally using the Internet Service Database. In each DC an FGCP active-passive pair with two heartbeat links and session pickup. Everything is templated in FortiManager, logs go to FortiAnalyzer. Failure modes I'd design out: asymmetric routing between the two hubs, probes that don't reflect the app path, and split brain in the DCs. Acceptance tests: pull each ISP at a pilot branch, fail over each hub, and fail the DC primary during a call.
    best_way: "Clarify, overlays to both DCs with BGP, SD-WAN rules per app, HA pairs, FortiManager and FortiAnalyzer, failure modes, acceptance tests."
    rubric: ["clarifies", "coherent design", "justified choices", "failure modes", "acceptance tests"]
  - id: I3.sc2
    kind: situation
    tier: 3
    title: "Live troubleshooting: 'the website is slow only through the VPN'"
    situation: |
      "Branch users say the intranet is slow and file uploads fail, but only over the site-to-site VPN. Walk us through it."
    ask: Narrate your method and commands.
    right_thinking:
      - "Define: which apps, since when, what changed"
      - "Tunnel state and counters"
      - "Small works, large fails → MTU/MSS"
      - "Prove, fix, verify"
    what: A narrated, evidence-based diagnosis.
    why: Panels judge method and communication as much as the answer.
    how: ["Questions", "get vpn ipsec tunnel summary / diagnose vpn tunnel list", "Ping with DF at sizes", "Sniffer for retransmissions", "MSS clamp on tunnel policies", "Verify uploads"]
    model_answer: |
      First I'd define it: is it all branch users, since when, did anything change, and does browsing small pages work while uploads fail? Then I'd check the tunnel: summary and tunnel list, phase 2 up and counters moving both ways. If small requests work and big transfers fail, I suspect MTU: ESP overhead means full-size packets don't fit, and if ICMP 'fragmentation needed' is blocked, hosts never adjust. I'd prove it with pings with the don't-fragment bit at decreasing sizes and a sniffer showing retransmissions. The fix is clamping TCP MSS on both tunnel policies. Then I'd verify with the users and document it, and add the MSS setting to the VPN template so the next site doesn't repeat it.
    best_way: "Define it, check the tunnel, small-works-big-fails means MTU, prove with DF pings, clamp MSS, verify, template it."
    rubric: ["defines first", "evidence", "correct hypothesis", "fix and prevention"]
  - id: I3.sc3
    kind: hypothetical
    tier: 2
    title: What if the panelist challenges your answer?
    situation: |
      You say SD-WAN rules come after policy routes. A panelist says, "Are you sure? I think SD-WAN rules win."
    ask: How do you respond?
    right_thinking:
      - "Stay calm; it may be a test"
      - "Explain your reasoning and how you'd verify"
      - "Offer the evidence: the commands that show the decision"
    what: A confident, respectful correction with evidence.
    why: Customers will challenge you too.
    how: ["Acknowledge", "Reason", "Verification commands"]
    model_answer: |
      I'd say: "My understanding is that policy routes are checked first, then SD-WAN rules, then the routing table. I've seen it in migrations, where a leftover policy route bypassed a new SD-WAN rule. To confirm on a live unit, diagnose firewall proute list shows the policy routes and SD-WAN rules in the order they're applied, and diagnose ip proute match shows what a given packet would use. Happy to be corrected if a newer version changed it."
    best_way: "Respectfully hold your position with the reasoning and the command that proves it."
    rubric: ["calm", "reasoned", "evidence", "open to correction"]

interview:
  - id: I3.t01
    stage: technical
    question: Walk me through what happens to a packet entering a FortiGate.
    testing: Architecture understanding
    framework: "Ordered steps → how you use it"
    model_answer: |
      "It arrives on an interface, DoS checks apply if configured, it's decrypted if it came through a tunnel, then destination NAT if it matches a VIP. Then the routing decision: policy routes, SD-WAN rules, routing table. Then the firewall policy lookup and session creation, security profiles, source NAT, encryption if it leaves through a tunnel, and egress. I use that order when troubleshooting: debug flow shows exactly where a packet stops."
    best_way: "Ingress, decrypt, DNAT, route, policy, profiles, SNAT, encrypt, egress, and debug flow shows where it stops."
    target: "0:50"
  - id: I3.t02
    stage: technical
    question: A user can't reach a server through the FortiGate. Go.
    testing: Method under pressure
    framework: "Define → sniffer → debug flow → session → fix"
    model_answer: |
      "First the facts: source, destination, port, one user or all, what changed. Then the sniffer on the ingress and egress interfaces to see whether the packet arrives and leaves. If it arrives and doesn't leave, a filtered debug flow tells me the route and the policy decision, or the drop reason. If it leaves and nothing returns, I look downstream and at the return route. Then fix in a window and verify with the user."
    best_way: "Facts, sniffer, debug flow, then downstream; fix and verify."
    target: "0:45"
  - id: I3.t03
    stage: technical
    question: How does FortiGate choose between policy routes, SD-WAN rules and the routing table?
    testing: Routing precision
    framework: "Order → gotcha"
    model_answer: |
      "Policy routes first, then SD-WAN rules, then the routing table. And by default an SD-WAN rule is only consulted if the best route for the destination points to an SD-WAN member. In migrations, leftover policy routes or more specific static routes are the classic reason a new SD-WAN rule seems to be ignored."
    best_way: "Policy routes, SD-WAN rules, routing table, with the FIB check for SD-WAN."
    target: "0:35"
  - id: I3.t04
    stage: technical
    question: Explain the order of NAT and policy matching with a VIP.
    testing: NAT depth (your strongest area)
    framework: "Order → consequence"
    model_answer: |
      "Destination NAT happens before routing and the policy lookup, so the policy for a VIP matches the VIP object or the mapped address depending on configuration, and VIP policies take priority. Source NAT is applied after the policy. I was my TAC team's go-to for NAT, and the common customer mistake was writing the policy against the public IP instead of the VIP."
    best_way: "DNAT before routing and policy, SNAT after; most errors are policies written against the wrong address."
    target: "0:40"
  - id: I3.t05
    stage: technical
    question: Design remote access for 500 users with MFA.
    testing: Design and current options
    framework: "Options → choice → reasons"
    model_answer: |
      "Two options: IPsec dial-up with FortiClient, IKEv2 with EAP and MFA via FortiToken or SAML to their identity provider, or ZTNA if they want per-application access with device posture. For 500 users I'd usually start with IPsec dial-up for full-tunnel needs and plan ZTNA for sensitive apps. Either way: patch the gateway fast, limit who can reach IKE, and log to FortiAnalyzer."
    best_way: "IPsec dial-up with IKEv2 and MFA now, ZTNA for sensitive apps, and harden the gateway."
    target: "0:45"
  - id: I3.t06
    stage: technical
    question: How would you migrate a customer from another firewall vendor to FortiGate?
    testing: Migration thinking
    framework: "Discover → convert → clean → test → cut over"
    model_answer: |
      "Discover the current config and what's actually used, convert with FortiConverter or a scripted approach, then clean up: unused objects, shadowed and overly broad rules, NAT semantics that differ between vendors. Test in a lab, write a MOP with a rollback, cut over in a window, and validate with the customer's application owners. The NAT translation is where most migrations break, so I review it line by line."
    best_way: "Discover, convert, clean, lab-test, MOP with rollback, cut over, validate. NAT is where they break."
    target: "0:50"
  - id: I3.t07
    stage: technical
    question: What's the difference between FortiManager and FortiAnalyzer, and why deploy both?
    testing: Fabric understanding
    framework: "One line each → together"
    model_answer: |
      "FortiManager is central configuration: devices, policy packages, templates, installs and revisions. FortiAnalyzer is central logging and analytics: log storage, FortiView, reports, incidents and automation. Together: you change many FortiGates consistently and you can prove what happened afterwards."
    best_way: "FortiManager changes things consistently; FortiAnalyzer proves what happened."
    target: "0:30"
  - id: I3.t08
    stage: technical
    question: A customer's FortiGate is in conserve mode. What does that mean and what do you do?
    testing: Performance troubleshooting
    framework: "Meaning → thresholds → actions"
    model_answer: |
      "Memory is under pressure: by default it enters red conserve mode at 88 % memory, recovers below 82 %, and extreme at 95 %. Proxy-based inspection may stop accepting new sessions that need it. I'd check memory consumers and sessions, and look at proxy usage. At Fortinet I reduced memory pressure for customers by moving policies from proxy to flow inspection where proxy wasn't needed, which also kept more traffic on the NPU."
    best_way: "Memory pressure at 88 %. Find the consumers; move proxy policies to flow where proxy isn't needed."
    target: "0:45"
  - id: I3.t09
    stage: technical
    question: How do you deploy SSL deep inspection without breaking users?
    testing: Practical rollout
    framework: "CA → pilot → exemptions → phases"
    model_answer: |
      "Use a CA from the customer's PKI, push it by Group Policy and MDM before enabling anything, pilot with IT, exempt banking, health and pinned apps, then roll out by department with a rollback to certificate inspection. I taught customers exactly this, pushing the CA through Group Policy."
    best_way: "CA first via GPO and MDM, pilot, exemptions, phases."
    target: "0:35"
  - id: I3.t10
    stage: technical
    question: What do you check after a cluster upgrade?
    testing: Verification discipline
    framework: "Checklist"
    model_answer: |
      "Both units on the target version, get system ha status showing in sync with heartbeats up, the expected primary, routing and VPN tunnels up, FortiManager and FortiAnalyzer connectivity, and the customer's own application test list. Then a short report. I've guided customers through HA upgrades step by step, including a manual console upgrade when the online one failed, so I always have the backup and console ready."
    best_way: "Versions, HA in sync, routing and VPNs, FMG/FAZ, the customer's test list, then a report."
    target: "0:40"
  - id: I3.t11
    stage: technical
    question: Tell us about a Fortinet issue you escalated to development.
    testing: Depth and collaboration
    framework: "STAR-L short"
    model_answer: |
      "SD-WAN with three ISPs over VPN was duplicating packets. I reproduced it, traced it to specific SLA settings with captures, and worked with development for almost two months with reproductions until the fix."
    best_way: "Packet duplication over three ISPs traced to SLA settings; clean reproductions to development."
