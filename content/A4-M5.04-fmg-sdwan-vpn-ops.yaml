quiz:
  - id: M5.04.q01
    type: single
    tier: 2
    pretest: true
    stem: After running the SD-WAN overlay wizard, what else is required for traffic steering?
    options:
      - { id: a, text: "An SD-WAN template with members, zones, health checks and rules", correct: true }
      - { id: b, text: "Nothing; the overlay includes SD-WAN rules", why_wrong: "The guide states it provides no SD-WAN intelligence." }
      - { id: c, text: "A VPN Manager community", why_wrong: "The overlay already builds the tunnels." }
      - { id: d, text: "A firmware template", why_wrong: "Unrelated to steering." }
    explanation: Overlay = tunnels and BGP; SD-WAN template = intelligence.
    source: FortiManager 7.6.8 Admin Guide p. 584
  - id: M5.04.q02
    type: single
    tier: 2
    pretest: true
    stem: What's the default overlay address space used by the overlay template?
    options:
      - { id: a, text: "10.10.0.0/16", correct: true }
      - { id: b, text: "172.16.0.0/16", why_wrong: "That's the loopback default." }
      - { id: c, text: "192.168.0.0/16", why_wrong: "Not the default." }
      - { id: d, text: "100.64.0.0/10", why_wrong: "Not the default." }
    explanation: Check overlaps with the customer's plan.
    source: FortiManager 7.6.8 Admin Guide p. 586
  - id: M5.04.q03
    type: numeric
    tier: 2
    stem: What BGP AS number does the overlay template use by default?
    answer: 65000
    explanation: Default 65000 for the region.
    source: FortiManager 7.6.8 Admin Guide p. 586
  - id: M5.04.q04
    type: single
    tier: 2
    stem: You created a VPN community but nothing appears on the FortiGates. Most likely missing step?
    options:
      - { id: a, text: "Policies using the VPN and a policy package install to the targets", correct: true }
      - { id: b, text: "A reboot of each FortiGate", why_wrong: "Not required." }
      - { id: c, text: "Enabling ADOMs", why_wrong: "Central VPN works with ADOMs disabled too." }
      - { id: d, text: "A local FDS", why_wrong: "Unrelated." }
    explanation: VPN settings are installed with the policy package.
    source: FortiManager 7.6.8 Admin Guide p. 709
  - id: M5.04.q05
    type: single
    tier: 2
    stem: Branch FortiGates in a factory network have no internet access but need IPS updates. Best option?
    options:
      - { id: a, text: "FortiManager as a local FDS", correct: true }
      - { id: b, text: "Manual signature uploads forever", why_wrong: "Not scalable." }
      - { id: c, text: "Disable IPS", why_wrong: "Removes protection." }
      - { id: d, text: "FortiAnalyzer", why_wrong: "Logs, not updates." }
    explanation: Local FDS serves updates.
    source: FortiManager 7.6.8 Admin Guide p. 913
  - id: M5.04.q06
    type: multi
    tier: 2
    stem: Which are true about FortiManager HA? Select all that apply.
    options:
      - { id: a, text: "Up to five units: one primary and up to four backups", correct: true }
      - { id: b, text: "FortiAnalyzer features must be disabled first", correct: true }
      - { id: c, text: "Units can be in different locations", correct: true }
      - { id: d, text: "Managed FortiGates load-balance across all units for configuration pushes", why_wrong: "Devices work with the primary for management." }
    explanation: Same series, primary for management.
    source: FortiManager 7.6.8 Admin Guide p. 1217
  - id: M5.04.q07
    type: single
    tier: 3
    stem: Which port do FortiManager HA heartbeats use?
    options:
      - { id: a, text: "TCP 5199", correct: true }
      - { id: b, text: "TCP/UDP 703", why_wrong: "That's FortiGate FGCP." }
      - { id: c, text: "UDP 5353", why_wrong: "mDNS." }
      - { id: d, text: "TCP 443", why_wrong: "Not for heartbeats." }
    explanation: TCP 5199.
    source: FortiManager 7.6.8 Admin Guide p. 1219
  - id: M5.04.q08
    type: single
    tier: 3
    stem: Each branch in an overlay template needs a unique value of which variable?
    options:
      - { id: a, text: "branch_id", correct: true }
      - { id: b, text: "hostname only", why_wrong: "The template uses the branch_id metadata variable." }
      - { id: c, text: "AS number", why_wrong: "The region shares an AS by default." }
      - { id: d, text: "Loopback mask", why_wrong: "Not the unique key." }
    explanation: Unique branch_id, auto-assignable.
    source: FortiManager 7.6.8 Admin Guide p. 585

labs:
  - id: M5.04.lab1
    title: Plan an overlay rollout
    goal: Write the planning sheet you'd fill in before running the overlay wizard for 2 hubs and 30 branches.
    worked:
      config: |
        # Overlay planning sheet
        Hubs: HUB-DC1, HUB-DC2 (imported, reachable from branches over ISP links)
        Branch device group: BRANCHES (30 model devices with serials)
        Overlay space: 10.200.0.0/16   (default 10.10.0.0/16 overlaps the customer's DC)
        Loopback space: 172.30.0.0/16  (default 172.16.0.0/16 overlaps the VPN pool)
        BGP AS: 65010                  (65000 already used by the MPLS provider)
        branch_id: Automatic Branch ID Assignment on BRANCHES
        Next: SD-WAN template (Underlay/Overlay zones, health checks, rules) assigned to BRANCHES
      notes:
        - "Every default was checked against the customer's IP and AS plan."
        - "The overlay wizard builds tunnels and BGP; the SD-WAN template adds intelligence."
    faded:
      template: |
        Overlay space: {{10.200.0.0/16}}
        Loopback space: {{172.30.0.0/16}}
        BGP AS: {{65010}}
        branch_id: {{Automatic}} Branch ID Assignment
    solo:
      prompt: "List the four values you must check against the customer's network before running the overlay wizard (one per line): overlay space, loopback space, BGP AS, branch IDs."
      required: ["overlay", "loopback", "bgp as", "branch"]
      solution: |
        overlay space
        loopback space
        BGP AS
        branch IDs
      notes: "And confirm hub-branch reachability first."

scenarios:
  - id: M5.04.sc1
    kind: situation
    tier: 3
    title: The overlay that routes nowhere
    situation: |
      After the overlay wizard and install, tunnels are up but some branches can't reach a data-centre subnet 172.16.40.0/24.
    ask: What's your hypothesis and fix?
    right_thinking:
      - "Default loopback space 172.16.0.0/16 overlaps the DC subnet"
      - "BGP advertises loopbacks; routing conflict"
      - "Re-plan loopback space and reinstall in a window"
    what: Root cause and a planned correction.
    why: Defaults that overlap real networks are a classic rollout trap.
    how: ["Check routing table at a branch for 172.16.40.0", "Compare with loopback allocation", "Change loopback range in template", "Reinstall in a window"]
    model_answer: |
      My first suspect is the default loopback range: the overlay template uses 172.16.0.0/16, which overlaps the customer's 172.16.40.0/24. The branches may be routing it towards a loopback instead of the DC. I'd confirm with the routing table at a branch, then change the template's loopback space to an unused range and reinstall in a window. And I'd add "check every default against the IP plan" to our checklist.
    best_way: "The default 172.16.0.0/16 loopbacks overlap the DC subnet; re-plan and reinstall."
    rubric: ["correct hypothesis", "proof", "planned fix", "prevention"]

interview:
  - id: M5.04.t01
    stage: technical
    question: How would you roll out SD-WAN to many branches with FortiManager?
    testing: Central SD-WAN deployment
    framework: "Plan → overlay → SD-WAN template → install"
    model_answer: |
      "Plan the overlay and loopback ranges, BGP AS and branch IDs against the customer's IP plan. Run the overlay orchestration wizard, which generates the IPsec, BGP and CLI templates for hubs and branches. Then an SD-WAN template with zones, health checks and rules, because the overlay itself has no SD-WAN intelligence. Assign everything to device groups, pre-install to model devices, then zero-touch the branches."
    best_way: "Plan addressing, overlay wizard for tunnels and BGP, SD-WAN template for intelligence, then ZTP."
    target: "0:50"
  - id: M5.04.t02
    stage: technical
    question: How does FortiManager HA work?
    testing: Platform resilience
    framework: "Facts"
    model_answer: |
      "Up to five units of the same series, one primary and up to four backups, possibly in different locations. The primary's database is synchronised to the backups over TCP 5199. Admins and FortiGates use the primary. Failover is manual or automatic with VRRP. FortiAnalyzer features must be off to form the cluster."
    best_way: "Primary plus up to four backups, sync on 5199, manual or VRRP failover."
    target: "0:35"
  - id: M5.04.t03
    stage: technical
    question: When would you use FortiManager as a local FortiGuard server?
    testing: Practical use case
    framework: "Use case → prerequisites"
    model_answer: |
      "When FortiGates can't reach the internet, like OT or air-gapped sites, or to cut internet load. FortiManager syncs updates from FortiGuard and serves them. The devices still need valid licences, the built-in FDS must be enabled, and each FortiGate pointed at it."
    best_way: "Isolated networks or lower internet load; licences, FDS enabled and devices pointed at it."
    target: "0:30"

field_reports:
  - id: M5.04.fr1
    title: Isolated networks still need fresh signatures
    body: |
      With exploitation the top initial access vector (**31 %**, 2026 DBIR), OT and isolated sites can't wait for manual updates. A local FDS keeps IPS and AV current without opening them to the internet.
    source: Verizon 2026 DBIR
