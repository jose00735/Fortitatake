quiz:
  - id: M10.04.q01
    type: single
    tier: 2
    pretest: true
    stem: "You want unapproved remote-access tools unable to connect out from endpoints. Which feature?"
    options:
      - {id: a, text: "Communication control", correct: true}
      - {id: b, text: "Device Control", why_wrong: "USB/external devices."}
      - {id: c, text: "Playbooks", why_wrong: "Automated response, not app allow-listing."}
      - {id: d, text: "Exceptions", why_wrong: "The opposite."}
    explanation: "Communication control governs applications' network access."
  - id: M10.04.q02
    type: multi
    tier: 2
    stem: "Reasonable automatic actions for a Malicious classification on user laptops? Select all that apply."
    options:
      - {id: a, text: "Isolate the device", correct: true}
      - {id: b, text: "Terminate the process and delete the file", correct: true}
      - {id: c, text: "Notify the SOC", correct: true}
      - {id: d, text: "Disable FortiEDR on the device", why_wrong: "Never."}
    explanation: "Contain, clean, tell."
  - id: M10.04.q03
    type: single
    tier: 3
    stem: "An MSSP wants each customer's admins to see only their own endpoints. FortiEDR feature?"
    options:
      - {id: a, text: "Multi-tenancy with organizations", correct: true}
      - {id: b, text: "Collector groups", why_wrong: "Grouping inside one organization."}
      - {id: c, text: "Exceptions", why_wrong: "Unrelated."}
      - {id: d, text: "Separate Aggregator ports", why_wrong: "Not how tenancy works."}
    explanation: "Organizations."

labs:
  - id: M10.04.lab1
    title: Playbook matrix
    goal: "Design playbooks per collector group."
    worked:
      config: |
        # Group: Laptops     Malicious → notify + isolate + remediate + FortiGate block IP
        #                    Suspicious → notify + ticket
        # Group: Servers     Malicious → notify + remediate (process) ; isolation needs approval
        #                    Suspicious → notify
        # Group: Kiosks      Malicious → isolate + remediate ; reimage via IT
        # Integrations: FortiGate (block), FortiSIEM (events), ticketing (ServiceNow)
      notes:
        - "Test each playbook with a harmless test file first."
    faded:
      template: |
        # laptops, malicious → {{isolate}} + remediate
        # servers → isolation needs {{approval}}
    solo:
      prompt: "Name three FortiEDR integration targets, one per line: firewall, siem, sandbox."
      required: ["fortigate", "fortisiem", "fortisandbox"]
      solution: |
        FortiGate
        FortiSIEM (or FortiAnalyzer)
        FortiSandbox
      notes: "Plus ticketing and threat intelligence."

scenarios:
  - id: M10.04.sc1
    kind: situation
    tier: 3
    title: Auto-isolation took down the ERP
    situation: |
      A playbook auto-isolated the ERP server after a Suspicious event that turned out to be a backup agent.
    ask: "What do you change?"
    right_thinking:
      - "Separate playbooks for servers; no auto-isolation on Suspicious"
      - "Exception for the backup agent"
      - "Approval step for server isolation"
    what: "A safer automation design."
    why: "Automation must match business impact."
    how: ["Groups", "Thresholds", "Approval", "Exception"]
    model_answer: |
      "Automatic isolation should only fire on Malicious, and never automatically on critical servers. I'd split the
      ERP and other servers into their own group with a playbook that notifies and waits for approval before isolating,
      add an exception for the backup agent after verifying it, and review the other playbooks the same way."
    best_way: "Match automation to impact."
    rubric: ["separates servers", "approval step", "fixes the false positive"]

interview:
  - id: M10.04.t01
    stage: technical
    question: "How does FortiEDR fit into the Fortinet Security Fabric?"
    testing: "Integration view"
    framework: "Detect → share → act"
    model_answer: |
      "FortiEDR detects and stops malicious actions on the endpoint, then shares that: events to FortiAnalyzer or
      FortiSIEM for correlation, and actions to FortiGate to block the C2 or quarantine the host on the network. With
      playbooks the whole chain can run in seconds, with approval where impact is high."
    best_way: "Endpoint, then network, then SOC."
    target: "0:30"
