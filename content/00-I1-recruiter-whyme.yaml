quiz:
  - id: I1.q01
    type: single
    tier: 1
    pretest: true
    stem: "The recruiter asks: 'Tell me about yourself.' What should the first answer be?"
    options:
      - {id: a, text: "A 30–60 s pitch: who you are, two proof points, why this role", correct: true}
      - {id: b, text: "Your career story from university onward, so they see the arc", trap: misconception, why_wrong: "Too long; they'll ask for more if they want it."}
      - {id: c, text: "Your certifications and products, as the proof of technical depth", trap: near-miss, why_wrong: "Useful proof points, but a list isn't a story and doesn't explain fit."}
      - {id: d, text: "Your current situation first, then a summary of the last role", trap: near-miss, why_wrong: "Leads with the weakest topic instead of your strengths and fit."}
    explanation: Short, structured, ends with why this role.
  - id: I1.q02
    type: single
    tier: 2
    pretest: true
    stem: "'Why did you leave Netskope?' Which answer is best?"
    options:
      - {id: a, text: "A short neutral fact, something positive, and why this role is next", correct: true}
      - {id: b, text: "A full account of what happened, so that nothing looks hidden later on", trap: misconception, why_wrong: "Invites more questions and sounds negative; keep private details private."}
      - {id: c, text: "A one-line fact and then straight to your pitch for this new role", trap: near-miss, why_wrong: "Close, but skipping the positive line can sound abrupt or defensive."}
      - {id: d, text: "That you wanted a change, and that you'd rather not go into detail", trap: near-miss, why_wrong: "Honest, but without a forward-looking reason it reads as evasive."}
    explanation: Neutral, positive, forward-looking. Keep private details private.
  - id: I1.q03
    type: single
    tier: 2
    pretest: true
    stem: The recruiter asks for your salary expectation. Best approach?
    options:
      - {id: a, text: "A researched range for the total monthly package, flexible on structure", correct: true}
      - {id: b, text: "'Whatever you think is fair', so the recruiter can propose a figure", trap: misconception, why_wrong: "It gives away your negotiating anchor."}
      - {id: c, text: "A single number below your real floor, to look easy to work with", trap: misconception, why_wrong: "The first number anchors the offer."}
      - {id: d, text: "A researched base salary figure alone, leaving the benefits aside for now", trap: near-miss, why_wrong: "Research is right, but a total package range leaves room to negotiate structure."}
    explanation: A range anchored on research, as a total package.
  - id: I1.q04
    type: single
    tier: 1
    pretest: true
    stem: When should you mention that the PS manager referred you?
    options:
      - {id: a, text: "Early and naturally, e.g. in your opening or pitch", correct: true}
      - {id: b, text: "At the end, when you ask about next steps in the process", trap: near-miss, why_wrong: "They may already have formed a view; it's context they want early."}
      - {id: c, text: "When they ask how you heard about the role, if they do", trap: near-miss, why_wrong: "They may not ask; mention it once, early."}
      - {id: d, text: "Not at all, as it could look like name-dropping to them", trap: misconception, why_wrong: "A referral is a legitimate, strong signal."}
    explanation: Mention it once, early.
  - id: I1.q05
    type: multi
    tier: 2
    stem: Which of these belong in your 90-second pitch? Select all that apply.
    options:
      - {id: a, text: "Ex-Fortinet TAC P3, escalation point for NAM and Brazil", correct: true}
      - {id: b, text: "Netskope: enterprise accounts, partner PS completion, $900k+ TCV kept", correct: true}
      - {id: c, text: "English, Spanish, Portuguese and readiness to travel", correct: true}
      - {id: d, text: "A cheatsheet figure about the market you can't back up", trap: misconception, why_wrong: "Unverified numbers break under follow-up; use evidenced claims."}
      - {id: e, text: "All certifications you hold, with each exam's date", trap: near-miss, why_wrong: "Certs matter, but a full list with dates eats the 90 seconds."}
    explanation: Evidence, scope, readiness.
  - id: I1.q06
    type: single
    tier: 2
    stem: "'You've worked in support and customer success, not PS. Why should we hire you?' Best response?"
    options:
      - {id: a, text: "Acknowledge it, show the PS pieces you've done, and explain how you'd ramp", correct: true}
      - {id: b, text: "Explain that TAC escalations are close enough to PS that it doesn't really matter", trap: misconception, why_wrong: "Not true, and it shows you don't understand PS."}
      - {id: c, text: "Say you'll learn on the job fast, as you did when moving from TAC to CSM", trap: near-miss, why_wrong: "True but weak without the PS pieces you've already done."}
      - {id: d, text: "List your certifications, as they cover the same ground as PS projects do", trap: near-miss, why_wrong: "Certifications help but don't answer the delivery question."}
    explanation: Honest, specific, forward-looking.
  - id: I1.q07
    type: single
    tier: 2
    stem: How long should most recruiter-screen answers be?
    options:
      - {id: a, text: "About 30–60 seconds, then let them ask more", correct: true}
      - {id: b, text: "3–5 minutes, so they get the whole picture", trap: misconception, why_wrong: "Loses the listener and the time box."}
      - {id: c, text: "Under 15 seconds, to leave time for questions", trap: near-miss, why_wrong: "Too thin to judge fit."}
      - {id: d, text: "About 2 minutes, as in a hiring manager round", trap: near-miss, why_wrong: "Longer answers suit deeper rounds; a screen is quick."}
    explanation: Short answers, more conversation.
  - id: I1.q08
    type: numeric
    tier: 2
    stem: "DBIR 2026: what percentage of breaches with a known initial access vector began with vulnerability exploitation?"
    answer: 31
    explanation: 31 %, now the top vector; credential abuse fell to 13 %.
    source: Verizon 2026 DBIR, Key topics and findings
  - id: I1.q09
    type: single
    tier: 3
    format: "first-step"
    stem: "The recruiter asks if you have questions. Which do you ask first?"
    options:
      - {id: a, text: "What does success look like in six months, and what are the next steps?", correct: true}
      - {id: b, text: "How many vacation days come with the role, and when do benefits start?", trap: near-miss, why_wrong: "Fine later, but weak as the main question in a first screen."}
      - {id: c, text: "How did I do today, and is there a chance I'll move on to the next round?", trap: misconception, why_wrong: "Puts the recruiter on the spot."}
      - {id: d, text: "Which tools does the PS team use, and how big is the LATAM delivery team?", trap: near-miss, why_wrong: "Good for the hiring manager; with the recruiter, ask about success and process."}
    explanation: Ask about success and process.
  - id: I1.q10
    type: single
    tier: 3
    stem: "'Why do you want to come back to Fortinet?' Which answer is strongest?"
    options:
      - {id: a, text: "Deep product knowledge from TAC, the culture, and a role using both skill sets", correct: true}
      - {id: b, text: "The pay and benefits are better than the other offers you have right now", trap: misconception, why_wrong: "Motivation should be about the work."}
      - {id: c, text: "Fortinet is the market leader, so it's the safest next move for your career path", trap: near-miss, why_wrong: "Flattering but generic; it says nothing about you and the role."}
      - {id: d, text: "You prefer firewalls to SASE after two years at Netskope on the cloud side", trap: near-miss, why_wrong: "Sounds like a criticism of your last role; frame it as what you're moving toward."}
    explanation: Product, people, and the role as the natural next step.
  - id: I1.q11
    type: single
    tier: 2
    stem: "IBM 2026: the average global cost of a data breach was…"
    options:
      - {id: a, text: "USD 4.99M", correct: true}
      - {id: b, text: "USD 1.93M", trap: near-miss, why_wrong: "That's the saving from extensive security AI and automation."}
      - {id: c, text: "USD 11.50M", trap: near-miss, why_wrong: "That figure is the US average."}
      - {id: d, text: "USD 6.29M", trap: near-miss, why_wrong: "That's the financial services average."}
    explanation: USD 4.99M globally, up 12 %.
    source: IBM Cost of a Data Breach Report 2026
  - id: I1.q12
    type: single
    tier: 3
    stem: Which positioning line is evidenced and strongest for PS?
    options:
      - {id: a, text: "At Netskope I finished partners' half-delivered PS projects in stages", correct: true}
      - {id: b, text: "I led dozens of Fortinet PS projects across Latin America as owner", trap: misconception, why_wrong: "Not evidenced; it collapses on the first follow-up."}
      - {id: c, text: "I eliminated shadow AI across each enterprise account I managed", trap: near-miss, why_wrong: "Near zero applied to a couple of accounts, not all of them."}
      - {id: d, text: "I have two years of hands-on SASE delivery work from my time at Netskope", trap: near-miss, why_wrong: "Two years is right, but the role was customer success, not delivery."}
    explanation: Use exactly what you can back up.

scenarios:
  - id: I1.sc1
    kind: situation
    tier: 3
    title: "The salary push-back"
    situation: |
      You give your range. The recruiter says: "That's a bit above what we had in mind for this level. Would you consider something lower?"
    ask: What do you say?
    right_thinking:
      - "Don't drop your number immediately"
      - "Ask about the full package and the level they have in mind"
      - "Restate the value you bring to this specific role"
      - "Show flexibility on structure, not on your floor"
    what: Keep the conversation open without anchoring lower.
    why: The first concession sets the offer; understanding the package and level gives you room.
    how: ["Ask what range they have", "Ask about bonus and benefits", "Restate value", "Flexible on structure"]
    model_answer: |
      "I appreciate you telling me. Could you share the range you have for this level, and how the package is structured, bonus and benefits? I'm coming in with Fortinet TAC experience, so I'd ramp up fast. I'm flexible on how the package is built, and I'm sure we can find something that works once I understand the full picture."
    best_way: "Help me understand the full package and the level; I'm flexible on structure, and I'll ramp up fast because I know the product."
    rubric: ["stay calm", "ask before conceding", "restate value", "flexibility on structure"]
  - id: I1.sc2
    kind: situation
    tier: 3
    title: "'Why did it end at Netskope?' - the follow-up"
    situation: |
      You gave your neutral answer. The recruiter asks: "Was it your decision?"
    ask: How do you answer without oversharing or lying?
    right_thinking:
      - "Stay truthful and brief"
      - "Don't volunteer private details"
      - "Pivot to what you learned and what you want next"
    what: A short, truthful, forward-looking answer.
    why: Recruiters screen for red flags in how you talk about exits; calm and brief reads as mature.
    how: ["Brief and truthful", "One positive line", "Pivot to the role"]
    model_answer: |
      "[One truthful sentence in your own words; no details.] I'm at peace with it, and I'm proud of what I did there: enterprise accounts, partner projects and a big escalation I turned around. And it made me choose deliberately what I want next, which is hands-on Fortinet delivery."
    could_have_added: ["Keep it to two or three sentences, then stop and smile"]
    best_way: "One truthful sentence, then: I'm proud of the work, and it made me choose this path on purpose."
    rubric: ["truthful", "brief", "positive", "forward-looking"]
  - id: I1.sc3
    kind: situation
    tier: 2
    title: The English check
    situation: |
      Halfway through, the recruiter switches to English: "Could you describe a technical problem you solved recently, in simple words?"
    ask: Pick a story and say it in about a minute.
    right_thinking:
      - "Choose a story you can tell without jargon"
      - "Problem → what you did → result"
      - "Speak slowly and finish with the impact"
    what: A simple, clear one-minute technical story.
    why: They test clarity and fluency, not depth.
    how: ["Pick the MTU or debug-flow story", "Use simple words", "End with impact"]
    model_answer: |
      "A customer's users could open small web pages over a new VPN, but big downloads froze. The VPN adds extra headers, so large packets no longer fit and were being dropped. I proved it with a packet capture, then told the firewall to make the connections use slightly smaller packets. Downloads worked again, and I added that test to the customer's checklist so it wouldn't happen again."
    best_way: "Small pages worked, big downloads froze; the packets were too big for the tunnel. I made them smaller and it worked."
    rubric: ["clear structure", "simple words", "pace", "impact"]

interview:
  - id: I1.r01
    stage: recruiter
    question: Tell me about yourself.
    testing: Structure, relevance, confidence
    framework: "Who you are → two proof points → why this role"
    model_answer: |
      "I'm a network security engineer with five years in customer-facing security roles. I was a Technical Support Engineer P3 at Fortinet, one of the escalation points for North American and Brazilian enterprise customers, with more than 2,000 cases closed and a CSAT above 4.7. Then I spent two years at Netskope as a Customer Success Manager owning enterprise accounts, where I also finished partners' half-delivered professional-services projects. I was referred by [name] from your PS team, and this role is where my FortiOS depth and my customer work come together."
    best_way: "Fortinet TAC depth plus two years owning enterprise customers: PS is where they meet."
    target: "1:00"
  - id: I1.r02
    stage: recruiter
    question: Why do you want to come back to Fortinet?
    testing: Motivation
    framework: "Company strength → your skills → contribution"
    model_answer: |
      "I know FortiOS from the inside: two years of escalated cases taught me how it behaves and how to fix it. I liked the people and the pace. Coming back on the delivery side, in PS, lets me use that depth together with the customer skills I built at Netskope: planning rollouts, executive reviews and finishing projects others had left half done."
    best_way: "I know the product from inside, and PS lets me use that with the customer skills I built since."
    target: "0:45"
  - id: I1.r03
    stage: recruiter
    question: Why did you leave Netskope?
    testing: Red flags, maturity
    framework: "Neutral fact → positive → forward"
    model_answer: |
      "My time at Netskope ended in September. It was a great two years owning enterprise accounts and working with partners, and it gave me a clear view of what I want next: to go back to hands-on Fortinet work, on the delivery side."
    best_way: "It ended in September; great two years; now I'm choosing hands-on Fortinet delivery on purpose."
    target: "0:30"
  - id: I1.r04
    stage: recruiter
    question: What are your salary expectations?
    testing: Preparation, realism
    framework: "Research → range (total package) → flexibility"
    model_answer: |
      "Based on my research for professional services roles like this in Colombia, I'm looking at [your range] per month as a total package. I'm flexible on how it's structured between base, bonus and benefits."
    could_have_added: ["If they share their range first, react to it instead of repeating yours"]
    best_way: "[Your range] per month, total package, flexible on structure."
    target: "0:20"
  - id: I1.r05
    stage: recruiter
    question: When could you start?
    testing: Logistics
    framework: "Direct answer"
    model_answer: |
      "Immediately. I'm available now."
